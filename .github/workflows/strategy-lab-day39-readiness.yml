name: Strategy Lab Day39 Internal Recovery And Honest Readiness Gate
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_operational_controls.py
      - tests/test_strategy_lab_operational_controls.py
      - scripts/strategy_lab/day39_local_recovery_acceptance.py
      - docs/strategy-lab-day39-readiness.md
      - .github/workflows/strategy-lab-day39-readiness.yml
permissions:
  contents: read
jobs:
  day39-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest ruff 'cryptography>=43,<47' 'google-cloud-bigquery>=3.42,<4'
      - run: |
          python -m compileall -q src/aidy/strategy_lab_operational_controls.py tests/test_strategy_lab_operational_controls.py scripts/strategy_lab/day39_local_recovery_acceptance.py
          ruff check src/aidy/strategy_lab_operational_controls.py tests/test_strategy_lab_operational_controls.py scripts/strategy_lab/day39_local_recovery_acceptance.py
      - run: PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_operational_controls.py tests/test_strategy_lab_compute_entitlements.py tests/test_strategy_lab_customer_results.py tests/test_strategy_lab_tenant_vault.py tests/test_strategy_lab_customer_intake.py tests/test_strategy_lab_goldthinker_handoff.py tests/test_strategy_lab_owner_dashboard.py tests/test_strategy_lab_batch_queue.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_regimes.py
      - run: PYTHONPATH=src:. python scripts/strategy_lab/day39_local_recovery_acceptance.py
      - run: PYTHONPATH=src:. python scripts/strategy_lab/day34_private_handoff_acceptance.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('artifacts/strategy_lab/day39/local_recovery.json').read_text())
          p=json.loads(Path('artifacts/strategy_lab/day34_handoff_acceptance.json').read_text())
          assert v['status']=='PARTIAL_EXTERNAL_READINESS_BLOCKED' and v['real_remote_restore'] is False
          assert p['original_untested_gold_edge_sources']==83 and p['real_systems_tested_for_profit']==0
          assert len(p['source_bigquery_job_ids'])==2
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day39-internal-ops-partial-evidence
          path: |
            artifacts/strategy_lab/day39/
            artifacts/strategy_lab/day34_handoff_acceptance.json
