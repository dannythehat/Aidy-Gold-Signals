name: AIDY Recent Cycle Learning Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-recent-cycle-learning-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py

      - name: Recent cycle summary
        shell: bash
        run: |
          set -euo pipefail
          echo "=== recent_cycles ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT
                v.cycle_view_id,
                v.window_start_utc,
                v.decided_at_utc,
                v.observed_state,
                v.view_direction,
                v.view_confidence,
                v.cycle_signature,
                e.environment_version,
                json_array_length(json_extract(e.environment_json,'$.toolbox_coverage')) AS toolbox_items_considered,
                o.resolved_at_utc,
                o.realised_direction,
                o.return_bps,
                o.mfe_bps,
                o.mae_bps,
                o.exact_direction_correct
              FROM aidy_gold_cycle_views v
              LEFT JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
              LEFT JOIN aidy_gold_cycle_outcomes o ON o.cycle_view_id=v.cycle_view_id
              ORDER BY v.window_start_utc DESC
              LIMIT 10;
            "

          echo "=== recent_markers ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              WITH recent AS (
                SELECT cycle_view_id,window_start_utc
                FROM aidy_gold_cycle_views
                ORDER BY window_start_utc DESC
                LIMIT 10
              )
              SELECT
                r.window_start_utc,
                m.surface,
                m.vote,
                m.base_weight,
                m.learned_multiplier,
                m.effective_weight,
                m.selected_score_scope,
                m.selected_score_sample_n,
                m.selected_score_net,
                m.selected_score_accuracy,
                mr.marker_score,
                mr.marker_correct
              FROM recent r
              JOIN aidy_gold_cycle_marker_observations m
                ON m.cycle_view_id=r.cycle_view_id
              LEFT JOIN aidy_gold_cycle_marker_results mr
                ON mr.cycle_view_id=m.cycle_view_id
               AND mr.marker_id=m.marker_id
              ORDER BY r.window_start_utc DESC,m.surface,m.marker_id;
            "

          echo "=== recent_environment_dimensions ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT
                v.window_start_utc,
                e.environment_version,
                json_extract(e.environment_json,'$.learning_dimensions') AS learning_dimensions,
                json_extract(e.environment_json,'$.environment') AS legacy_environment
              FROM aidy_gold_cycle_views v
              JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
              ORDER BY v.window_start_utc DESC
              LIMIT 10;
            "

          echo "=== scorebook_summary ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT
                scope_type,
                COUNT(*) AS score_rows,
                SUM(sample_n) AS total_samples,
                MIN(sample_n) AS min_sample_n,
                MAX(sample_n) AS max_sample_n
              FROM aidy_gold_marker_context_scores
              GROUP BY scope_type
              ORDER BY scope_type;
            "
