name: Strategy Lab Day33 Private Owner Research Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - research/strategy_lab/day33_gold_edge_83_snapshot.json
      - src/aidy/strategy_lab_owner_dashboard.py
      - scripts/strategy_lab/day33_owner_dashboard_acceptance.py
      - tests/test_strategy_lab_owner_dashboard.py
      - docs/strategy-lab-day33-private-owner-dashboard.md
      - .github/workflows/strategy-lab-day33-owner-dashboard.yml

permissions:
  contents: read

jobs:
  day33-private-owner-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install strict validation and real historical source reader
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Compile + strict Ruff owner dashboard, tests and executable
        run: |
          python -m compileall -q src/aidy/strategy_lab_owner_dashboard.py scripts/strategy_lab/day33_owner_dashboard_acceptance.py tests/test_strategy_lab_owner_dashboard.py
          ruff check src/aidy/strategy_lab_owner_dashboard.py scripts/strategy_lab/day33_owner_dashboard_acceptance.py tests/test_strategy_lab_owner_dashboard.py
      - name: Test original 83 frozen source candidates, output safety and earlier queue/provenance
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_owner_dashboard.py tests/test_strategy_lab_batch_queue.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_regimes.py
      - name: Create real owner downloadable HTML and original source-linked audit
        run: PYTHONPATH=src:. python scripts/strategy_lab/day33_owner_dashboard_acceptance.py
      - name: Enforce original 83 and 100 source rows, no invented trading edge or billing
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('artifacts/strategy_lab')
          result=json.loads((base/'day33_owner_dashboard_acceptance.json').read_text())
          assert result["status"]=="PASS",result
          assert result["owner_only_offline_html_created"] is True
          assert result["original_drive_candidate_count"]==83
          assert result["source_drive_live_sync"] is False
          assert result["independently_replayed_synthetic_queue_results"]==100
          assert result["unqualified_nine_factor_scores_promoted"]==0
          assert result["real_gold_strategy_profits_demonstrated"]==0
          assert result["customer_paper_accounts_created"]==0
          assert result["customer_website_published"] is False
          assert result["no_billing"] is True
          assert len(result["independent_xauusd_real_bid_original_read_jobs"])==2
          out=base/'day33'
          data=json.loads((out/'owner_dashboard_data.json').read_text())
          body=(out/'owner_research_dashboard.html').read_text()
          mf=json.loads((out/'manifest.json').read_text())
          assert len(data["candidates"])==83
          assert len(data["batch"]["experiments"])==100
          assert body.count('data-stage="not-tested"')==83
          assert body.count("Synthetic complete")==100
          assert len(mf["files"])==2
          for name, evidence in mf["files"].items():
              p=out/name
              assert p.is_file() and p.stat().st_size==evidence["bytes"]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==evidence["sha256"]
          print("Day33 HTML, 83 real Drive candidates, 100 synthetic jobs and BigQuery original evidence PASS.")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day33-private-owner-research-dashboard-html-and-provenance
          path: |
            artifacts/strategy_lab/day33/
            artifacts/strategy_lab/day33_owner_dashboard_acceptance.json
            artifacts/strategy_lab/day29_canonical_auditable_result.json
          retention-days: 90
