name: AIDY Archive Outbox Watchdog

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aidy-archive-outbox-watchdog.yml"
      - "scripts/aidy_archive_outbox_watchdog.py"
      - "tests/test_day5_archive_outbox_watchdog.py"

permissions:
  contents: read
  issues: write

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  ARCHIVE_MAX_PENDING_AGE_SECONDS: "900"
  ARCHIVE_POISON_ATTEMPTS: "3"

jobs:
  archive-outbox-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout watchdog code
        uses: actions/checkout@v4

      - name: Query bounded pending outbox sample and evaluate durability
        id: watchdog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          database = os.environ['AIDY_D1_DATABASE_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          statements = [
              ("gold", """
                  SELECT 'gold' AS outbox_kind,id,record_type,archive_key,attempts,last_error,created_at
                  FROM archive_outbox INDEXED BY ix_archive_outbox_pending
                  WHERE status='pending'
                  ORDER BY created_at,id
                  LIMIT 25
              """),
              ("cross_market", """
                  SELECT 'cross_market' AS outbox_kind,id,'cross_market' AS record_type,
                         archive_key,attempts,last_error,created_at
                  FROM cross_market_archive_outbox INDEXED BY ix_cross_market_archive_outbox_pending
                  WHERE status='pending'
                  ORDER BY created_at,id
                  LIMIT 25
              """),
          ]
          combined = []
          metadata = []
          last_error = None
          for kind, sql in statements:
              payload = None
              for attempt in range(1, 4):
                  req = urllib.request.Request(
                      endpoint,
                      data=json.dumps({'sql': sql, 'params': []}).encode(),
                      headers={
                          'Authorization': 'Bearer ' + token,
                          'Content-Type': 'application/json',
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.load(response)
                      if not payload.get('success', False):
                          raise RuntimeError(json.dumps(payload.get('errors') or payload, sort_keys=True))
                      break
                  except urllib.error.HTTPError as exc:
                      last_error = f'{kind}:HTTPError {exc.code}: {exc.reason}'
                      if attempt < 3 and (exc.code == 429 or 500 <= exc.code <= 599):
                          time.sleep(2 ** (attempt - 1))
                          continue
                      payload = None
                      break
                  except (urllib.error.URLError, TimeoutError, ConnectionError, RuntimeError) as exc:
                      last_error = f'{kind}:{type(exc).__name__}: {exc}'
                      if attempt < 3:
                          time.sleep(2 ** (attempt - 1))
                          continue
                      payload = None
                      break
              if payload is None:
                  Path('/tmp/aidy-archive-outbox-query-error.txt').write_text(
                      str(last_error or 'unknown D1 outbox query failure') + '\n', encoding='utf-8'
                  )
                  raise SystemExit(1)
              result = payload.get('result') or []
              if len(result) != 1:
                  raise RuntimeError(f'{kind}: unexpected D1 result envelope')
              rows = result[0].get('results') or []
              combined.extend(rows)
              metadata.append({
                  'kind': kind,
                  'row_count': len(rows),
                  'sample_truncated': len(rows) >= 25,
                  'meta': result[0].get('meta') or {},
              })
          Path('/tmp/aidy-archive-outbox-d1.json').write_text(
              json.dumps({
                  'results': combined,
                  'sample_truncated': any(item['sample_truncated'] for item in metadata),
                  'query_metadata': metadata,
              }, sort_keys=True),
              encoding='utf-8',
          )
          print('d1_archive_queries=PASS ' + json.dumps(metadata, sort_keys=True))
          PY
          query_rc=$?
          set -e

          if [ "$query_rc" -ne 0 ]; then
            python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          p=Path('/tmp/aidy-archive-outbox-query-error.txt')
          reason=p.read_text(encoding='utf-8').strip() if p.exists() else 'archive outbox query/evaluation failed'
          d={
              'status':'monitor_error',
              'alert':True,
              'reason':'Cloudflare D1 archive-outbox query failed after bounded retry: '+reason,
              'observed_at_utc':datetime.now(UTC).isoformat(),
          }
          Path('artifacts/aidy-archive-outbox-watchdog.json').write_text(
              json.dumps(d, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          PY
          else
            set +e
            python scripts/aidy_archive_outbox_watchdog.py \
              --d1-json /tmp/aidy-archive-outbox-d1.json \
              --diagnostic artifacts/aidy-archive-outbox-watchdog.json \
              --max-pending-age-seconds "$ARCHIVE_MAX_PENDING_AGE_SECONDS" \
              --poison-attempts "$ARCHIVE_POISON_ATTEMPTS"
            evaluator_rc=$?
            set -e
            if [ "$evaluator_rc" -eq 1 ]; then
              python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          d={
              'status':'monitor_error',
              'alert':True,
              'reason':'archive outbox evaluator failed',
              'observed_at_utc':datetime.now(UTC).isoformat(),
          }
          Path('artifacts/aidy-archive-outbox-watchdog.json').write_text(
              json.dumps(d, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          PY
            fi
          fi

          python - <<'PY'
          import json
          import os
          d=json.load(open('artifacts/aidy-archive-outbox-watchdog.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"alert={'true' if d.get('alert') else 'false'}\n")
              fh.write(f"status={d.get('status','unknown')}\n")
          print('archive_watchdog_status='+str(d.get('status'))+' alert='+str(bool(d.get('alert'))).lower())
          PY

      - name: Preserve archive durability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-archive-outbox-${{ github.run_id }}
          path: artifacts/aidy-archive-outbox-watchdog.json
          if-no-files-found: error
          retention-days: 14

      - name: Raise one archive durability alert
        if: steps.watchdog.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_STATUS: ${{ steps.watchdog.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          title="AIDY archive outbox alert"
          existing="$(gh issue list --state open --search "AIDY archive outbox alert in:title" --json number --jq '.[0].number // empty')"
          body="$(python - <<'PY'
          import json
          d=json.load(open('artifacts/aidy-archive-outbox-watchdog.json', encoding='utf-8'))
          print('\n'.join([
              '# AIDY archive outbox watchdog',
              '',
              f"Status: `{d.get('status')}`",
              f"Reason: {d.get('reason')}",
              f"Observed UTC: `{d.get('observed_at_utc')}`",
              f"Pending sample: `{d.get('pending_sample_count')}`",
              f"Retrying: `{d.get('retrying_count')}`",
              f"Poison threshold items: `{d.get('poison_count')}`",
              f"Max attempts: `{d.get('max_attempts')}`",
              f"Oldest pending age seconds: `{d.get('oldest_pending_age_seconds')}`",
              '',
              'Capture is independently monitored; this alert means D1 evidence is not reaching durable R2 archival cleanly and needs operator attention.',
          ]))
          PY
          )"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
          echo "::error::AIDY archive watchdog status=${WATCHDOG_STATUS}"
          exit 1

      - name: Close recovered archive durability alert
        if: steps.watchdog.outputs.status == 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "AIDY archive outbox alert in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "AIDY archive outbox recovered on run ${GITHUB_RUN_ID}; no pending D1 to R2 archive items remain."
          fi
