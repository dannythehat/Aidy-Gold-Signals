name: AIDY Blocker 1 v9 Fixture Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/blocker1_v9_fixture_freeze.py"
      - ".github/workflows/blocker1-v9-fixture-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixture-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/blocker1-v9-fixture-freeze-20260922
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
      - name: Execute real-builder fixture freeze
        run: |
          uv run python scripts/blocker1_v9_fixture_freeze.py
      - name: Persist generated audit artifacts
        run: |
          set -euo pipefail
          mkdir -p audit/blocker1-v9
          mv blocker1_t1_v9_fixture.json audit/blocker1-v9/blocker1_t1_v9_fixture.json
          mv blocker1_t1_v9_execution.json audit/blocker1-v9/blocker1_t1_v9_execution.json
          git config user.name "aidy-fixture-audit"
          git config user.email "actions@users.noreply.github.com"
          git add audit/blocker1-v9/blocker1_t1_v9_fixture.json audit/blocker1-v9/blocker1_t1_v9_execution.json
          if git diff --cached --quiet; then
            echo "fixture artifacts unchanged"
          else
            git commit -m "Audit Blocker 1 v9 frozen fixture artifacts"
            git push origin HEAD:audit/blocker1-v9-fixture-freeze-20260922
          fi
