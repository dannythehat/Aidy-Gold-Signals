name: AIDY Blocker 1 v9 Fixture Probe

on:
  push:
    branches:
      - audit/blocker1-v9-fixture-freeze-20260922
    paths:
      - "scripts/blocker1_v9_liquidity_probe.py"
      - ".github/workflows/blocker1-v9-fixture-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
      - name: Run real-builder fixture probe
        run: |
          uv run python scripts/blocker1_v9_liquidity_probe.py
