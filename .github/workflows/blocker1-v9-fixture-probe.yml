name: Blocker 1 v9 Fixture Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/blocker1_v9_fixture_probe.py"
      - "scripts/blocker1_v9_full_fixture.py"
      - ".github/workflows/blocker1-v9-fixture-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
      - name: Compile probes
        run: |
          uv run python -m compileall -q scripts/blocker1_v9_fixture_probe.py
          uv run python -m compileall -q scripts/blocker1_v9_full_fixture.py
      - name: Execute liquidity event probe
        run: uv run python scripts/blocker1_v9_fixture_probe.py
      - name: Execute full dual-path fixture validation
        run: uv run python scripts/blocker1_v9_full_fixture.py
      - name: Persist generated fixture evidence on probe branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "blocker1-fixture-bot"
          git config user.email "blocker1-fixture-bot@users.noreply.github.com"
          git add artifacts/blocker1_v9_full_fixture.json artifacts/blocker1_v9_validation_manifest.json
          if git diff --cached --quiet; then
            echo "fixture evidence unchanged"
          else
            git commit -m "test: persist Blocker 1 v9 fixture evidence"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
