name: Oracle Gold source audit and authentic batch 01

on:
  push:
    branches: ['codex/83-source-audit-batch01-20261028']
    paths:
      - 'scripts/oracle_gold/**'
      - 'tests/test_oracle_gold_batch01.py'
      - '.github/workflows/oracle-gold-source-batch01.yml'
      - 'scripts/strategy_lab/s010_run_12month_history.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-gold-batch01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:.
      ORACLE_APEX_ROOT: /tmp/oracle-apex
      ORACLE_S010_ROOT: /tmp/oracle-s010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest pandas numpy google-cloud-bigquery
      - name: Fetch reviewed publisher commits (no data-service credentials in this job)
        run: |
          git clone --quiet https://github.com/sbrakni/MQL5-trading-bot-claude-experiment.git /tmp/oracle-apex
          git -C /tmp/oracle-apex checkout --quiet 3dab20e20a846edae9ac6fcf56d6b090dbba9f98
          git clone --quiet https://github.com/AluminumShark/Tick-Backtest.git /tmp/oracle-s010
          git -C /tmp/oracle-s010 checkout --quiet 61dd6b2dd8b6550f668b828e023d7d808bfd8fbd
      - name: Prove source parity, causality and known publisher lookahead defect
        run: |
          mkdir -p artifacts/oracle_gold/tests
          python -m pytest -q tests/test_oracle_gold_batch01.py tests/test_gold_hunter_oracle_dedup.py tests/test_strategy_lab_s010_backtest.py tests/test_strategy_lab_system_processor.py --junitxml=artifacts/oracle_gold/tests/junit.xml
          python scripts/gold_hunter_oracle_dedup_audit.py --output artifacts/oracle_gold/tests/dedup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-batch01-source-tests
          path: artifacts/oracle_gold/tests/
          retention-days: 90

  bigquery-history:
    needs: source-and-causality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2024, 2025]
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas numpy google-cloud-bigquery
      - name: SELECT-only monthly original M1 validation; one snapshot per year
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: python -m scripts.oracle_gold.history --year ${{ matrix.year }} --out artifacts/oracle_gold/history/${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-history-${{ matrix.year }}
          path: artifacts/oracle_gold/history/${{ matrix.year }}/
          retention-days: 90
          if-no-files-found: error

  r2-2023-month:
    needs: source-and-causality
    if: ${{ github.event.before == '13428282bd972ce6e45679d92820e16433bedd08' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        period: ['202301','202302','202303','202304','202305','202306','202307','202308','202309','202310','202311','202312']
    env:
      PYTHONPATH: src:.
      PERIOD: ${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET original R2 ZIP; source and payload SHA; fixed EST; chronological derivative
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "artifacts/oracle_gold/r2/${PERIOD}"
          npx --yes wrangler@4 r2 object get "aidy-memory-test/strategy-lab/histdata/xauusd/ticks/${PERIOD}/HISTDATA_COM_ASCII_XAUUSD_T_${PERIOD}.zip" --remote --file /tmp/oracle-source.zip
          python scripts/strategy_lab/crossfire_2021_derive_month.py --period "${PERIOD}" --archive /tmp/oracle-source.zip --output "artifacts/oracle_gold/r2/${PERIOD}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-r2-${{ matrix.period }}
          path: artifacts/oracle_gold/r2/${{ matrix.period }}/
          retention-days: 90
          if-no-files-found: error

  r2-year:
    needs: r2-2023-month
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: oracle-gold-r2-*
          path: artifacts/oracle_gold/r2/
          merge-multiple: false
      - run: python -m scripts.oracle_gold.history --year 2023 --r2-root artifacts/oracle_gold/r2 --out artifacts/oracle_gold/history/2023
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-history-2023
          path: artifacts/oracle_gold/history/2023/
          retention-days: 90

  reuse-r2-year:
    needs: source-and-causality
    if: ${{ github.event.before != '13428282bd972ce6e45679d92820e16433bedd08' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for immutable first-run R2 year snapshot (no repeat archive downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            count=$(gh api repos/dannythehat/Aidy-Gold-Signals/actions/runs/40684079400/artifacts --jq '[.artifacts[] | select(.name == "oracle-gold-history-2023")] | length')
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 15
          done
          echo 'Original R2 snapshot unavailable; no synthetic replacement.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: oracle-gold-history-2023
          run-id: 40684079400
          github-token: ${{ github.token }}
          path: artifacts/oracle_gold/history/2023/
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-gold-history-2023
          path: artifacts/oracle_gold/history/2023/
          retention-days: 90

  replay:
    needs: [bigquery-history, r2-year, reuse-r2-year]
    if: ${{ always() && needs.bigquery-history.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: oracle-gold-history-*
          path: artifacts/oracle_gold/downloads/
      - name: No service credentials; reviewed immutable source imports only
        run: |
          git clone --quiet https://github.com/sbrakni/MQL5-trading-bot-claude-experiment.git /tmp/oracle-apex
          git -C /tmp/oracle-apex checkout --quiet 3dab20e20a846edae9ac6fcf56d6b090dbba9f98
          git clone --quiet https://github.com/AluminumShark/Tick-Backtest.git /tmp/oracle-s010
          git -C /tmp/oracle-s010 checkout --quiet 61dd6b2dd8b6550f668b828e023d7d808bfd8fbd
      - name: Replay each verified year; archive every loss and source defect
        run: |
          for year in 2023 2024 2025; do
            folder="artifacts/oracle_gold/downloads/oracle-gold-history-${year}"
            if [ -f "${folder}/manifest.json" ]; then
              python -m scripts.oracle_gold.batch01 --snapshot "${folder}" --apex /tmp/oracle-apex --s010 /tmp/oracle-s010 --out artifacts/oracle_gold/batch01
            else
              mkdir -p artifacts/oracle_gold/batch01
              echo '{"status":"BLOCKED_SOURCE","year":'"${year}"'}' > "artifacts/oracle_gold/batch01/BLOCKED-${year}.json"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-batch01-real-history-ledgers
          path: artifacts/oracle_gold/batch01/
          retention-days: 90
          if-no-files-found: error
