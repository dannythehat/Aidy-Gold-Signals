name: AIDY Day 2 Queue Exception Probe

on:
  push:
    branches:
      - feature/day-2-queue-scheduler-fix
    paths:
      - '.github/workflows/day2-queue-exception-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_ID: b7b899247ecd4f6f897cc468c3bcbb36
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      R2_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy instrumented Python consumer only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          python - <<'PY'
          import json
          p=json.load(open('wrangler.test.example.jsonc'))
          p['d1_databases'][0]['database_name']='aidy-ops-test'
          p['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          p['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          open('wrangler.jsonc','w').write(json.dumps(p,indent=2)+'\n')
          PY
          uv run pywrangler deploy
          curl -fsS https://aidy-signals-test.dannythehat2.workers.dev/health | jq -e '.status=="ok" and .scheduler=="queue-consumer"' >/dev/null

      - name: Push one fresh queue message
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS="$(python - <<'PY'
          import time
          print(int(time.time()*1000))
          PY
          )"
          python - "$NOW_MS" <<'PY' >/tmp/message.json
          import json,sys
          print(json.dumps({'body':{'scheduledTime':int(sys.argv[1]),'cron':'day2-exception-probe'},'content_type':'json'}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/message.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages" \
            | jq -e '.success==true' >/dev/null

      - name: Read exact safe exception diagnostic
        shell: bash
        run: |
          set -euo pipefail
          FOUND=no
          for attempt in $(seq 1 8); do
            if npx --yes wrangler@4 r2 object get "${R2_NAME}/diagnostics/day2-queue-consumer-error.json" --remote --file /tmp/error.json >/dev/null 2>&1; then
              if [ -s /tmp/error.json ]; then FOUND=yes; break; fi
            fi
            sleep 10
          done
          test "$FOUND" = yes || { echo '::error::No diagnostic object produced.'; exit 1; }
          jq '{observed_at,exception_type,message,traceback}' /tmp/error.json
