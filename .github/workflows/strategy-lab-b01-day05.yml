name: Strategy Lab Day05 M1 Quality
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/b01_day05_full_m1_quality.py
      - .github/workflows/strategy-lab-b01-day05.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet 'google-cloud-bigquery>=3.42,<4'
      - run: python scripts/b01_day05_full_m1_quality.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-day05-quality
          path: artifacts/b01_day05_quality.json
          retention-days: 30
