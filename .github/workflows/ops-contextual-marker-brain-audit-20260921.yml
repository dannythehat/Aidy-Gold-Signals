name: AIDY Contextual Marker Brain Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-contextual-marker-brain-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py
      - name: Audit marker brain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== brain_summary ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json             --config wrangler.research.live.jsonc             --command "
              SELECT
                (SELECT COUNT(*) FROM aidy_gold_cycle_environments) AS environments,
                (SELECT COUNT(*) FROM aidy_gold_cycle_marker_observations) AS marker_observations,
                (SELECT COUNT(*) FROM aidy_gold_cycle_marker_results) AS marker_results,
                (SELECT COUNT(*) FROM aidy_gold_marker_context_scores) AS context_score_rows;
            "
          echo "=== 0400_markers ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json             --config wrangler.research.live.jsonc             --command "
              SELECT
                m.surface,m.vote,m.base_weight,m.learned_multiplier,m.effective_weight,
                r.marker_score,r.marker_correct,
                s.scope_type,s.sample_n,s.correct_n,s.incorrect_n,s.net_score,s.accuracy
              FROM aidy_gold_cycle_views v
              JOIN aidy_gold_cycle_marker_observations m ON m.cycle_view_id=v.cycle_view_id
              LEFT JOIN aidy_gold_cycle_marker_results r
                ON r.cycle_view_id=m.cycle_view_id AND r.marker_id=m.marker_id
              LEFT JOIN aidy_gold_marker_context_scores s
                ON s.marker_id=m.marker_id AND s.scope_type='global' AND s.horizon_minutes=15
              WHERE v.window_start_utc='2026-09-21T04:00:00+00:00'
              ORDER BY m.surface,m.marker_id;
            "
          echo "=== toolbox_coverage ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json             --config wrangler.research.live.jsonc             --command "
              SELECT
                v.window_start_utc,
                json_array_length(json_extract(e.environment_json,'$.toolbox_coverage')) AS toolbox_items,
                json_array_length(v.toolbox_used_json) AS directional_surfaces_used,
                v.view_direction,
                v.view_confidence
              FROM aidy_gold_cycle_views v
              JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
              ORDER BY v.window_start_utc DESC
              LIMIT 3;
            "
