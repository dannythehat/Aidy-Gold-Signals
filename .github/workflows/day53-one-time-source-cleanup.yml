name: AIDY Day 53 One-Time Source Cleanup

on:
  push:
    branches: [day53/final-launch-readiness]
    paths:
      - ".github/workflows/day53-one-time-source-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: day53/final-launch-readiness
          fetch-depth: 0
      - name: Apply exact source hygiene edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          storage = Path('src/aidy/twelve_data_storage.py')
          text = storage.read_text(encoding='utf-8')
          old = 'from .twelve_data_market import AGGREGATE_SOURCE, AIDY_SYMBOL, RAW_M1_SOURCE, TwelveDataFetch'
          new = 'from .twelve_data_market import AGGREGATE_SOURCE, AIDY_SYMBOL, TwelveDataFetch'
          if old not in text:
              raise SystemExit('expected Twelve storage import not found')
          storage.write_text(text.replace(old, new, 1), encoding='utf-8')

          entry = Path('src/entry.py')
          text = entry.read_text(encoding='utf-8')
          old_probe = '''                if request_id is not None and isinstance(market_store, D1TwelveDataMarketStore):
                    try:
                        await market_store.finish_request(
                            request_id=request_id,
                            completed_at=datetime.now(UTC),
                            status="failed",
                            error_code=type(exc).__name__,
                        )
                    except Exception:
                        pass
                return Response.json(
'''
          new_probe = '''                if request_id is not None and isinstance(market_store, D1TwelveDataMarketStore):
                    await market_store.finish_request(
                        request_id=request_id,
                        completed_at=datetime.now(UTC),
                        status="failed",
                        error_code=type(exc).__name__,
                    )
                return Response.json(
'''
          if old_probe not in text:
              raise SystemExit('expected manual-probe cleanup block not found')
          text = text.replace(old_probe, new_probe, 1)

          old_bootstrap = '''                if bootstrap_id is not None and isinstance(market_store, D1TwelveDataMarketStore):
                    try:
                        await market_store.finalize_bootstrap(
                            bootstrap_id=bootstrap_id,
                            completed_at=datetime.now(UTC),
                        )
                    except Exception:
                        pass
                return Response.json(
'''
          new_bootstrap = '''                if bootstrap_id is not None and isinstance(market_store, D1TwelveDataMarketStore):
                    await market_store.finalize_bootstrap(
                        bootstrap_id=bootstrap_id,
                        completed_at=datetime.now(UTC),
                    )
                return Response.json(
'''
          if old_bootstrap not in text:
              raise SystemExit('expected bootstrap cleanup block not found')
          entry.write_text(text.replace(old_bootstrap, new_bootstrap, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/aidy/twelve_data_storage.py src/entry.py
      - name: Commit exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aidy/twelve_data_storage.py src/entry.py
          git commit -m "Day53: remove swallowed cleanup failures"
          git push origin HEAD:day53/final-launch-readiness
