name: Strategy Lab Day20 Written Rule Intake Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_written_rule_intake.py
      - tests/test_strategy_lab_written_rule_intake.py
      - research/strategy_lab/fixtures/day20_internal_written_rules.txt
      - docs/strategy-lab-b06-day20-written-intake-v1.md
      - .github/workflows/strategy-lab-day20-written-rule-intake.yml

permissions:
  contents: read

jobs:
  source-to-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install quality and test dependencies
        run: python -m pip install --quiet pytest ruff
      - name: Compile and strict Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_written_rule_intake.py tests/test_strategy_lab_written_rule_intake.py
          ruff check src/aidy/strategy_lab_written_rule_intake.py tests/test_strategy_lab_written_rule_intake.py
      - name: Verify original-text evidence, closed indicator parity and prior Day08–09 rules
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_written_rule_intake.py tests/test_strategy_lab_spec.py tests/test_strategy_lab_rule_validator.py
      - name: Independently record frozen original rule SHA and receipt
        run: |
          sha256sum research/strategy_lab/fixtures/day20_internal_written_rules.txt
          PYTHONPATH=src:tests python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from test_strategy_lab_written_rule_intake import inputs, admit, samples, oracle_cross
          from aidy.strategy_lab_written_rule_intake import evaluate_closed_indicator_cross
          original, wire, evidence = inputs()
          spec, receipt = admit(original, wire, evidence)
          oracle = oracle_cross(samples(), spec.warmup_closed_bars)
          compiled = evaluate_closed_indicator_cross(spec, samples())
          assert compiled == oracle
          assert len(compiled) == 2
          assert not receipt.original_platform_parity_verified
          assert not receipt.independent_human_attestation_verified
          print(json.dumps({
              "status": "PASS",
              "source_sha256": hashlib.sha256(original).hexdigest(),
              "spec_sha256": receipt.spec_sha256,
              "evidence_sha256": receipt.evidence_sha256,
              "evidence_groups": len(receipt.evidence_groups),
              "positive_crossover_signals": len(compiled),
              "oracle_equals_spec_predicate": compiled == oracle,
              "source_is_internal_fixture": receipt.internal_fixture_only,
              "external_platform_parity_verified": receipt.original_platform_parity_verified,
              "independent_human_attestation_verified": receipt.independent_human_attestation_verified,
              "broker_orders_executed": False
          }, sort_keys=True))
          PY
