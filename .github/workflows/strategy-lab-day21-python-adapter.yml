name: Strategy Lab Day21 Restricted Python Adapter Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_python_predicate_adapter.py
      - tests/test_strategy_lab_python_predicate_adapter.py
      - research/strategy_lab/fixtures/day21_internal_python_signal.py.txt
      - docs/strategy-lab-day21-python-adapter-v1.md
      - .github/workflows/strategy-lab-day21-python-adapter.yml
      - src/aidy/strategy_lab_written_rule_intake.py
permissions:
  contents: read
jobs:
  validate-source-safety-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest ruff
      - name: Compile and lint accepted Python source-adapter
        run: |
          python -m compileall -q src/aidy/strategy_lab_python_predicate_adapter.py tests/test_strategy_lab_python_predicate_adapter.py
          ruff check src/aidy/strategy_lab_python_predicate_adapter.py tests/test_strategy_lab_python_predicate_adapter.py
      - name: Hostile source rejection and Day08-Day21 regression
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_python_predicate_adapter.py tests/test_strategy_lab_written_rule_intake.py tests/test_strategy_lab_spec.py tests/test_strategy_lab_rule_validator.py
      - name: Immutable sample source digest
        run: sha256sum research/strategy_lab/fixtures/day21_internal_python_signal.py.txt research/strategy_lab/fixtures/day20_internal_written_rules.txt
      - name: Independent expected Day20 signal parity and status flags
        run: |
          PYTHONPATH=src:tests python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from test_strategy_lab_python_predicate_adapter import accepted, samples, source
          from aidy.strategy_lab_python_predicate_adapter import compare_python_with_spec
          adapter=accepted()
          result=compare_python_with_spec(adapter,samples())
          assert result["signal_count"]==2
          assert result["python_signals_utc"]==result["spec_signals_utc"]
          assert not result["unrestricted_python_executed"]
          assert not result["original_broker_platform_parity"]
          print(json.dumps({
            "status":"PASS", "original_python_source_sha256":hashlib.sha256(source()).hexdigest(),
            "spec_sha256":adapter.spec_sha256,"ast_sha256":adapter.ast_sha256,
            "closed_m5_signal_times_utc":result["python_signals_utc"],
            "untrusted_source_executed":False,
            "independent_third_party_platform_parity":False,
            "real_broker_orders_executed":False
          },sort_keys=True))
          PY
