name: Phase B Memory Loop Rollout

on:
  push:
    branches: [feature/aidy-hub-phase-b-memory-loop-20260913]
    paths:
      - "migrations/d1/0018_aidy_episode_memory.sql"
      - "src/aidy/episode_memory.py"
      - "src/aidy/provider_memory_api.py"
      - "src/provider_entry.py"
      - "tests/test_aidy_episode_memory.py"
      - ".github/workflows/phase-b-memory-loop-rollout.yml"
  workflow_dispatch:

concurrency:
  group: phase-b-memory-loop-rollout
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test
  AIDY_WORKER_NAME: aidy-signals-test

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test exact Phase B rollout head
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q tests/test_aidy_episode_memory.py
          uv run pytest -q

      - name: Build canonical production config
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from types import SimpleNamespace
          from aidy.config import AidySettings
          cfg=json.load(open('wrangler.test.example.jsonc',encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          expected=['*/2 * * * *','5,15,25,35,45,55 * * * *']
          assert cfg['name']==os.environ['AIDY_WORKER_NAME']
          assert cfg['main']=='src/provider_entry.py'
          assert cfg['triggers']['crons']==expected
          assert cfg['queues']['consumers']==[]
          settings=AidySettings.from_worker_env(SimpleNamespace(**cfg['vars']))
          assert settings.capture_enabled is True
          assert settings.market_data_source=='twelve_data'
          assert settings.market_data_ownership=='public_independent'
          json.dump(cfg,open('wrangler.phase-b.live.jsonc','w',encoding='utf-8'),indent=2)
          PY

      - name: Apply permanent episode-memory migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote \
            --config wrangler.phase-b.live.jsonc | tee /tmp/phase-b-migrations.txt
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.live.jsonc \
            --command "SELECT name,type FROM sqlite_master WHERE name IN ('aidy_memory_episodes','aidy_memory_outcomes','aidy_memory_lessons','aidy_memory_retrieval_events','trg_aidy_memory_episode_from_forward','trg_aidy_memory_outcome_from_forward','trg_aidy_memory_lesson_from_outcome','trg_aidy_memory_episodes_no_update') ORDER BY name;" \
            > /tmp/phase-b-schema.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase-b-schema.json',encoding='utf-8'))
          rows=[]
          for batch in p: rows.extend(batch.get('results') or [])
          names={r.get('name') for r in rows}
          required={
            'aidy_memory_episodes','aidy_memory_outcomes','aidy_memory_lessons',
            'aidy_memory_retrieval_events','trg_aidy_memory_episode_from_forward',
            'trg_aidy_memory_outcome_from_forward','trg_aidy_memory_lesson_from_outcome',
            'trg_aidy_memory_episodes_no_update'
          }
          assert required <= names,(required-names,rows)
          print('phase_b_schema_and_append_only_triggers=PASS')
          PY

      - name: Prove historical formal-forward evidence backfilled exactly
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.live.jsonc \
            --command "SELECT (SELECT COUNT(*) FROM aidy_forward_evaluations) AS forward_evaluations,(SELECT COUNT(*) FROM aidy_memory_episodes) AS memory_episodes,(SELECT COUNT(*) FROM aidy_forward_outcomes) AS forward_outcomes,(SELECT COUNT(*) FROM aidy_memory_outcomes) AS memory_outcomes,(SELECT COUNT(*) FROM aidy_memory_lessons) AS memory_lessons;" \
            > /tmp/phase-b-counts.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase-b-counts.json',encoding='utf-8'))
          rows=[]
          for batch in p: rows.extend(batch.get('results') or [])
          assert len(rows)==1,rows
          r=rows[0]
          assert int(r['memory_episodes'])==int(r['forward_evaluations']),r
          assert int(r['memory_outcomes'])==int(r['forward_outcomes']),r
          assert int(r['memory_lessons'])==int(r['forward_outcomes']),r
          print('phase_b_backfill=PASS '+str(r))
          PY
          cat /tmp/phase-b-counts.json

      - name: Prove stored memory cannot gain execution authority
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.live.jsonc \
            --command "SELECT COUNT(*) AS bad FROM aidy_memory_episodes WHERE research_only<>1 OR authoritative_decision_input<>0 UNION ALL SELECT COUNT(*) FROM aidy_memory_outcomes WHERE research_only<>1 OR active_strategy_tuning_allowed<>0 OR authoritative_decision_input<>0 UNION ALL SELECT COUNT(*) FROM aidy_memory_lessons WHERE research_only<>1 OR active_strategy_tuning_allowed<>0 OR authoritative_decision_input<>0;" \
            > /tmp/phase-b-authority.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase-b-authority.json',encoding='utf-8'))
          rows=[]
          for batch in p: rows.extend(batch.get('results') or [])
          assert rows and all(int(r.get('bad') or 0)==0 for r in rows),rows
          print('phase_b_research_only_boundary=PASS')
          PY

      - name: Deploy Worker with protected memory route
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.phase-b.live.jsonc wrangler.jsonc
          uv run pywrangler deploy

      - name: Prove public health and direct Crons survived Phase B
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' \
              "${AIDY_TEST_WORKER_URL}/health?phase_b=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert h.get('status') in {'ok','degraded'},h
          assert h.get('capture_enabled') is True,h
          assert h.get('market_data_source')=='twelve_data',h
          assert h.get('scheduler')=='direct-cron',h
          assert isinstance(h.get('data_health'),dict),h
          PY
            then break; fi
            test "$attempt" -lt 30
            sleep 3
          done
          cat /tmp/health.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${AIDY_WORKER_NAME}/schedules" \
            > /tmp/schedules.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/schedules.json',encoding='utf-8'))
          assert p.get('success') is True,p
          result=p.get('result') or {}
          rows=result.get('schedules') if isinstance(result,dict) else result
          actual=set()
          for row in rows or []:
              if isinstance(row,str): actual.add(row)
              elif isinstance(row,dict) and row.get('cron'): actual.add(str(row['cron']))
          expected={'*/2 * * * *','5,15,25,35,45,55 * * * *'}
          assert expected <= actual,(actual,p)
          print('phase_b_direct_crons=PASS '+','.join(sorted(actual)))
          PY

      - name: Prove protected Hub memory route exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/memory-unauth.txt -w '%{http_code}' \
            "${AIDY_TEST_WORKER_URL}/provider/memory?limit=5")"
          echo "provider_memory_unauth_status=${code}"
          cat /tmp/memory-unauth.txt
          test "$code" = "401"

      - name: Print Phase B production evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.live.jsonc \
            --command "SELECT disposition,data_quality_state,COUNT(*) AS episodes FROM aidy_memory_episodes GROUP BY disposition,data_quality_state ORDER BY disposition,data_quality_state;" \
            | tee /tmp/phase-b-evidence.json
