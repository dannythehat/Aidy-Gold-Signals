# Day 3 final-evidence protection-check trigger; no runtime semantic change.
name: AIDY D1 Row Budget Alert

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aidy-d1-row-budget-alert.yml"
      - "scripts/aidy_d1_budget_monitor.py"

permissions:
  contents: read
  issues: write

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  D1_ROWS_READ_ALERT_THRESHOLD: "3250000"
  D1_ROWS_READ_FREE_LIMIT: "5000000"

jobs:
  check-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4

      - name: Query today's D1 rows read with bounded retry
        id: usage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aidy_d1_budget_monitor.py \
            --max-attempts 3 \
            --base-backoff-seconds 1 \
            --diagnostic artifacts/aidy-d1-budget-diagnostic.json

      - name: Preserve D1 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-d1-budget-diagnostic-${{ github.run_id }}
          path: artifacts/aidy-d1-budget-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Raise one alert issue for the UTC day
        if: steps.usage.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS_READ: ${{ steps.usage.outputs.rows_read }}
          DAY: ${{ steps.usage.outputs.day }}
        shell: bash
        run: |
          set -euo pipefail
          title="AIDY D1 read budget alert ${DAY}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$title" \
              --body "Cloudflare D1 rows_read reached ${ROWS_READ} for ${DAY} UTC. Warning threshold: ${D1_ROWS_READ_ALERT_THRESHOLD} (65% of the ${D1_ROWS_READ_FREE_LIMIT}/day free-tier ceiling). Investigate read amplification before capture reaches the hard limit."
          fi
          echo "::error::AIDY D1 rows_read=${ROWS_READ} is above the ${D1_ROWS_READ_ALERT_THRESHOLD} warning threshold."
          exit 1
