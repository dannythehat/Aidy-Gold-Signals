name: AIDY Day 53 Twelve Data Basic Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/twelve_data_probe.py"
      - "scripts/day53_probe_twelve_data_basic.py"
      - "tests/test_day53_twelve_data_probe.py"
      - "docs/day53-twelve-data-basic-probe.md"
      - ".github/workflows/day53-twelve-data-basic-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROBE_BASE_SHA: 93321334715c415daea8ab1426bc82edebf48fe3

jobs:
  acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact base and probe-only surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PROBE_BASE_SHA" HEAD)" = "$PROBE_BASE_SHA"
          allowed='^(src/aidy/twelve_data_probe.py|scripts/day53_probe_twelve_data_basic.py|tests/test_day53_twelve_data_probe.py|docs/day53-twelve-data-basic-probe.md|.github/workflows/day53-twelve-data-basic-probe.yml)$'
          unexpected="$(git diff --name-only "$PROBE_BASE_SHA"...HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected Twelve Data probe changes:"; echo "$unexpected"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/twelve_data_probe.py scripts/day53_probe_twelve_data_basic.py tests/test_day53_twelve_data_probe.py
          uv run python -m compileall -q src scripts tests

      - name: Focused probe tests
        shell: bash
        run: uv run pytest -q tests/test_day53_twelve_data_probe.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

  live-basic-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIDY_TWELVE_DATA_API_KEY: ${{ secrets.AIDY_TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require main and configured secret
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -n "${AIDY_TWELVE_DATA_API_KEY:-}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Run read-only XAU/USD Basic entitlement and 1m OHLC probe
        shell: bash
        run: |
          set +e
          uv run python scripts/day53_probe_twelve_data_basic.py \
            --output day53_twelve_data_basic_probe.json \
            --outputsize 30
          status=$?
          echo "PROBE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Preserve redacted probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-twelve-data-basic-probe-${{ github.sha }}
          path: day53_twelve_data_basic_probe.json
          if-no-files-found: error
          retention-days: 90

      - name: Require Basic entitlement and real 1-minute OHLC
        shell: bash
        run: |
          set -euo pipefail
          test "${PROBE_EXIT_CODE:-99}" = "0"
          python - <<'PY'
          import json
          result=json.load(open('day53_twelve_data_basic_probe.json', encoding='utf-8'))
          assert result['basic_plan_confirmed'] is True, result
          assert result['time_series_1min_confirmed'] is True, result
          assert result['ohlc_geometry_valid'] is True, result
          assert int(result['non_degenerate_bar_count']) > 0, result
          assert result['ready_for_adapter_build'] is True, result
          PY
