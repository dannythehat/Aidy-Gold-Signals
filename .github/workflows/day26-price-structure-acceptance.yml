name: AIDY Day 26 Price Structure Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/price_structure_v2.py"
      - "src/aidy/context_packet_v3.py"
      - "tests/test_day26_price_structure.py"
      - "scripts/day26_acceptance_support.py"
      - "scripts/day26_price_structure_acceptance.py"
      - "docs/day26-price-structure-contract.md"
      - ".github/workflows/day26-price-structure-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: day26-price-structure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
  AIDY_GCP_PROJECT_ID: aidy-signals
  AIDY_BIGQUERY_DATASET: aidy_analytics_test
  AIDY_BIGQUERY_LOCATION: EU
  DAY26_BASE_SHA: 262bf436dcd948d0dabe554f93d64edb82726121
  DAY26_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Day 25 base and accepted modules untouched
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${DAY26_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$DAY26_BASE_SHA" HEAD
          test "$(git merge-base "$DAY26_BASE_SHA" HEAD)" = "$DAY26_BASE_SHA"
          git diff --exit-code "$DAY26_BASE_SHA" -- \
            src/aidy/feature_engine.py \
            src/aidy/context_packet.py \
            src/aidy/context_packet_v2.py \
            src/aidy/market_sessions.py \
            src/aidy/market_structure_context.py \
            src/aidy/historical_case_context_v2.py \
            src/aidy/analogue_retrieval_v2.py \
            src/aidy/analogue_retrieval_v3.py \
            src/aidy/evidence_grading_v2.py \
            src/aidy/j5_epoch_effect.py \
            scripts/day25_market_structure_acceptance.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static and vocabulary checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            src/aidy/price_structure_v2.py \
            src/aidy/context_packet_v3.py \
            tests/test_day26_price_structure.py \
            scripts/day26_acceptance_support.py \
            scripts/day26_price_structure_acceptance.py
          uv run python -m compileall -q src scripts tests
          ! grep -Eini 'RSI|MACD|Stochastics|Bollinger|Ichimoku|stop hunt|liquidity sweep' \
            src/aidy/price_structure_v2.py src/aidy/context_packet_v3.py

      - name: Run Day 26 focused tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_day26_price_structure.py

      - name: Run full regression suite once
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q

      - name: Install bounded BigQuery dependency
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AIDY_GCP_SERVICE_ACCOUNT_JSON:-}"
          uv pip install 'google-cloud-bigquery>=3.42,<4'

      - name: Run frozen Day 26 warehouse acceptance
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/day26_price_structure_acceptance.py --output-dir day26_artifacts > /tmp/day26-summary.json
          cat /tmp/day26-summary.json

      - name: Enforce Day 26 evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime

          with open("day26_artifacts/summary.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["ok"] is True, result
          assert result["base_sha"] == "262bf436dcd948d0dabe554f93d64edb82726121", result
          assert result["head_sha"] == "${{ github.event.pull_request.head.sha }}", result
          assert result["candidate_store_snapshot_digest"] == "bd3c81b54ec05b2150e6e6ecbdffbc3c1e4f943c6a23c9a8ee4977c1dc1c3a88", result
          assert result["retrospective_anchor_count"] == 36, result
          assert result["retrospective_input_order_reproducible_count"] == 36, result
          assert result["real_pit_probe_count"] == 1, result
          assert result["pit_input_order_reproducible"] is True, result
          assert result["bigquery_evidence"]["result_rows"] == 37, result
          assert all(result["prior_period_known_anchor_counts"].get(key, 0) > 0 for key in ("prior_day", "prior_week", "prior_month")), result
          assert result["retrospective_arrival_latency_fabricated"] is False, result
          assert result["historical_spread_inference_included"] is False, result
          assert result["threshold_based_feed_health_gate_included"] is False, result
          assert result["future_values_used"] is False, result
          assert result["predictive_edge_claimed"] is False, result
          assert result["accepted_prior_modules_modified"] is False, result
          assert datetime.fromisoformat(result["pit_probe_as_of_utc"]) <= datetime.fromisoformat(result["pit_probe_cutoff_utc"]), result
          PY

      - name: Preserve exact Day 26 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day26-price-structure-${{ github.event.pull_request.head.sha }}
          path: day26_artifacts/
          if-no-files-found: error
          retention-days: 90
