name: Day22 Read-Only Published TradingView Reference Probe
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - research/strategy_lab/probes/day22_read_public_tradingview_reference.py
      - .github/workflows/strategy-lab-day22-public-tv-probe.yml

permissions:
  contents: read

jobs:
  source-report-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install unofficial read-only public TradingView report SDK
        run: python -m pip install --quiet 'selectolax>=0.3,<0.4' tradingview-sdk
      - name: Probe two public published TradingView strategies and reports
        run: python research/strategy_lab/probes/day22_read_public_tradingview_reference.py
