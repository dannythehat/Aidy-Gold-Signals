name: Provider Intelligence Day 3 Quota Diagnostic

on:
  push:
    branches: [research/provider-intelligence-20260906]
    paths:
      - ".github/workflows/provider-intelligence-day3-quota-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      CAPTURE_WORKER: aidy-signals-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read live worker non-secret capture settings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/{os.environ['CAPTURE_WORKER']}/settings"
          req=urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.load(response)
          bindings=payload.get('result',{}).get('bindings',[]) or []
          wanted={'AIDY_CAPTURE_ENABLED','AIDY_MARKET_DATA_SOURCE','AIDY_MARKET_DATA_OWNERSHIP','AIDY_MARKET_POLL_SECONDS','AIDY_FORMAL_FORWARD_ENABLED'}
          safe={}
          for b in bindings:
              name=b.get('name')
              if name in wanted:
                  safe[name]=b.get('text') if b.get('type')=='plain_text' else f"<{b.get('type')}>"
          print('live_capture_settings='+json.dumps(safe, sort_keys=True))
          assert str(safe.get('AIDY_CAPTURE_ENABLED','')).lower() == 'true', safe
          assert safe.get('AIDY_MARKET_DATA_SOURCE') == 'twelve_data', safe
          assert float(safe.get('AIDY_MARKET_POLL_SECONDS') or 0) == 300.0, safe
          assert str(safe.get('AIDY_FORMAL_FORWARD_ENABLED','')).lower() == 'false', safe
          PY

      - name: Measure AIDY Twelve request safety ceilings
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/day3-quota.jsonc <<JSON
          {
            "name": "aidy-day3-readonly-quota",
            "compatibility_date": "2026-08-16",
            "d1_databases": [{
              "binding": "AIDY_OPS",
              "database_name": "${AIDY_D1_DATABASE_NAME}",
              "database_id": "${AIDY_D1_DATABASE_ID}"
            }]
          }
          JSON
          NOW="$(date -u +%Y-%m-%dT%H:%M:00+00:00)"
          DAY="$(date -u +%Y-%m-%dT00:00:00+00:00)"
          LAST24="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:00+00:00)"
          SQL="SELECT SUM(CASE WHEN requested_at_utc>='${DAY}' AND requested_at_utc<='${NOW}' THEN internal_accounted_credits ELSE 0 END) AS utc_day_credits, SUM(CASE WHEN requested_at_utc>='${LAST24}' AND requested_at_utc<='${NOW}' THEN internal_accounted_credits ELSE 0 END) AS rolling_24h_credits, SUM(CASE WHEN requested_at_utc>='${DAY}' AND requested_at_utc<='${NOW}' AND request_kind='scheduled_capture' THEN 1 ELSE 0 END) AS utc_day_scheduled_rows, SUM(CASE WHEN requested_at_utc>='${LAST24}' AND requested_at_utc<='${NOW}' AND request_kind='scheduled_capture' THEN 1 ELSE 0 END) AS rolling_scheduled_rows FROM twelve_data_request_ledger WHERE requested_at_utc>='${LAST24}' AND requested_at_utc<='${NOW}';"
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-quota.jsonc --json --command "$SQL" > /tmp/quota.json
          SQL2="SELECT request_kind,status,COUNT(*) AS n,SUM(internal_accounted_credits) AS credits,MAX(requested_at_utc) AS latest FROM twelve_data_request_ledger WHERE requested_at_utc>='${LAST24}' AND requested_at_utc<='${NOW}' GROUP BY request_kind,status ORDER BY request_kind,status;"
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-quota.jsonc --json --command "$SQL2" > /tmp/kinds.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/quota.json', encoding='utf-8'))
          k=json.load(open('/tmp/kinds.json', encoding='utf-8'))
          row=(q[0].get('results') or [{}])[0]
          print('quota='+json.dumps(row, sort_keys=True))
          print('request_kinds='+json.dumps(k[0].get('results') or [], sort_keys=True))
          assert int(row.get('utc_day_credits') or 0) < 720, row
          assert int(row.get('rolling_24h_credits') or 0) < 720, row
          PY
