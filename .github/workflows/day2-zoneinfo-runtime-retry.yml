name: AIDY Day 2 ZoneInfo Runtime Retry Proof

on:
  push:
    branches:
      - feature/day-2-zoneinfo-fix
    paths:
      - '.github/workflows/day2-zoneinfo-runtime-retry.yml'

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_METAAPI_TOKEN: ${{ secrets.AIDY_METAAPI_TOKEN }}
      AIDY_METAAPI_ACCOUNT_ID: 9bcef441-1821-4479-88c7-bcf3d210e9a3
      DIAG_WORKER: aidy-signals-zoneinfo-retry
      DIAG_URL: https://aidy-signals-zoneinfo-retry.dannythehat2.workers.dev
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy isolated fixed capture Worker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync >/dev/null
          cat > src/day2_zoneinfo_retry_entry.py <<'PY'
          from __future__ import annotations
          from datetime import UTC, datetime
          from urllib.parse import urlparse
          from workers import Response, WorkerEntrypoint
          from aidy.cloudflare_storage import D1OperationalEvidenceStore, R2ArchiveStore
          from aidy.config import AidySettings
          from aidy.market_recorder import FAST_TIMEFRAMES, _session_code
          from aidy.runtime import run_capture_cycle
          from aidy.storage_contracts import AidyMarketRepository

          class Default(WorkerEntrypoint):
              async def fetch(self, request):
                  path=urlparse(request.url).path
                  if path == '/health':
                      return Response.json({'ok': True, 'session': _session_code(datetime.now(UTC))})
                  if path != '/capture':
                      return Response('Not found', status=404)
                  operational=D1OperationalEvidenceStore(self.env.AIDY_OPS)
                  repository=AidyMarketRepository(operational, R2ArchiveStore(self.env.AIDY_MEMORY))
                  try:
                      result=await run_capture_cycle(
                          AidySettings.from_worker_env(self.env),
                          repository=repository,
                          now=datetime.now(UTC),
                          timeframes=FAST_TIMEFRAMES,
                          include_market=True,
                          include_fed=False,
                      )
                      market=result.market if result is not None else None
                      return Response.json({
                          'ok': market is not None and market.snapshot_id is not None,
                          'capture_status': market.status if market else None,
                          'market_open': market.market_open if market else None,
                          'stored_candles': market.stored_candles if market else None,
                          'snapshot_written': market.snapshot_id is not None if market else False,
                          'archive_attempted': result.archive.attempted if result else None,
                          'archive_archived': result.archive.archived if result else None,
                          'archive_failed': result.archive.failed if result else None,
                      }, status=200 if market is not None and market.snapshot_id is not None else 500)
                  except Exception as exc:
                      return Response.json({
                          'ok': False,
                          'error_type': type(exc).__name__,
                          'runtime_message': str(exc)[:240] if isinstance(exc, RuntimeError) else None,
                      }, status=500)
          PY
          python - <<'PY'
          import json,os
          cfg={
            'name':os.environ['DIAG_WORKER'],
            'main':'src/day2_zoneinfo_retry_entry.py',
            'compatibility_date':'2026-08-16',
            'compatibility_flags':['python_workers'],
            'vars':{
              'AIDY_ENV':'diagnostic','AIDY_CAPTURE_ENABLED':'true',
              'AIDY_MARKET_POLL_SECONDS':'60','AIDY_SLOW_POLL_SECONDS':'300',
              'AIDY_MARKET_CLOSED_BACKOFF_SECONDS':'900','AIDY_MARKET_STALE_SECONDS':'300',
              'AIDY_FED_RSS_POLL_SECONDS':'120','AIDY_ARCHIVE_FLUSH_LIMIT':'100'},
            'd1_databases':[{'binding':'AIDY_OPS','database_name':'aidy-ops-test','database_id':os.environ['D1_ID'],'migrations_dir':'migrations/d1'}],
            'r2_buckets':[{'binding':'AIDY_MEMORY','bucket_name':'aidy-memory-test'}]
          }
          open('wrangler.jsonc','w',encoding='utf-8').write(json.dumps(cfg,indent=2)+'\n')
          PY
          uv run pywrangler deploy >/tmp/deploy.log 2>&1
          printf '%s' "$AIDY_METAAPI_TOKEN" | npx --yes wrangler@4 secret put AIDY_METAAPI_TOKEN --name "$DIAG_WORKER" >/dev/null
          printf '%s' "$AIDY_METAAPI_ACCOUNT_ID" | npx --yes wrangler@4 secret put AIDY_METAAPI_ACCOUNT_ID --name "$DIAG_WORKER" >/dev/null
          echo 'Isolated fixed Worker deployed; no Cron.'

      - name: Prove fixed session and capture after propagation
        shell: bash
        run: |
          set -euo pipefail
          health='000'
          for i in $(seq 1 30); do
            health="$(curl --max-time 4 -sS -H 'Accept: application/json' -o /tmp/health.json -w '%{http_code}' "$DIAG_URL/health" || true)"
            [ "$health" = '200' ] && break
            sleep 3
          done
          echo "health_http=${health}"
          cat /tmp/health.json 2>/dev/null || true
          echo
          test "$health" = '200'
          jq -e '.ok == true and (.session | type == "string")' /tmp/health.json >/dev/null

          # Give the secret-version update time to propagate before asking a different edge
          # for the expensive capture path. Retry only this isolated diagnostic request.
          sleep 15
          success='no'
          for attempt in 1 2 3; do
            code="$(curl --max-time 30 -sS -H 'Accept: application/json' -o "/tmp/capture-${attempt}.json" -w '%{http_code}' "$DIAG_URL/capture" || true)"
            echo "capture_attempt_${attempt}_http=${code}"
            cat "/tmp/capture-${attempt}.json" 2>/dev/null || true
            echo
            if [ "$code" = '200' ] && jq -e '.ok == true and .snapshot_written == true and .archive_failed == 0' "/tmp/capture-${attempt}.json" >/dev/null 2>&1; then
              cp "/tmp/capture-${attempt}.json" /tmp/capture-success.json
              success='yes'
              break
            fi
            sleep 10
          done
          test "$success" = 'yes'

          python - <<'PY' >/tmp/query.json
          import json
          print(json.dumps({'sql':"SELECT captured_at,capture_status,(bid IS NOT NULL) AS has_bid,(ask IS NOT NULL) AS has_ask,quote_age_seconds,session_code,position_state_json,(latest_m1_id IS NOT NULL) AS has_m1,(latest_m5_id IS NOT NULL) AS has_m5,archive_key FROM market_snapshots ORDER BY captured_at DESC LIMIT 1"}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/query.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query" >/tmp/d1.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/d1.json',encoding='utf-8'))
          rows=((p.get('result') or [{}])[0].get('results') or [])
          if not rows: raise SystemExit('No fixed D1 snapshot')
          print('fixed_snapshot='+json.dumps(rows[0],separators=(',',':')))
          PY

      - name: Delete isolated proof Worker
        if: always()
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${DIAG_WORKER}" || true)"
          echo "delete_http=${code}"
