name: Ops D1 Free Tier Patch

on:
  push:
    branches: [fix/day53-d1-free-tier-read-budget]
    paths:
      - ".github/ops/day53_d1_free_tier_patch.py"
      - ".github/workflows/ops-d1-free-tier-patch.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day53-d1-free-tier-read-budget
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic patch
        run: python .github/ops/day53_d1_free_tier_patch.py

      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        run: |
          uv run ruff check src/aidy/live_gold_storage.py src/aidy/live_gold_recorder.py src/aidy/reference_continuity.py src/aidy/continuity_auditor.py src/entry.py tests/test_day53_d1_free_tier_hot_paths.py tests/test_day53_genuine_live_gold_feed.py tests/test_d1_storage_local.py
          # cloudflare_storage.py has five pre-existing main-branch BLE001/TRY004 findings.
          # Still lint the file, excluding only those legacy rule classes so new defects fail.
          uv run ruff check --ignore BLE001,TRY004 src/aidy/cloudflare_storage.py
          uv run python -m compileall -q src tests

      - name: Focused regression
        run: |
          uv run pytest -q tests/test_day53_d1_free_tier_hot_paths.py tests/test_day53_genuine_live_gold_feed.py tests/test_d1_storage_local.py tests/test_day53_d1_read_budget.py

      - name: Full regression
        run: uv run pytest -q

      - name: Commit verified patch
        env:
          BRANCH: fix/day53-d1-free-tier-read-budget
        run: |
          set -euo pipefail
          rm -f .github/ops/day53_d1_free_tier_patch.py .github/workflows/ops-d1-free-tier-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix AIDY D1 free-tier hot read paths"
          git push origin "HEAD:$BRANCH"
