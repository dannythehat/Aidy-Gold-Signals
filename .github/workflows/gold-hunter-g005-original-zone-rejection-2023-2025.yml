name: Gold Hunter G005 Exact Author 001B M15 H4 Gold Rejection BID ASK 2023-2025

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_hunter_g005_original_zone_rejection.py'
      - 'tests/test_gold_hunter_g005_original_zone_rejection.py'
      - '.github/workflows/gold-hunter-g005-original-zone-rejection-2023-2025.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-original-aidy-three-years:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Verify original 001B publisher code, preregistered choice and rights disclosure
        run: |
          git clone --depth=1 --quiet https://github.com/anirudhatalmale6-alt/xauusd-strategy-backtest /tmp/g005-original
          cd /tmp/g005-original
          test "$(git hash-object src/strategy.py)" = 30f07bb307fa44a428903bc21b0d51dc441d62d5
          test "$(git hash-object src/dataset.py)" = ae303bc82a36c1d5b644f436fb55f0ce03970b54
          test "$(git hash-object src/engine.py)" = 7aed5ffd3fcfbd8642d5299bf342335068cf3ba6
          test "$(git hash-object out/preregistered.json)" = 9d4d379c3e05ee3deb49f0d0255f62e361588c67
          test ! -e LICENSE
          python -c "import json; p=json.load(open('out/preregistered.json'))['001B']; assert p['r_target']==2.0 and p['risk_pct']==0.25"
      - name: Test source interpretation and AIDY accounting without cloud data
        run: |
          python -m compileall -q scripts/gold_hunter_g005_original_zone_rejection.py
          python -m pytest -q tests/test_gold_hunter_g005_original_zone_rejection.py tests/test_gold_hunter_2023_2024_causal_research.py
      - name: Fetch pinned original AIDY archive decoder code ONLY
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Read-only retrieve existing original authenticated 2023 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2023*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2024 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2024*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2025 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Unwrap existing encrypted quote derivatives in isolated CI (no raw source GET)
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Run exact original author 001B zone rejection on genuine M1 BID ASK and separate broker stress
        run: python -m scripts.gold_hunter_external_vol_regime_daily --quotes /tmp/quotes --out artifacts/g005_original_zone_rejection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-g005-original-001B-M15-source-spot-2023-2025
          path: artifacts/g005_original_zone_rejection/
          retention-days: 90
          if-no-files-found: warn
