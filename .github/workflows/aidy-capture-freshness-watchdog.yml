name: AIDY Capture Freshness Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aidy-capture-freshness-watchdog.yml"
      - "scripts/aidy_capture_freshness_watchdog.py"
      - "tests/test_day4_capture_freshness_watchdog.py"

permissions:
  contents: read
  issues: write

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  CAPTURE_STALE_SECONDS: "900"
  CAPTURE_OPEN_GRACE_SECONDS: "900"

jobs:
  capture-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout watchdog code
        uses: actions/checkout@v4

      - name: Query bounded D1 capture and semantic-context heartbeat
        id: watchdog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          endpoint=(
              'https://api.cloudflare.com/client/v4/accounts/'
              + os.environ['CLOUDFLARE_ACCOUNT_ID']
              + '/d1/database/' + os.environ['AIDY_D1_DATABASE_ID'] + '/query'
          )
          sql='''
          WITH latest_success AS (
            SELECT completed_at_utc
            FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_completion_success
            WHERE completed_at_utc IS NOT NULL
              AND status='succeeded' AND request_kind='scheduled_capture'
            ORDER BY completed_at_utc DESC LIMIT 1
          ), latest_request AS (
            SELECT requested_at_utc,status,error_code
            FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_requested_at_credits
            WHERE request_kind='scheduled_capture'
            ORDER BY requested_at_utc DESC LIMIT 1
          ), latest_context AS (
            SELECT captured_at
            FROM market_snapshots INDEXED BY idx_market_snapshots_provider_context_scheduled_success
            WHERE symbol='XAUUSD'
              AND market_data_source='twelve_data'
              AND capture_status='complete'
              AND json_extract(data_availability_json,'$.request_kind')='scheduled_capture'
              AND json_extract(data_availability_json,'$.request_ledger_status')='succeeded'
            ORDER BY captured_at DESC,id DESC LIMIT 1
          )
          SELECT
            s.completed_at_utc AS latest_scheduled_success_utc,
            r.requested_at_utc AS latest_scheduled_request_utc,
            r.status AS latest_scheduled_request_status,
            r.error_code AS latest_scheduled_error_code,
            c.captured_at AS latest_provider_context_snapshot_utc
          FROM (SELECT 1) anchor
          LEFT JOIN latest_success s ON 1=1
          LEFT JOIN latest_request r ON 1=1
          LEFT JOIN latest_context c ON 1=1
          '''
          body=json.dumps({'sql':sql,'params':[]}).encode()
          last_error=None
          for attempt in range(1,4):
              req=urllib.request.Request(endpoint,data=body,headers={
                  'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],
                  'Content-Type':'application/json',
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      payload=json.load(response)
                  if not payload.get('success',False):
                      raise RuntimeError(json.dumps(payload.get('errors') or payload,sort_keys=True))
                  Path('/tmp/aidy-capture-watchdog-d1.json').write_text(
                      json.dumps(payload.get('result') or [],sort_keys=True),encoding='utf-8'
                  )
                  print(f'd1_query=PASS attempts={attempt}')
                  raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  last_error=f'HTTPError {exc.code}: {exc.reason}'
                  if attempt < 3 and (exc.code == 429 or 500 <= exc.code <= 599):
                      time.sleep(2 ** (attempt-1)); continue
                  break
              except (urllib.error.URLError,TimeoutError,ConnectionError,RuntimeError) as exc:
                  last_error=f'{type(exc).__name__}: {exc}'
                  if attempt < 3:
                      time.sleep(2 ** (attempt-1)); continue
                  break
          Path('/tmp/aidy-capture-watchdog-query-error.txt').write_text(
              str(last_error or 'unknown D1 query failure')+'\n',encoding='utf-8'
          )
          raise SystemExit(1)
          PY
          query_rc=$?
          set -e

          if [ "$query_rc" -ne 0 ]; then
            python - <<'PY'
          import json
          from datetime import UTC,datetime
          from pathlib import Path
          reason=Path('/tmp/aidy-capture-watchdog-query-error.txt').read_text(encoding='utf-8').strip()
          d={'status':'monitor_error','alert':True,
             'reason':'Cloudflare D1 heartbeat query failed after bounded retries: '+reason,
             'observed_at_utc':datetime.now(UTC).isoformat(),
             'session_calendar_version':'aidy_gold_session_calendar_ny_v1'}
          Path('artifacts/aidy-capture-freshness-watchdog.json').write_text(
              json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          else
            set +e
            python scripts/aidy_capture_freshness_watchdog.py \
              --d1-json /tmp/aidy-capture-watchdog-d1.json \
              --diagnostic artifacts/aidy-capture-freshness-watchdog.json \
              --stale-seconds "$CAPTURE_STALE_SECONDS" \
              --open-grace-seconds "$CAPTURE_OPEN_GRACE_SECONDS"
            evaluator_rc=$?
            set -e
            if [ "$evaluator_rc" -eq 1 ]; then
              python - <<'PY'
          import json
          from datetime import UTC,datetime
          from pathlib import Path
          d={'status':'monitor_error','alert':True,'reason':'capture freshness evaluator failed',
             'observed_at_utc':datetime.now(UTC).isoformat(),
             'session_calendar_version':'aidy_gold_session_calendar_ny_v1'}
          Path('artifacts/aidy-capture-freshness-watchdog.json').write_text(
              json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
            fi
          fi

          python - <<'PY'
          import json,os
          d=json.load(open('artifacts/aidy-capture-freshness-watchdog.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"alert={'true' if d.get('alert') else 'false'}\n")
              fh.write(f"status={d.get('status','unknown')}\n")
          print('watchdog_status='+str(d.get('status'))+' alert='+str(bool(d.get('alert'))).lower())
          PY

      - name: Preserve capture freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-capture-freshness-${{ github.run_id }}
          path: artifacts/aidy-capture-freshness-watchdog.json
          if-no-files-found: error
          retention-days: 14

      - name: Raise one capture/context freshness alert
        if: steps.watchdog.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_STATUS: ${{ steps.watchdog.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          title="AIDY capture freshness alert ${day}"
          existing="$(gh issue list --state open --search "AIDY capture freshness alert in:title" --json number --jq '.[0].number // empty')"
          body="$(python - <<'PY'
          import json
          d=json.load(open('artifacts/aidy-capture-freshness-watchdog.json',encoding='utf-8'))
          fields=[
              '# AIDY capture + Provider Context freshness watchdog','',
              f"Status: `{d.get('status')}`",f"Reason: {d.get('reason')}",
              f"Observed UTC: `{d.get('observed_at_utc')}`",
              f"Session open: `{d.get('session_open')}`",
              f"Latest scheduled success UTC: `{d.get('latest_scheduled_success_utc')}`",
              f"Latest scheduled request UTC: `{d.get('latest_scheduled_request_utc')}`",
              f"Latest scheduled request status: `{d.get('latest_scheduled_request_status')}`",
              f"Latest scheduled error code: `{d.get('latest_scheduled_error_code')}`",
              f"Latest complete Provider Context snapshot UTC: `{d.get('latest_provider_context_snapshot_utc')}`",
              f"Capture lag seconds: `{d.get('success_lag_seconds')}`",
              f"Provider Context snapshot lag seconds: `{d.get('provider_context_snapshot_lag_seconds')}`",'',
              'Fail-closed: investigate scheduler/queue/capture and complete-snapshot production.'
          ]
          print('\n'.join(fields))
          PY
          )"
          if [ -z "$existing" ]; then gh issue create --title "$title" --body "$body";
          else gh issue comment "$existing" --body "$body"; fi
          echo "::error::AIDY watchdog status=${WATCHDOG_STATUS}"
          exit 1

      - name: Close recovered capture freshness alert
        if: steps.watchdog.outputs.status == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "AIDY capture freshness alert in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "AIDY capture and complete Provider Context freshness recovered on watchdog run ${GITHUB_RUN_ID}."
          fi
