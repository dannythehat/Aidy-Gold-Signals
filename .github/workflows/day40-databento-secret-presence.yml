name: Day 40 Databento secret presence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  databento-secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - name: Verify Databento secret is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABENTO_API_KEY:-}" ]; then
            echo "DATABENTO_API_KEY is not available"
            exit 1
          fi
          echo "DATABENTO_API_KEY is available to GitHub Actions"
