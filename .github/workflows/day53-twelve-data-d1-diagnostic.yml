name: AIDY Day 53 Twelve Data D1 Diagnostic

on:
  push:
    branches:
      - day53/twelve-data-ohlc-adapter
    paths:
      - ".github/workflows/day53-twelve-data-d1-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build read-only D1 config
        shell: bash
        run: |
          cat > /tmp/wrangler-diagnostic.jsonc <<'JSON'
          {"name":"aidy-signals-test","main":"src/entry.py","compatibility_date":"2026-08-16","compatibility_flags":["python_workers"],"d1_databases":[{"binding":"AIDY_OPS","database_name":"aidy-ops-test","database_id":"3588d82a-d686-4430-872d-d4c0e62c3d5d"}]}
          JSON
      - name: Query failed-bootstrap state without vendor calls
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config /tmp/wrangler-diagnostic.jsonc --command "SELECT fetched_at_utc,raw_bar_count,admitted_closed_bar_count,off_session_bar_count,observed_lag_seconds,freshness_state,credit_headers_json,response_digest FROM twelve_data_feed_observations ORDER BY fetched_at_utc DESC LIMIT 12" > /tmp/feed.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config /tmp/wrangler-diagnostic.jsonc --command "SELECT id,captured_at,capture_status,data_availability_json FROM market_snapshots ORDER BY captured_at DESC LIMIT 20" > /tmp/all-snapshots.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config /tmp/wrangler-diagnostic.jsonc --command "SELECT first_observed_at,source,timeframe,COUNT(*) AS n,MIN(open_time_utc) AS min_open,MAX(open_time_utc) AS max_open FROM market_candles WHERE source IN ('twelve_data_vendor_m1_v1','twelve_data_session_aggregate_v1') GROUP BY first_observed_at,source,timeframe ORDER BY first_observed_at DESC,source,timeframe" > /tmp/candle-groups.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config /tmp/wrangler-diagnostic.jsonc --command "SELECT source,timeframe,COUNT(*) AS n FROM market_candles WHERE source IN ('twelve_data_vendor_m1_v1','twelve_data_session_aggregate_v1') GROUP BY source,timeframe ORDER BY source,timeframe" > /tmp/candle-total.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config /tmp/wrangler-diagnostic.jsonc --command "SELECT status,COUNT(*) AS n FROM archive_outbox GROUP BY status ORDER BY status" > /tmp/outbox.json
      - name: Summarize ingest boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          def rows(path):
              p=json.load(open(path,encoding='utf-8')); out=[]
              for b in p: out.extend(b.get('results') or [])
              return out
          feeds=rows('/tmp/feed.json')
          snaps=rows('/tmp/all-snapshots.json')
          groups=rows('/tmp/candle-groups.json')
          totals=rows('/tmp/candle-total.json')
          outbox=rows('/tmp/outbox.json')
          td_snaps=[r for r in snaps if 'twelve_data' in str(r.get('data_availability_json') or '')]
          print('feeds',feeds)
          print('twelve_data_snapshot_count',len(td_snaps))
          print('candle_groups',groups)
          print('candle_totals',totals)
          print('archive_outbox',outbox)
          print('bootstrap_ingest_reached_snapshot_boundary',bool(td_snaps))
          print('vendor_calls_from_diagnostic',0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-twelve-data-d1-diagnostic-${{ github.sha }}
          path: |
            /tmp/feed.json
            /tmp/all-snapshots.json
            /tmp/candle-groups.json
            /tmp/candle-total.json
            /tmp/outbox.json
          retention-days: 30
