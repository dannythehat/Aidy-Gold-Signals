name: Gold Hunter 2025 Causal BID ASK Recheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gold_hunter/open_strategy_lab.py'
      - 'scripts/gold_hunter_2023_2024_causal_research.py'
      - 'tests/test_gold_hunter_open_lab.py'
      - '.github/workflows/gold-hunter-2025-original-bidask-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-source-2025-causal-model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Verify strategy and independent causal regression before private data
        run: |
          python -m pytest -q tests/test_gold_hunter_open_lab.py tests/test_gold_hunter_2023_2024_causal_research.py
      - name: Checkout only the pinned original authenticated-cache decoder
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Recover 2024 December historical-indicator warmup
        uses: actions/download-artifact@v4
        with:
          name: oracle-bidask-202412
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted/oracle-bidask-202412
      - name: Recover 12 original 2025 BID ASK quote archives
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Open existing encrypted original caches (no new cloud source request)
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-202412 /tmp/encrypted/oracle-bidask-2025*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Test 2025 unchanged trading rules against causal BID ASK quote engine
        run: python -m scripts.gold_hunter_2023_2024_causal_research --quotes /tmp/quotes --year 2025 --out artifacts/gold_hunter_2025_causal_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-2025-causal-bidask-recheck
          path: artifacts/gold_hunter_2025_causal_v2/
          retention-days: 90
          if-no-files-found: warn
