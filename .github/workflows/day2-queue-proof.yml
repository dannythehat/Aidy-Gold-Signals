name: AIDY Day 2 Queue Scheduler Proof

on:
  push:
    branches:
      - feature/day-2-queue-scheduler-fix
    paths:
      - '.github/workflows/day2-queue-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      D1_NAME: aidy-ops-test
      R2_NAME: aidy-memory-test
      QUEUE_NAME: aidy-capture-test
      CAPTURE_WORKER: aidy-signals-test
      SCHEDULER_WORKER: aidy-signals-scheduler-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q

      - name: Record D1 baseline and ensure queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          python - <<'PY' >/tmp/baseline.json
          import json
          print(json.dumps({'sql':'SELECT COALESCE(MAX(captured_at),\'\') AS ts FROM market_snapshots'}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/baseline.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query" >/tmp/baseline-out.json
          BASELINE="$(jq -r '.result[0].results[0].ts // ""' /tmp/baseline-out.json)"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
          echo "Baseline snapshot: ${BASELINE:-none}"

          npx --yes wrangler@4 queues list > /tmp/queues.txt
          if ! grep -Fq "$QUEUE_NAME" /tmp/queues.txt; then
            npx --yes wrangler@4 queues create "$QUEUE_NAME" --message-retention-period-secs 86400
          fi
          npx --yes wrangler@4 queues list | grep -F "$QUEUE_NAME"

      - name: Build runtime config and deploy Python consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('wrangler.test.example.jsonc'))
          p['d1_databases'][0]['database_name']='aidy-ops-test'
          p['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          p['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          open('wrangler.jsonc','w').write(json.dumps(p,indent=2)+'\n')
          PY
          uv run pywrangler deploy
          curl -fsS "https://aidy-signals-test.dannythehat2.workers.dev/health" | tee /tmp/health.json
          jq -e '.status=="ok" and .capture_enabled==true and .scheduler=="queue-consumer"' /tmp/health.json >/dev/null

      - name: Deploy minimal Cron producer
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.scheduler.test.jsonc
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CAPTURE_WORKER}/schedules" >/tmp/capture-schedules.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCHEDULER_WORKER}/schedules" >/tmp/scheduler-schedules.json
          jq -e '.success and ((.result.schedules // [])|length)==0' /tmp/capture-schedules.json >/dev/null
          jq -e '.success and ((.result.schedules // [])|map(.cron)|index("* * * * *") != null)' /tmp/scheduler-schedules.json >/dev/null
          npx --yes wrangler@4 queues consumer worker list "$QUEUE_NAME" --json | tee /tmp/consumers.json
          jq -e 'map(select(.script_name=="aidy-signals-test"))|length==1' /tmp/consumers.json >/dev/null

      - name: Wait only for one real scheduled queue capture
        shell: bash
        run: |
          set -euo pipefail
          FOUND=no
          for attempt in $(seq 1 10); do
            python - <<PY >/tmp/query.json
          import json
          print(json.dumps({'sql':'''SELECT id,captured_at,capture_status,bid,ask,spread,quote_age_seconds,position_state_json,event_observation_ids_json,latest_m1_id,latest_m5_id,archive_key FROM market_snapshots WHERE captured_at > ? AND capture_status IN ('complete','partial') AND bid IS NOT NULL AND ask IS NOT NULL AND latest_m1_id IS NOT NULL AND latest_m5_id IS NOT NULL ORDER BY captured_at DESC LIMIT 1''','params':['${BASELINE}']}))
          PY
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/query.json \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query" >/tmp/query-out.json
            if [ "$(jq '.result[0].results|length' /tmp/query-out.json)" -gt 0 ]; then FOUND=yes; break; fi
            sleep 20
          done
          test "$FOUND" = yes || { echo '::error::No queue-backed scheduled capture arrived within 200 seconds.'; exit 1; }
          jq '.result[0].results[0]' /tmp/query-out.json
          jq -e '.result[0].results[0].position_state_json=="[]"' /tmp/query-out.json >/dev/null
          jq -e '(.result[0].results[0].quote_age_seconds|tonumber) <= 300' /tmp/query-out.json >/dev/null
          SNAP_KEY="$(jq -r '.result[0].results[0].archive_key' /tmp/query-out.json)"
          test -n "$SNAP_KEY"
          echo "SNAP_KEY=$SNAP_KEY" >> "$GITHUB_ENV"

      - name: Prove all timeframes Fed linkage R2 and clean outbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/final-query.json
          import json
          sql='''SELECT
          (SELECT COUNT(DISTINCT timeframe) FROM market_candles WHERE timeframe IN ('1m','5m','15m','1h','4h','1d')) AS timeframe_count,
          (SELECT COUNT(*) FROM market_event_observations) AS event_count,
          (SELECT COUNT(*) FROM archive_outbox WHERE status IN ('pending','failed')) AS bad_outbox,
          (SELECT event_observation_ids_json FROM market_snapshots ORDER BY captured_at DESC LIMIT 1) AS linked_events'''
          print(json.dumps({'sql':sql}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/final-query.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query" >/tmp/final-out.json
          jq '.result[0].results[0]' /tmp/final-out.json
          jq -e '.result[0].results[0].timeframe_count==6' /tmp/final-out.json >/dev/null
          jq -e '.result[0].results[0].event_count>0' /tmp/final-out.json >/dev/null
          jq -e '.result[0].results[0].bad_outbox==0' /tmp/final-out.json >/dev/null
          jq -e '(.result[0].results[0].linked_events|fromjson|length)>0' /tmp/final-out.json >/dev/null
          npx --yes wrangler@4 r2 object get "${R2_NAME}/${SNAP_KEY}" --remote --file /tmp/snapshot-r2.json >/dev/null
          test -s /tmp/snapshot-r2.json
          echo 'DAY 2 QUEUE SCHEDULER PROOF PASSED'
