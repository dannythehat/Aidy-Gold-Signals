name: Strategy Lab Day22 Genuine History Pine Internal Parity CI

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/strategy_lab/day22_real_history_ema_audit.py
      - tests/test_strategy_lab_day22_real_history.py
      - .github/workflows/strategy-lab-day22-real-history.yml
      - docs/strategy-lab-day22-real-history-audit.md

permissions:
  contents: read

jobs:
  verify-genuine-source-internal-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification libraries
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Compile and lint source and audit tests
        run: |
          python -m compileall -q scripts/strategy_lab/day22_real_history_ema_audit.py tests/test_strategy_lab_day22_real_history.py
          ruff check scripts/strategy_lab/day22_real_history_ema_audit.py tests/test_strategy_lab_day22_real_history.py
      - name: Source fidelity and fail-closed tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_strategy_lab_day22_real_history.py tests/test_strategy_lab_pine_adapter.py tests/test_strategy_lab_customer_pine_intake.py tests/test_strategy_lab_tv_chart_csv.py
      - name: Actual source-preserving BigQuery 2025 M1 to M5 EMA and crossover audit
        run: PYTHONPATH=src:. python scripts/strategy_lab/day22_real_history_ema_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day22-genuine-history-independent-ema-audit
          path: artifacts/strategy_lab/day22_real_history_ema_audit.json
          retention-days: 90
