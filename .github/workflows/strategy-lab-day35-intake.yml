name: Strategy Lab Day35 Safe Strategy Intake

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_customer_intake.py
      - web/strategy_lab/day35_private_intake_preview.html
      - scripts/strategy_lab/day35_strategy_intake_acceptance.py
      - tests/test_strategy_lab_customer_intake.py
      - docs/strategy-lab-day35-safe-customer-intake.md
      - .github/workflows/strategy-lab-day35-intake.yml

permissions:
  contents: read

jobs:
  day35-private-strategy-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install strict tests and actual read-only original history connector
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Strict Python syntax and Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_customer_intake.py scripts/strategy_lab/day35_strategy_intake_acceptance.py tests/test_strategy_lab_customer_intake.py
          ruff check src/aidy/strategy_lab_customer_intake.py scripts/strategy_lab/day35_strategy_intake_acceptance.py tests/test_strategy_lab_customer_intake.py
      - name: Verify actual offline browser form JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('web/strategy_lab/day35_private_intake_preview.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>', html)
          assert len(scripts)==1, 'Exactly one self-contained inert local intake script'
          Path('/tmp/day35_local_intake.js').write_text(scripts[0])
          print('Actual original HTML JS code extracted; run Node syntax gate next')
          PY
          node --check /tmp/day35_local_intake.js
      - name: Customer source validation, binary attack cases and original Days28-34 regressions
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_customer_intake.py tests/test_strategy_lab_goldthinker_handoff.py tests/test_strategy_lab_owner_dashboard.py tests/test_strategy_lab_batch_queue.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_regimes.py
      - name: Produce real four-mode intake acceptance and reject all unsafe specimens
        run: PYTHONPATH=src:. python scripts/strategy_lab/day35_strategy_intake_acceptance.py
      - name: Independently rerun old research evidence from real read-only gold history; no candidate mining
        run: PYTHONPATH=src:. python scripts/strategy_lab/day34_private_handoff_acceptance.py
      - name: Verify actual safe draft UI, missing rule hints and 83 untouched source candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('artifacts/strategy_lab')
          d=json.loads((base/'day35/intake_acceptance.json').read_text())
          cases=json.loads((base/'day35/four_safe_test_drafts.json').read_text())
          prior=json.loads((base/'day34_handoff_acceptance.json').read_text())
          assert d['status']=='PASS',d
          assert d['html_form_created'] is True
          assert d['four_modes_exercised']==['link','paste','template','upload']
          assert d['missing_rule_guidance_fields']==9
          assert len(d['attacks_rejected'])==7
          assert len(cases)==4 and all(c['aidy_research_executed'] is False for c in cases)
          assert d['original_gold_edge_systems_backtested']==0
          assert prior['status']=='PASS' and prior['original_untested_gold_edge_sources']==83
          assert prior['real_qualifying_strategy_exports']==0
          assert prior['real_systems_tested_for_profit']==0
          assert prior['synthetic_queue_diagnostics_not_a_strategy_backtest']==100
          assert len(prior['source_bigquery_job_ids'])==2
          assert Path('web/strategy_lab/day35_private_intake_preview.html').stat().st_size>10000
          print('Day35 actual inert four-mode interface PASS; all 83 Gold Edge candidates still not tested.')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day35-private-safe-strategy-submission-ui-and-evidence
          path: |
            web/strategy_lab/day35_private_intake_preview.html
            artifacts/strategy_lab/day35/
            artifacts/strategy_lab/day34_handoff_acceptance.json
            artifacts/strategy_lab/day34/
          retention-days: 90
