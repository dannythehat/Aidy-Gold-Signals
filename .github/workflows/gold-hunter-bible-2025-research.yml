name: Gold Hunter Bible Systems 2025 Authentic Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gold_hunter/**'
      - 'tests/test_bible_engine.py'
      - 'scripts/gold_hunter_2025_research.py'
      - '.github/workflows/gold-hunter-bible-2025-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-bible-strategy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install research-only dependencies
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4' numpy pandas
      - name: Compile and run deterministic source-integrity tests
        run: |
          python -m compileall -q src/gold_hunter tests/test_bible_engine.py scripts/gold_hunter_2025_research.py
          python -m pytest -q tests/test_bible_engine.py
      - name: Recover all twelve genuine 2025 BigQuery monthly price-source receipts
        run: python scripts/strategy_lab/s010_run_12month_history.py
      - name: Evaluate seven Bible-compatible families and shared bot, base and stress
        run: python scripts/gold_hunter_2025_research.py
      - name: Upload source-linked results and blocked receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-HUNTER-BIBLE-REAL-2025-RESEARCH
          path: |
            artifacts/gold_hunter/bible_2025/
            artifacts/strategy_lab/s010_paid_customer_example/blocked_result.json
          if-no-files-found: warn
          retention-days: 90