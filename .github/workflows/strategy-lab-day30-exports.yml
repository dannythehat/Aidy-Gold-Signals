name: Strategy Lab Day30 Actual PDF CSV Chart Export Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_report_exports.py
      - scripts/strategy_lab/day30_actual_exports_acceptance.py
      - tests/test_strategy_lab_report_exports.py
      - docs/strategy-lab-day30-real-pdf-csv-chart-exports.md
      - .github/workflows/strategy-lab-day30-exports.yml

permissions:
  contents: read

jobs:
  day30-export-actual-files:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install strict Python tests, genuine BigQuery and actual PDF/image tooling
        run: |
          python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4' reportlab pypdf pillow matplotlib pypdfium2
      - name: Enforce syntax and Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_report_exports.py scripts/strategy_lab/day30_actual_exports_acceptance.py tests/test_strategy_lab_report_exports.py
          ruff check src/aidy/strategy_lab_report_exports.py scripts/strategy_lab/day30_actual_exports_acceptance.py tests/test_strategy_lab_report_exports.py
      - name: Verify PDF and CSV arithmetic plus previous independent source regressions
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_report_exports.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py tests/test_strategy_lab_regimes.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_baselines_stress.py tests/test_strategy_lab_risk_metrics.py
      - name: Produce all real downloads from two actual XAUUSD BigQuery source replays
        run: PYTHONPATH=src:. python scripts/strategy_lab/day30_actual_exports_acceptance.py
      - name: Verify mandatory downloadable report files are nonempty
        run: |
          test -s artifacts/strategy_lab/day30/research_report.pdf
          test -s artifacts/strategy_lab/day30/trades.csv
          test -s artifacts/strategy_lab/day30/cost_scenarios.csv
          test -s artifacts/strategy_lab/day30/equity_curve.png
          test -s artifacts/strategy_lab/day30/cost_stress.png
          test -s artifacts/strategy_lab/day30/canonical_result.json
          test -s artifacts/strategy_lab/day30/report_preview_page1.png
          test -s artifacts/strategy_lab/day30/manifest.json
          test -s artifacts/strategy_lab/day30_exports_acceptance.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day30-actual-aidy-goldthinker-pdf-csv-charts-source-verified
          path: |
            artifacts/strategy_lab/day30/
            artifacts/strategy_lab/day30_exports_acceptance.json
            artifacts/strategy_lab/day29_canonical_auditable_result.json
          retention-days: 90
