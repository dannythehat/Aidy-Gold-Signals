name: Gold Hunter NY ORB Frozen Improvement Screening 2022-2026

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_hunter_dev_orb_preregistered_improvements.py'
      - 'tests/test_gold_hunter_dev_orb_preregistered_improvements.py'
      - '.github/workflows/gold-hunter-dev-orb-prespecified-improvements.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prespecified-six-variant-multi-year-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Verify causal, fixed 12 trial experiment with no parameter grid
        run: |
          python -m compileall -q scripts/gold_hunter_dev_orb_preregistered_improvements.py scripts/gold_hunter_dev_ny_orb_ema50.py
          python -m pytest -q tests/test_gold_hunter_dev_orb_preregistered_improvements.py tests/test_gold_hunter_dev_ny_orb_ema50.py tests/test_gold_hunter_dev_ny_orb_2022.py
      - name: Reuse 2022 original verified month source from completed 2022 CI
        uses: actions/download-artifact@v4
        with:
          pattern: ny-orb-source-*
          run-id: 41187161371
          github-token: ${{ github.token }}
          path: /tmp/ny-orb-2022
          merge-multiple: false
      - name: Reuse authenticated original 2023 BID ASK source
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2023*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Reuse authenticated original 2024 BID ASK source
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2024*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Reuse authenticated original 2025 BID ASK source
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Reuse independently original-source-verified 2026 historical H1
        uses: actions/download-artifact@v4
        with:
          name: CROSSFIRE-S010-2026-REAL-HOLDOUT-3-VERSIONS
          run-id: 38851611865
          github-token: ${{ github.token }}
          path: /tmp/verified_2026
      - name: Obtain pinned AIDY original quote decoder code
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Unwrap original encrypted 2023-25 BID ASK quotes
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Run same Gold system 2022-2026 with 0.5pct risk and 3 causal structural filters
        run: |
          python -m scripts.gold_hunter_dev_orb_preregistered_improvements --source-2022 /tmp/ny-orb-2022 --source-old /tmp/quotes --source-2026 /tmp/verified_2026 --out artifacts/ny_orb_preregistered_improvements
          python -c 'import json; from pathlib import Path; x=json.loads(Path("artifacts/ny_orb_preregistered_improvements/summary.json").read_text()); assert x["schema"]=="aidy.dev_ny_orb_hypothesis_controls_2022_2026.v1" and x["earlier_baselines_unchanged_and_verified"] and len(x["periods"])==6'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-ny-orb-2022-2026-fixed-hypotheses-complete-evidence
          path: artifacts/ny_orb_preregistered_improvements/
          retention-days: 90
          if-no-files-found: warn
