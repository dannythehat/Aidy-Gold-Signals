name: Provider Intelligence Day 3 Research

on:
  push:
    branches: [research/provider-intelligence-20260906]
    paths:
      - "src/aidy/provider_intelligence_health.py"
      - "src/provider_entry.py"
      - "tests/test_provider_intelligence_day2_gold_calendar.py"
      - "tests/test_provider_intelligence_day3_capture_health.py"
      - ".github/workflows/provider-intelligence-day3-research.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  D1_ROWS_READ_ALERT_THRESHOLD: "3250000"
  D1_ROWS_READ_FREE_LIMIT: "5000000"

jobs:
  unit-and-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Day 2 and Day 3 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q \
            tests/test_provider_intelligence_day2_gold_calendar.py \
            tests/test_provider_intelligence_day3_capture_health.py

  live-readonly-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove deployed capture configuration without mutation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/health?day3=${GITHUB_SHA}" > /tmp/health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source') == 'twelve_data', h
          assert h.get('scheduler') == 'queue-consumer', h
          print(json.dumps(h, sort_keys=True))
          PY

      - name: Run bounded indexed D1 capture-health reads
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cat >/tmp/day3-readonly.jsonc <<JSON
          {
            "name": "aidy-day3-readonly-proof",
            "compatibility_date": "2026-08-16",
            "d1_databases": [{
              "binding": "AIDY_OPS",
              "database_name": "${AIDY_D1_DATABASE_NAME}",
              "database_id": "${AIDY_D1_DATABASE_ID}"
            }]
          }
          JSON
          NOW="$(date -u +%Y-%m-%dT%H:%M:00+00:00)"
          LAST7="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:00+00:00)"
          LAST24="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:00+00:00)"

          SQL_LAST="SELECT open_time_utc,first_observed_at,revision_index FROM market_candles WHERE symbol='XAUUSD' AND timeframe='1m' AND source='twelve_data_vendor_m1_v1' AND open_time_utc>='${LAST7}' AND open_time_utc<'${NOW}' ORDER BY open_time_utc DESC,revision_index DESC LIMIT 1;"
          SQL_REQ="SELECT requested_at_utc,completed_at_utc,status,error_code,request_kind FROM twelve_data_request_ledger WHERE requested_at_utc>='${LAST24}' AND requested_at_utc<'${NOW}' AND request_kind='scheduled_capture' ORDER BY requested_at_utc DESC LIMIT 8;"
          SQL_ARCH="SELECT status,COUNT(*) AS n,MAX(attempts) AS max_attempts FROM archive_outbox WHERE status IN ('pending','archived') AND created_at>='${LAST24}' AND created_at<'${NOW}' GROUP BY status;"

          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-readonly.jsonc --json --command "$SQL_LAST" > /tmp/last.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-readonly.jsonc --json --command "$SQL_REQ" > /tmp/requests.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-readonly.jsonc --json --command "$SQL_ARCH" > /tmp/archive.json

          EXPLAIN_LAST="EXPLAIN QUERY PLAN ${SQL_LAST}"
          EXPLAIN_REQ="EXPLAIN QUERY PLAN ${SQL_REQ}"
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-readonly.jsonc --json --command "$EXPLAIN_LAST" > /tmp/plan-last.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config /tmp/day3-readonly.jsonc --json --command "$EXPLAIN_REQ" > /tmp/plan-req.json

          python - <<'PY'
          import json
          for name in ('last','requests','archive','plan-last','plan-req'):
              data=json.load(open(f'/tmp/{name}.json', encoding='utf-8'))
              print(name+'='+json.dumps(data, sort_keys=True))
          req=json.load(open('/tmp/requests.json', encoding='utf-8'))
          rows=req[0].get('results', []) if req else []
          assert rows, 'No scheduled capture requests in bounded 24h window'
          latest=rows[0]
          assert latest.get('status') in {'succeeded','failed','started'}, latest
          plans=[]
          for name in ('plan-last','plan-req'):
              payload=json.load(open(f'/tmp/{name}.json', encoding='utf-8'))
              plans.extend(payload[0].get('results', []) if payload else [])
          detail=' '.join(str(row.get('detail','')) for row in plans).upper()
          assert 'INDEX' in detail, detail
          PY

      - name: Measure current D1 rows-read budget from Cloudflare Analytics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          day=datetime.now(timezone.utc).date().isoformat()
          query='''query D1Usage($accountTag: string!, $day: Date, $databaseId: string) {
            viewer { accounts(filter: { accountTag: $accountTag }) {
              d1AnalyticsAdaptiveGroups(limit: 10, filter: {
                date_geq: $day, date_leq: $day, databaseId: $databaseId
              }) { sum { rowsRead } dimensions { date databaseId } }
            } }
          }'''
          body=json.dumps({'query':query,'variables':{
              'accountTag':os.environ['CLOUDFLARE_ACCOUNT_ID'],
              'day':day,
              'databaseId':os.environ['AIDY_D1_DATABASE_ID'],
          }}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=body,headers={
              'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              result=json.load(r)
          if result.get('errors'):
              raise SystemExit(result['errors'])
          groups=result['data']['viewer']['accounts'][0]['d1AnalyticsAdaptiveGroups']
          rows_read=sum(int(item.get('sum',{}).get('rowsRead') or 0) for item in groups)
          threshold=int(os.environ['D1_ROWS_READ_ALERT_THRESHOLD'])
          free_limit=int(os.environ['D1_ROWS_READ_FREE_LIMIT'])
          alert=rows_read >= threshold
          print(f'date_utc={day} rows_read={rows_read} threshold={threshold} free_limit={free_limit} alert={str(alert).lower()}')
          assert rows_read < threshold, (rows_read, threshold)
          assert rows_read < free_limit, (rows_read, free_limit)
          PY
