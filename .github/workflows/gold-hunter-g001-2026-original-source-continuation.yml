name: Gold Hunter G001 Jan-Sep2026 Independent Actual Tick Source Continuation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_hunter_external_vol_regime_daily.py'
      - 'tests/test_gold_hunter_external_vol_regime_daily.py'
      - 'scripts/gold_hunter_g001_2026_original_h1.py'
      - 'tests/test_gold_hunter_g001_2026_original_h1.py'
      - '.github/workflows/gold-hunter-g001-2026-original-source-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-original-aidy-three-years:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Confirm original third party Pine source fingerprint without executing it
        run: |
          git clone --depth=1 --quiet https://github.com/erhungn/volatility-regime-momentum /tmp/web-origin
          test "$(git -C /tmp/web-origin hash-object strategy/pine_script_strategy.pine)" = 'f6989fb66257bd04b4915a261f89da4a3dcacd22'
          grep -q 'process_orders_on_close=false' /tmp/web-origin/strategy/pine_script_strategy.pine
          grep -q 'stopExit' /tmp/web-origin/strategy/pine_script_strategy.pine
          test ! -e /tmp/web-origin/LICENSE
      - name: Test source interpretation and AIDY accounting without cloud data
        run: |
          python -m compileall -q scripts/gold_hunter_external_vol_regime_daily.py scripts/gold_hunter_g001_2026_original_h1.py
          python -m pytest -q tests/test_gold_hunter_external_vol_regime_daily.py tests/test_gold_hunter_g001_2026_original_h1.py tests/test_gold_hunter_2023_2024_causal_research.py
      - name: Fetch pinned original AIDY archive decoder code ONLY
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Read-only retrieve existing original authenticated 2023 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2023*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2024 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2024*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2025 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Unwrap existing encrypted quote derivatives in isolated CI (no raw source GET)
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Reuse previously source-verified real Jan-Sep2026 historic spot quote archive
        uses: actions/download-artifact@v4
        with:
          name: CROSSFIRE-S010-2026-REAL-HOLDOUT-3-VERSIONS
          run-id: 38851611865
          github-token: ${{ github.token }}
          path: /tmp/verified_2026
      - name: Verify G001 January to September 2026 against existing authenticated tick-derived spot H1
        run: python -m scripts.gold_hunter_g001_2026_original_h1 --quotes /tmp/quotes --source-2026 /tmp/verified_2026 --out artifacts/g001_2026_verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-g001-2026-spot-original-quote-continuation
          path: artifacts/g001_2026_verification/
          retention-days: 90
          if-no-files-found: warn
