name: Strategy Lab B01 Day04 Contract Tests
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_data_quality.py
      - tests/test_strategy_lab_data_quality.py
      - docs/strategy-lab-b01-data-qualification-contract-v1.md
      - .github/workflows/strategy-lab-b01-day04.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest ruff
      - name: Check formatting and source contract
        run: |
          python -m compileall -q src/aidy/strategy_lab_data_quality.py tests/test_strategy_lab_data_quality.py
          ruff check src/aidy/strategy_lab_data_quality.py tests/test_strategy_lab_data_quality.py
      - name: Run tests
        run: PYTHONPATH=src pytest -q tests/test_strategy_lab_data_quality.py
