name: AIDY RC1 historical shape and broker-clock sensitivity

# Read-only research branch. Historical broker calendar NOT proven.
on:
  push:
    branches:
      - research/goldthinker-historical-readonly-20261014
    paths:
      - .github/workflows/gt-bible-rc1-historical-clock-study.yml
      - research/gt_bible_rc1_clock_sensitivity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout isolated AIDY research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install BigQuery read-only client
        run: python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3.25,<4' 'google-auth>=2.20,<3'
      - name: Read bounded historic M1 and calculate pinned RC1 shape sensitivity + drift baselines
        run: python research/gt_bible_rc1_clock_sensitivity.py
      - name: Archive exact exploratory study and disclosures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-bible-rc1-clock-sensitive-historical-shapes
          path: artifacts/gt_bible_rc1_clock_sensitivity_shapes.json
          if-no-files-found: ignore
          retention-days: 14
