name: S005 497 Original Source Quote Cost Trend And Statistical Audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/strategy_lab/s005_all497_source_cost_regime_robustness.py
      - tests/test_s005_all497_cost_regime_robustness.py
      - .github/workflows/s005-source-quote-cost-statistical-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/strategy_lab/s005_all497_source_cost_regime_robustness.py
      - tests/test_s005_all497_cost_regime_robustness.py
      - .github/workflows/s005-source-quote-cost-statistical-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  S005-original-source-quote-and-account-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest pandas numpy ruff
      - name: Source semantics, no fake broker fills, deterministic month-block tests
        run: |
          python -m compileall -q scripts/strategy_lab/s005_all497_source_cost_regime_robustness.py tests/test_s005_all497_cost_regime_robustness.py
          ruff check --select F scripts/strategy_lab/s005_all497_source_cost_regime_robustness.py tests/test_s005_all497_cost_regime_robustness.py
          PYTHONPATH=src:. python -m pytest -q tests/test_s005_all497_cost_regime_robustness.py
  S005-all-497-authenticated-price-cost-and-regime-audit:
    needs: S005-original-source-quote-and-account-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39150315229
          github-token: ${{ github.token }}
          pattern: s001-source-*
          path: artifacts/strategy_lab/s005_original_source/
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 39159785515
          github-token: ${{ github.token }}
          name: S005-Original-Author-Python-Real-Spot-Two-Presets-2025-2026
          path: artifacts/strategy_lab/s005_original_publisher/
      - run: python -m pip install --quiet pandas numpy
      - name: Strict 497 publisher trades against real source bid ask, costs, trends and monthly blocks
        run: |
          PYTHONPATH=src:. python scripts/strategy_lab/s005_all497_source_cost_regime_robustness.py --source-root artifacts/strategy_lab/s005_original_source/ --publisher-evidence artifacts/strategy_lab/s005_original_publisher/S005_PUBLISHER_PY_NATIVE_REPLAY.json --out artifacts/strategy_lab/s005_497_original_cost_statistical_audit/
      - name: Check 497 signed source ledger and all cost/provenance caveats
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          root=Path('artifacts/strategy_lab/s005_497_original_cost_statistical_audit')
          d=json.loads((root/'S005_ALL_497_COST_REGIME_ROBUSTNESS.json').read_text())
          with (root/'S005_ALL_497_REAL_QUOTES_AND_CONTEXT.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert d['n_original_trades_all_verified']==497
          assert len(rows)==497
          assert d['source_spread_exceeds_publisher_whole_cost_on_trades']==456
          assert not d['true_native_spot_broker_exit_ASK_tick_parity']
          assert not d['months_bootstrap_is_not_sealed_holdout'] is False
          assert d['retrospective_cost_scenarios_reselect_original_signals'] is False
          assert d['fixed_cohort_does_NOT_prove_prospective_edge']
          for fam in ('DONCHIAN','SESSION'):
              for yr in ('2025','2026'):
                  case=d['results'][fam][yr]
                  assert case['independent_source_pnl_reconciliation_exact']
                  assert case['source_entry_quote_coverage_pct']==100
                  assert case['bootstrap']['proof_is_independent_OOS'] is False
                  assert len(case['actual_frozen_original_trades'])==case['original_author_model_trades']
          print('S005_REAL_497_ECONOMIC_SOURCE_QUOTE_TREND_AUDIT_QUALIFIED_WITH_CAVEATS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S005-Source-Verified-All497-QuoteCost-Regime-Statistical-Evidence
          path: artifacts/strategy_lab/s005_497_original_cost_statistical_audit/
          if-no-files-found: warn
          retention-days: 90
