name: Phase A Archive Reconcile

on:
  push:
    branches: [feature/aidy-hub-phase-a-data-health-20260913]
    paths:
      - "migrations/d1/0018_reconcile_archive_delivery_state.sql"
      - ".github/workflows/phase-a-archive-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production D1 config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          cfg=json.load(open('wrangler.test.example.jsonc',encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          json.dump(cfg,open('wrangler.phase-a.reconcile.jsonc','w',encoding='utf-8'),indent=2)
          PY
      - name: Prove mismatch exists before repair
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.phase-a.reconcile.jsonc \
            --command "SELECT COUNT(*) AS inconsistent FROM archive_outbox WHERE status='archived' AND delivery_state!='archived';" \
            | tee /tmp/pre.json
      - name: Apply reconciliation migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote \
            --config wrangler.phase-a.reconcile.jsonc
      - name: Prove archive lifecycle is consistent
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.phase-a.reconcile.jsonc \
            --command "SELECT (SELECT COUNT(*) FROM archive_outbox WHERE status='archived' AND delivery_state!='archived') AS core_mismatch,(SELECT COUNT(*) FROM cross_market_archive_outbox WHERE status='archived' AND delivery_state!='archived') AS cross_mismatch,(SELECT COUNT(*) FROM archive_outbox WHERE status='pending') AS core_unarchived,(SELECT COUNT(*) FROM cross_market_archive_outbox WHERE status='pending') AS cross_unarchived;" \
            | tee /tmp/post.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/post.json',encoding='utf-8'))
          rows=[]
          for b in p: rows.extend(b.get('results') or [])
          assert rows,rows
          r=rows[0]
          assert int(r['core_mismatch'])==0,r
          assert int(r['cross_mismatch'])==0,r
          assert int(r['core_unarchived'])==0,r
          assert int(r['cross_unarchived'])==0,r
          print('archive_delivery_consistency=PASS',r)
          PY
      - name: Prove health now understands Sunday correctly
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            curl -fsS -H 'Cache-Control: no-cache' \
              "${AIDY_TEST_WORKER_URL}/health?archive_reconcile=${GITHUB_SHA}-${attempt}" > /tmp/health.json
            if python - <<'PY'
          import json
          p=json.load(open('/tmp/health.json',encoding='utf-8'))
          d=p.get('data_health') or {}
          print(p.get('status'),d.get('status'),d.get('reason'))
          raise SystemExit(0 if d.get('status')=='session_closed' and d.get('alert') is False else 1)
          PY
            then ok=1; break; fi
            sleep 2
          done
          cat /tmp/health.json
          test "$ok" -eq 1
      - name: Prove append-only health history started
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.phase-a.reconcile.jsonc \
            --command "SELECT observed_at_utc,status,alert,session_open,scheduler,reason FROM aidy_data_health_events ORDER BY observed_at_utc DESC,id DESC LIMIT 10;" \
            | tee /tmp/events.json
