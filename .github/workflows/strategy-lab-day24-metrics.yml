name: Strategy Lab Day24 Ledger-Based Statistics and Risk Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_risk_metrics.py
      - tests/test_strategy_lab_risk_metrics.py
      - scripts/strategy_lab/day24_ledger_metrics_acceptance.py
      - research/strategy_lab/fixtures/day24_known_answer_journal.json
      - docs/strategy-lab-day24-risk-metrics-acceptance.md
      - .github/workflows/strategy-lab-day24-metrics.yml

permissions:
  contents: read

jobs:
  validate-day24-risk-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --quiet pytest ruff
      - name: Compile and lint implementation
        run: |
          python -m compileall -q src/aidy/strategy_lab_risk_metrics.py tests/test_strategy_lab_risk_metrics.py scripts/strategy_lab/day24_ledger_metrics_acceptance.py
          ruff check src/aidy/strategy_lab_risk_metrics.py tests/test_strategy_lab_risk_metrics.py scripts/strategy_lab/day24_ledger_metrics_acceptance.py
      - name: Day17 to Day19 cash ledger/replay regression plus Day24 exact metrics
        run: PYTHONPATH=src:. python -m pytest -q tests/test_strategy_lab_cash_ledger.py tests/test_strategy_lab_deterministic_replay.py tests/test_strategy_lab_reference_run.py tests/test_strategy_lab_risk_metrics.py
      - name: Frozen source and two independent on-disk exact account metric receipts
        run: PYTHONPATH=src:. python scripts/strategy_lab/day24_ledger_metrics_acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day24-two-real-sqlite-ledgers-cent-exact-acceptance
          path: artifacts/strategy_lab/day24_ledger_metrics_acceptance.json
          retention-days: 90
