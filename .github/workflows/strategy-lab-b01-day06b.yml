name: Strategy Lab Day06B Storage Discovery
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/b01_day06b_bigquery_catalog.py
      - .github/workflows/strategy-lab-b01-day06b.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet 'google-cloud-bigquery>=3.42,<4'
      - run: python scripts/b01_day06b_bigquery_catalog.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-day06b-catalog
          path: artifacts/day06b_bigquery_catalog.json
          retention-days: 30
