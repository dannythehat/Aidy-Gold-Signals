name: AIDY Day 53 Worker Package Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "tests/test_worker_dependency_boundary.py"
      - "docs/day53-worker-package-boundary.md"
      - ".github/workflows/day53-live-forward-deploy-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify candidate descends from current protected main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Prove Worker dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/test_worker_dependency_boundary.py
          uv run pytest -q tests/test_worker_dependency_boundary.py tests/test_day53_live_forward_observer.py
          uv run pytest -q

      - name: Prove obsolete recovery cannot deploy after merge
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '^  push:' .github/workflows/day53-live-forward-deploy-recovery.yml
          ! grep -q "AIDY_MARKET_DATA_SOURCE.*gold_api" .github/workflows/day53-live-forward-deploy-recovery.yml
          echo "Historical package recovery is validation-only; final launch owns deployment."
