name: AIDY Day 53 Live Forward Activation

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/d1/0009_twelve_data_decision_admission.sql"
      - "src/aidy/end_to_end.py"
      - "src/aidy/forward_live_observer.py"
      - "src/aidy/private_forward_context.py"
      - "src/aidy/semantic_context_composer.py"
      - "src/aidy/twelve_launch_policy.py"
      - "src/entry.py"
      - "tests/test_day53_live_forward_observer.py"
      - "tests/test_day53_semantic_context_composer.py"
      - "tests/test_day53_twelve_data_launch_cleanup.py"
      - "scripts/day53_prepare_live_activation.py"
      - ".github/workflows/day53-live-forward-activation.yml"
  push:
    branches: [main]
    paths:
      - "migrations/d1/0009_twelve_data_decision_admission.sql"
      - "src/aidy/end_to_end.py"
      - "src/aidy/forward_live_observer.py"
      - "src/aidy/private_forward_context.py"
      - "src/aidy/semantic_context_composer.py"
      - "src/aidy/twelve_launch_policy.py"
      - "src/entry.py"
      - "tests/test_day53_live_forward_observer.py"
      - "tests/test_day53_semantic_context_composer.py"
      - "tests/test_day53_twelve_data_launch_cleanup.py"
      - "scripts/day53_prepare_live_activation.py"
      - ".github/workflows/day53-live-forward-activation.yml"
  workflow_dispatch:

concurrency:
  group: aidy-day53-live-forward-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test
  AIDY_COHORT_VERSION: aidy_formal_forward_cohort_v2_immediate_start

jobs:
  acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require current protected-main ancestry
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static and boundary checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/forward_live_observer.py src/aidy/private_forward_context.py src/aidy/semantic_context_composer.py src/entry.py tests/test_day53_live_forward_observer.py tests/test_day53_semantic_context_composer.py
          uv run python -m compileall -q src scripts tests
          ! grep -R "production_decision_context_adapter_not_enabled" src tests
          ! grep -Ein '^(from|import) .*?(metaapi|mt5|vantage|super_signals)' src/aidy/forward_live_observer.py src/aidy/private_forward_context.py src/entry.py

      - name: Focused final-launch tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_day53_live_forward_observer.py tests/test_day53_semantic_context_composer.py tests/test_day53_semantic_analogue_wrapper.py tests/test_day53_twelve_data_launch_cleanup.py tests/test_day52_end_to_end.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

      - name: Deterministic activation artifacts
        shell: bash
        run: |
          set -euo pipefail
          STAMP='2026-09-02T12:00:00+00:00'
          uv run python scripts/day53_prepare_live_activation.py --accepted-code-head '${{ github.event.pull_request.head.sha }}' --activated-at-utc "$STAMP" --output-dir activation_a
          uv run python scripts/day53_prepare_live_activation.py --accepted-code-head '${{ github.event.pull_request.head.sha }}' --activated-at-utc "$STAMP" --output-dir activation_b
          diff -ru activation_a activation_b
          python - <<'PY'
          import json
          observer=json.load(open('activation_a/observer_manifest.json', encoding='utf-8'))
          metadata=json.load(open('activation_a/metadata.json', encoding='utf-8'))
          assert observer['decision_adapter_enabled_by_this_change'] is True, observer
          assert observer['real_day52_architecture_v2_cycle_required'] is True, observer
          assert observer['semantic_twelve_context_required'] is True, observer
          assert observer['current_objective_context_exposed_to_master_trader'] is True, observer
          assert observer['cross_source_analogue_inheritance_allowed'] is False, observer
          assert observer['telegram_publication_enabled'] is False, observer
          assert observer['live_money_execution_allowed'] is False, observer
          assert metadata['telegram_publication_enabled'] is False, metadata
          assert metadata['live_money_execution_enabled'] is False, metadata
          PY

      - name: Preserve PR launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-final-launch-pr-${{ github.event.pull_request.head.sha }}
          path: activation_a/
          if-no-files-found: error
          retention-days: 90

  deploy-and-prove:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_TWELVE_DATA_API_KEY: ${{ secrets.AIDY_TWELVE_DATA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout exact protected-main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require exact main and launch secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${AIDY_TWELVE_DATA_API_KEY:-}"
          test -n "${OPENAI_API_KEY:-}"

      - name: Re-run final code gate on main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check src/aidy/forward_live_observer.py src/aidy/private_forward_context.py src/aidy/semantic_context_composer.py src/entry.py tests/test_day53_live_forward_observer.py
          uv run pytest -q tests/test_day53_live_forward_observer.py tests/test_day53_semantic_context_composer.py tests/test_day53_twelve_data_launch_cleanup.py tests/test_day52_end_to_end.py
          uv run pytest -q

      - name: Build Twelve launch configs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          base=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          base['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          base['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          base['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          base['vars']['AIDY_CAPTURE_ENABLED']='true'
          base['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          base['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          base['vars']['AIDY_MARKET_POLL_SECONDS']='60'
          base['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          off=json.loads(json.dumps(base)); off['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          on=json.loads(json.dumps(base)); on['vars']['AIDY_FORMAL_FORWARD_ENABLED']='true'
          for cfg in (off,on):
              text=json.dumps(cfg).lower()
              for forbidden in ('metaapi','vantage','mt5','super_signals'):
                  assert forbidden not in text
              assert cfg['vars']['AIDY_MARKET_DATA_SOURCE']=='twelve_data'
          json.dump(off, open('wrangler.day53.launch.off.jsonc','w',encoding='utf-8'), indent=2)
          json.dump(on, open('wrangler.day53.launch.on.jsonc','w',encoding='utf-8'), indent=2)
          sched=json.load(open('wrangler.scheduler.test.jsonc', encoding='utf-8'))
          sched['triggers']['crons']=['* * * * *']
          json.dump(sched, open('wrangler.day53.launch.scheduler.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Apply D1 launch migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.day53.launch.off.jsonc | tee /tmp/migrations.txt

      - name: Install Worker secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AIDY_TWELVE_DATA_API_KEY" | npx --yes wrangler@4 secret put AIDY_TWELVE_DATA_API_KEY --config wrangler.day53.launch.off.jsonc >/tmp/twelve-secret.txt
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY --config wrangler.day53.launch.off.jsonc >/tmp/openai-secret.txt
          ! grep -Fq "$AIDY_TWELVE_DATA_API_KEY" /tmp/twelve-secret.txt
          ! grep -Fq "$OPENAI_API_KEY" /tmp/openai-secret.txt

      - name: Deploy exact main Worker with forward disabled
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.day53.launch.off.jsonc wrangler.jsonc
          uv run pywrangler deploy 2>&1 | tee /tmp/worker-off-deploy.txt
          OFF_VERSION_ID="$(sed -n 's/.*Current Version ID: //p' /tmp/worker-off-deploy.txt | tail -1 | tr -d '\r')"
          test -n "$OFF_VERSION_ID"
          echo "WORKER_OFF_VERSION_ID=$OFF_VERSION_ID" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$AIDY_TEST_WORKER_URL/health?launch_probe=${GITHUB_SHA}-${attempt}" > /tmp/health-off.json || true
            if python - <<'PY'
          import json
          try:
              h=json.load(open('/tmp/health-off.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source')=='twelve_data', h
          assert h.get('private_forward_model_gateway_configured') is True, h
          PY
            then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo 'Exact Twelve/OpenAI forward-off Worker did not become observable'; cat /tmp/health-off.json || true; exit 1; }
          cat /tmp/health-off.json

      - name: Deploy minute scheduler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.day53.launch.scheduler.jsonc 2>&1 | tee /tmp/scheduler-deploy.txt

      - name: Prepare new semantic evidence epoch
        shell: bash
        run: |
          set -euo pipefail
          ACTIVATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "ACTIVATED_AT=$ACTIVATED_AT" >> "$GITHUB_ENV"
          uv run python scripts/day53_prepare_live_activation.py --accepted-code-head "$GITHUB_SHA" --activated-at-utc "$ACTIVATED_AT" --output-dir day53_launch_activation
          echo "NEW_COHORT_ID=$(cat day53_launch_activation/cohort_id.txt)" >> "$GITHUB_ENV"

      - name: Freeze-break prior semantic epoch if present
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.off.jsonc --command "SELECT cohort_id,accepted_code_head,activated_at_utc,state,(SELECT COUNT(*) FROM aidy_forward_evaluations e WHERE e.cohort_id=c.cohort_id) AS evaluation_count FROM aidy_forward_cohorts c WHERE state='active' AND cohort_version='${AIDY_COHORT_VERSION}' ORDER BY activated_at_utc DESC" > /tmp/active-before.json
          python - <<'PY'
          import hashlib, json, os
          batches=json.load(open('/tmp/active-before.json', encoding='utf-8'))
          rows=[]
          for batch in batches:
              rows.extend(batch.get('results') or [])
          new=os.environ['NEW_COHORT_ID']
          if len(rows)>1:
              raise SystemExit(f'multiple active amended cohorts: {rows}')
          if not rows or rows[0]['cohort_id']==new:
              open('/tmp/close-prior.sql','w',encoding='utf-8').write('-- no prior cohort to close\n')
              raise SystemExit(0)
          old=rows[0]
          evidence={
              'reason':'final_twelve_semantic_architecture_v2_launch_epoch',
              'old_cohort_id':old['cohort_id'],
              'old_accepted_code_head':old['accepted_code_head'],
              'old_evaluation_count':int(old['evaluation_count']),
              'replacement_cohort_id':new,
              'replacement_code_head':os.environ['GITHUB_SHA'],
              'evidence_semantic_change':True,
              'step2_outcome':'insufficient_evidence',
              'cross_source_analogue_inheritance_allowed':False,
              'performance_information_used':False,
          }
          text=json.dumps(evidence,sort_keys=True,separators=(',',':'))
          dig=hashlib.sha256(text.encode()).hexdigest()
          esc=lambda x: str(x).replace("'","''")
          sql=(
              "UPDATE aidy_forward_cohorts SET state='closed',closed_at_utc='"+esc(os.environ['ACTIVATED_AT'])+"',"
              "freeze_break_reason_code='material_safety_or_data_integrity_defect',"
              "freeze_break_evidence_json='"+esc(text)+"',freeze_break_evidence_digest='"+dig+"',"
              "replacement_cohort_id='"+esc(new)+"' WHERE cohort_id='"+esc(old['cohort_id'])+"' AND state='active';\n"
          )
          open('/tmp/close-prior.sql','w',encoding='utf-8').write(sql)
          PY
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config wrangler.day53.launch.off.jsonc --file /tmp/close-prior.sql | tee /tmp/close-prior.txt
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config wrangler.day53.launch.off.jsonc --file day53_launch_activation/activation.sql | tee /tmp/activate-new.txt

      - name: Require exact new active cohort
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.off.jsonc --command "SELECT cohort_id,accepted_code_head,activated_at_utc,state FROM aidy_forward_cohorts WHERE state='active' AND cohort_version='${AIDY_COHORT_VERSION}'" > /tmp/active-after.json
          python - <<'PY'
          import json, os
          rows=[]
          for batch in json.load(open('/tmp/active-after.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          assert len(rows)==1, rows
          row=rows[0]
          assert row['cohort_id']==os.environ['NEW_COHORT_ID'], row
          assert row['accepted_code_head']==os.environ['GITHUB_SHA'], row
          assert row['state']=='active', row
          PY

      - name: Enable private-forward on exact main Worker
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.day53.launch.on.jsonc wrangler.jsonc
          uv run pywrangler deploy 2>&1 | tee /tmp/worker-on-deploy.txt
          ON_VERSION_ID="$(sed -n 's/.*Current Version ID: //p' /tmp/worker-on-deploy.txt | tail -1 | tr -d '\r')"
          test -n "$ON_VERSION_ID"
          echo "WORKER_ON_VERSION_ID=$ON_VERSION_ID" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$AIDY_TEST_WORKER_URL/health?launch_probe=${GITHUB_SHA}-on-${attempt}" > /tmp/health-on.json || true
            if python - <<'PY'
          import json
          try:
              h=json.load(open('/tmp/health-on.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is True, h
          assert h.get('market_data_source')=='twelve_data', h
          assert h.get('private_forward_model_gateway_configured') is True, h
          PY
            then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo 'Exact Twelve/OpenAI forward-on Worker did not become observable'; cat /tmp/health-on.json || true; exit 1; }
          cat /tmp/health-on.json
          PROOF_NOT_BEFORE="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "PROOF_NOT_BEFORE=$PROOF_NOT_BEFORE" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          evidence={
              'protected_main_sha':os.environ['GITHUB_SHA'],
              'forward_off_worker_version_id':os.environ['WORKER_OFF_VERSION_ID'],
              'forward_on_worker_version_id':os.environ['WORKER_ON_VERSION_ID'],
              'forward_off_health':json.load(open('/tmp/health-off.json', encoding='utf-8')),
              'forward_on_health':json.load(open('/tmp/health-on.json', encoding='utf-8')),
              'deployment_propagation_proof':'health signature polled until exact Twelve/OpenAI launch state became observable',
          }
          json.dump(evidence, open('/tmp/deployment-identity.json','w',encoding='utf-8'), sort_keys=True)
          PY

      - name: Prove one fresh automatic Twelve to k3 immutable cycle
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 18); do
            npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.on.jsonc --command "SELECT f.record_id,f.cycle_id AS formal_cycle_id,f.evaluated_at_utc,f.context_hash,f.disposition,f.data_quality_state,f.data_quality_reason_code,f.decision_id,f.ex_ante_digest,f.self_consistency_digest,f.retrieval_effective_n,e.cycle_id AS end_to_end_cycle_id,e.cycle_state,e.last_error_code,e.publication_id,e.paper_state_digest,e.self_consistency_json,e.ex_ante_json FROM aidy_forward_evaluations f JOIN aidy_end_to_end_cycles e ON e.context_hash=f.context_hash AND e.instruction_type='market_evaluation' AND e.source_state='private_forward' WHERE f.cohort_id='${NEW_COHORT_ID}' AND f.evaluated_at_utc>='${PROOF_NOT_BEFORE}' AND f.disposition IN ('no_trade','decision_admitted') AND f.data_quality_state='known_good' AND f.decision_id IS NOT NULL AND f.ex_ante_digest IS NOT NULL AND f.self_consistency_digest IS NOT NULL AND e.publication_id IS NULL ORDER BY f.evaluated_at_utc DESC LIMIT 1" > /tmp/model-proof.json
            if python - <<'PY'
          import json
          rows=[]
          for batch in json.load(open('/tmp/model-proof.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          if len(rows)!=1:
              raise SystemExit(1)
          row=rows[0]
          sc=json.loads(row['self_consistency_json'])
          receipts=sc.get('sample_receipts') or []
          assert sc.get('sample_count')==3, sc
          assert len(receipts)==3, receipts
          assert sc.get('consensus',{}).get('status')=='consensus', sc
          assert all(r.get('gateway_status')=='accepted' for r in receipts), receipts
          assert all(r.get('response_id') for r in receipts), receipts
          assert all(r.get('post_model_passed') is True for r in receipts), receipts
          assert all(r.get('vote_eligible') is True for r in receipts), receipts
          assert row['data_quality_reason_code'] is None, row
          assert row['publication_id'] is None, row
          assert row['decision_id'], row
          assert row['ex_ante_digest'], row
          assert row['self_consistency_digest']==sc['self_consistency_digest'], row
          print(row['evaluated_at_utc'])
          PY
            then
              found=1
              break
            fi
            sleep 60
          done
          test "$found" -eq 1 || { echo 'No fully model-resolved fresh private-forward cycle appeared'; exit 1; }
          EVALUATED_AT="$(python - <<'PY'
          import json
          rows=[]
          for batch in json.load(open('/tmp/model-proof.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          print(rows[0]['evaluated_at_utc'])
          PY
          )"
          echo "EVALUATED_AT=$EVALUATED_AT" >> "$GITHUB_ENV"

      - name: Bind proof to fresh scheduled Twelve capture and admitted M1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.on.jsonc --command "SELECT id,requested_at_utc,completed_at_utc,status,request_kind,outputsize FROM twelve_data_request_ledger WHERE request_kind='scheduled_capture' AND status='succeeded' AND completed_at_utc>='${PROOF_NOT_BEFORE}' AND completed_at_utc<='${EVALUATED_AT}' ORDER BY completed_at_utc DESC LIMIT 1" > /tmp/twelve-request.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.on.jsonc --command "SELECT id,captured_at,capture_status,data_availability_json,latest_m1_id,latest_m5_id,latest_m15_id,latest_h1_id,latest_h4_id,latest_d1_id FROM market_snapshots WHERE captured_at>='${PROOF_NOT_BEFORE}' AND captured_at<='${EVALUATED_AT}' AND capture_status='complete' ORDER BY captured_at DESC LIMIT 1" > /tmp/snapshot-proof.json
          LATEST_M1_ID="$(python - <<'PY'
          import json
          def rows(path):
              out=[]
              for batch in json.load(open(path, encoding='utf-8')):
                  out.extend(batch.get('results') or [])
              return out
          requests=rows('/tmp/twelve-request.json')
          snapshots=rows('/tmp/snapshot-proof.json')
          assert len(requests)==1, requests
          assert requests[0]['request_kind']=='scheduled_capture', requests
          assert requests[0]['status']=='succeeded', requests
          assert len(snapshots)==1, snapshots
          snap=snapshots[0]
          availability=json.loads(snap['data_availability_json'])
          assert availability.get('market_data_source')=='twelve_data', availability
          for key in ('latest_m1_id','latest_m5_id','latest_m15_id','latest_h1_id','latest_h4_id','latest_d1_id'):
              assert snap.get(key), (key,snap)
          print(snap['latest_m1_id'])
          PY
          )"
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.launch.on.jsonc --command "SELECT COUNT(*) AS n FROM twelve_data_decision_admitted_m1_v1 WHERE id='${LATEST_M1_ID}'" > /tmp/admission-proof.json
          python - <<'PY'
          import json
          rows=[]
          for batch in json.load(open('/tmp/admission-proof.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          assert len(rows)==1 and int(rows[0]['n'])==1, rows
          PY

      - name: Capture final private-forward status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$AIDY_TEST_WORKER_URL/day53/forward-status" | tee /tmp/forward-status.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/forward-status.json', encoding='utf-8'))
          assert payload['ok'] is True, payload
          f=payload['forward']
          assert f['deployment_enabled'] is True, f
          assert f['model_gateway_configured'] is True, f
          assert f['decision_adapter_enabled'] is True, f
          assert f['semantic_twelve_context_required'] is True, f
          assert f['k3_model_resolution_required'] is True, f
          assert f['telegram_publication_enabled'] is False, f
          assert f['live_money_execution_enabled'] is False, f
          assert f['accepted_code_head']==os.environ['GITHUB_SHA'], f
          PY

      - name: Preserve final production-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-production-ready-${{ github.sha }}
          path: |
            day53_launch_activation/
            /tmp/migrations.txt
            /tmp/worker-off-deploy.txt
            /tmp/worker-on-deploy.txt
            /tmp/scheduler-deploy.txt
            /tmp/health-off.json
            /tmp/health-on.json
            /tmp/deployment-identity.json
            /tmp/active-before.json
            /tmp/active-after.json
            /tmp/close-prior.txt
            /tmp/activate-new.txt
            /tmp/model-proof.json
            /tmp/twelve-request.json
            /tmp/snapshot-proof.json
            /tmp/admission-proof.json
            /tmp/forward-status.json
          if-no-files-found: warn
          retention-days: 90
