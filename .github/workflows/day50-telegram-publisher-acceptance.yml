name: AIDY Day 50 Telegram Publisher Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/telegram_publisher.py"
      - "tests/test_day50_telegram_publisher.py"
      - "scripts/day50_telegram_publisher_acceptance.py"
      - "docs/day50-private-telegram-publisher.md"
      - ".github/workflows/day50-telegram-publisher-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DAY50_BASE_SHA: 6119b97d422374d4bd7a9bd660e5ca597693fc23

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify Day 50 base and bounded surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$DAY50_BASE_SHA" HEAD)" = "$DAY50_BASE_SHA"
          allowed='^(src/aidy/telegram_publisher.py|tests/test_day50_telegram_publisher.py|scripts/day50_telegram_publisher_acceptance.py|docs/day50-private-telegram-publisher.md|.github/workflows/day50-telegram-publisher-acceptance.yml)$'
          unexpected="$(git diff --name-only "$DAY50_BASE_SHA"...HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected Day 50 changes:"; echo "$unexpected"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/telegram_publisher.py tests/test_day50_telegram_publisher.py scripts/day50_telegram_publisher_acceptance.py
          uv run python -m compileall -q src scripts tests

      - name: Enforce provider-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '^(from|import) .*?(metaapi|mt5|vantage|super_signals|broker|account|follower)' src/aidy/telegram_publisher.py; then
            echo "Day 50 imported a forbidden downstream execution integration"
            exit 1
          fi

      - name: Focused Day 50 adversarial tests
        shell: bash
        run: uv run pytest -q tests/test_day50_telegram_publisher.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

      - name: Deterministic acceptance A
        shell: bash
        run: |
          uv run python scripts/day50_telegram_publisher_acceptance.py --output-dir day50_artifacts_a > /tmp/day50-a.json
          cat /tmp/day50-a.json

      - name: Deterministic acceptance B
        shell: bash
        run: |
          uv run python scripts/day50_telegram_publisher_acceptance.py --output-dir day50_artifacts_b > /tmp/day50-b.json
          cat /tmp/day50-b.json

      - name: Require byte-identical evidence
        shell: bash
        run: diff -ru day50_artifacts_a day50_artifacts_b

      - name: Enforce Day 50 boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          with open("day50_artifacts_a/summary.json", encoding="utf-8") as handle:
              result = json.load(handle)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert result["ok"] is True, result
          assert result["base_sha"] == "6119b97d422374d4bd7a9bd660e5ca597693fc23", result
          assert result["head_sha"] == head, result
          assert result["configured_private_group_name"] == "AI Signal", result
          assert result["envelope_verified"] is True, result
          assert result["receipt_verified"] is True, result
          assert result["simulated_send_count"] == 1, result
          assert result["idempotent_retry_sent_no_duplicate"] is True, result
          assert all(result["ineligible_cycle_blocks"].values()), result
          assert all(result["ineligible_source_blocks"].values()), result
          assert result["only_actionable_provider_instructions_publish"] is True, result
          assert result["ledger_identity_retained"] is True, result
          assert result["secrets_persisted"] is False, result
          assert result["real_telegram_post_performed"] is False, result
          assert result["broker_dependency_allowed"] is False, result
          assert result["follower_dependency_allowed"] is False, result
          assert result["super_signals_dependency_allowed"] is False, result
          assert result["formal_forward_evidence_created"] is False, result
          PY

      - name: Preserve Day 50 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day50-telegram-publisher-${{ github.event.pull_request.head.sha || github.sha }}
          path: day50_artifacts_a/
          if-no-files-found: error
          retention-days: 90
