name: Ops Twelve Free Tier Patch

on:
  push:
    branches: [fix/day53-twelve-free-tier-read-budget]
    paths:
      - ".github/ops/day53_twelve_free_tier_patch.py"
      - ".github/workflows/ops-twelve-free-tier-patch.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day53-twelve-free-tier-read-budget
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic patch
        run: |
          python .github/ops/day53_twelve_free_tier_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_day53_twelve_free_tier_read_budget.py')
          text = p.read_text(encoding='utf-8')
          old = '    section = text[text.index("async def latest_candle_ids"):text.index("async def latest_m1_bar")]\n'
          new = '    start = text.index("async def latest_candle_ids")\n    section = text[start:start + 2500]\n'
          if old not in text:
              raise SystemExit('expected staged test boundary not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        run: |
          uv run ruff check src/aidy/private_forward_context.py src/aidy/twelve_data_storage.py tests/test_day53_twelve_free_tier_read_budget.py
          uv run python -m compileall -q src tests

      - name: Focused regression
        run: |
          uv run pytest -q tests/test_day53_twelve_free_tier_read_budget.py tests/test_day53_live_forward_observer.py tests/test_day53_twelve_data_current_bucket_binding.py tests/test_day53_d1_read_budget.py

      - name: Full regression
        run: uv run pytest -q

      - name: Commit verified patch
        env:
          BRANCH: fix/day53-twelve-free-tier-read-budget
        run: |
          set -euo pipefail
          rm -f .github/ops/day53_twelve_free_tier_patch.py .github/workflows/ops-twelve-free-tier-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Twelve Data free-tier hot reads"
          git push origin "HEAD:$BRANCH"
