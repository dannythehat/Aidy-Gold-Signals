name: AIDY Environment V2 Live Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-environment-v2-live-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py
      - name: Audit latest v2 environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json             --config wrangler.research.live.jsonc             --command "
              SELECT
                v.window_start_utc,
                v.decided_at_utc,
                e.environment_version,
                json_extract(e.environment_json,'$.future_values_used') AS future_values_used,
                json_extract(e.environment_json,'$.live_money_execution_allowed') AS live_money_execution_allowed,
                json_extract(e.environment_json,'$.learning_dimensions.session') AS session,
                json_extract(e.environment_json,'$.learning_dimensions.session_phase') AS session_phase,
                json_extract(e.environment_json,'$.learning_dimensions.nearest_reference') AS nearest_reference,
                json_extract(e.environment_json,'$.learning_dimensions.nearest_reference_side') AS nearest_reference_side,
                json_extract(e.environment_json,'$.learning_dimensions.nearest_reference_distance_band') AS nearest_reference_distance_band,
                json_extract(e.environment_json,'$.learning_dimensions.prior_day_zone') AS prior_day_zone,
                json_extract(e.environment_json,'$.learning_dimensions.asia_overnight_zone') AS asia_overnight_zone,
                json_extract(e.environment_json,'$.learning_dimensions.active_session_zone') AS active_session_zone,
                json_extract(e.environment_json,'$.learning_dimensions.liquidity_signature') AS liquidity_signature,
                json_extract(e.environment_json,'$.learning_dimensions.five_minute_range_state') AS five_minute_range_state,
                json_extract(e.environment_json,'$.learning_dimensions.event_proximity') AS event_proximity,
                json_extract(e.environment_json,'$.learning_dimensions.h1_direction') AS h1_direction,
                json_extract(e.environment_json,'$.learning_dimensions.h4_direction') AS h4_direction,
                json_extract(e.environment_json,'$.learning_dimensions.cross_market_known_count') AS cross_market_known_count,
                json_array_length(json_extract(e.environment_json,'$.toolbox_coverage')) AS toolbox_items,
                json_array_length(e.scope_keys_json) AS scope_count
              FROM aidy_gold_cycle_environments e
              JOIN aidy_gold_cycle_views v ON v.cycle_view_id=e.cycle_view_id
              WHERE e.environment_version='aidy_gold_cycle_environment_v2'
              ORDER BY v.window_start_utc DESC
              LIMIT 1;
            "
