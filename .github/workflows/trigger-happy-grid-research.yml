name: TH001 Real Gold Tick Grid - Research 42 Jump Window Cases

on:
  push:
    branches: ['research/trigger-happy-v0-1-20261030']
    paths:
      - 'research/strategy_lab/trigger_happy/grid_sweep.py'
      - 'tests/test_trigger_happy_grid.py'
      - '.github/workflows/trigger-happy-grid-research.yml'

permissions:
  contents: read

jobs:
  grid-original-bidask-ticks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['202606','202607','202608','202609']
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compilation and numerical dependencies
        run: python -m pip install --quiet numpy numba
      - name: Verify exact frozen-logic parity before historical testing
        run: |
          python -m compileall -q research/strategy_lab/trigger_happy/
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_trigger_happy_grid.py -v
      - name: Read ORIGINAL genuine bid ask ticks from private R2
        run: |
          npx --yes wrangler@4 r2 object get "aidy-memory-test/strategy-lab/histdata/xauusd/ticks/${SOURCE_MONTH}/HISTDATA_COM_ASCII_XAUUSD_T_${SOURCE_MONTH}.zip" --remote --file "/tmp/th001_${SOURCE_MONTH}.zip"
      - name: 42 predeclared jump and detection-window combinations
        run: |
          PYTHONPATH=src:. python research/strategy_lab/trigger_happy/grid_sweep.py --archive "/tmp/th001_${SOURCE_MONTH}.zip" --period "${SOURCE_MONTH}" --out "artifacts/trigger_happy/grid/${SOURCE_MONTH}/"
          rm -f "/tmp/th001_${SOURCE_MONTH}.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: th001-42-case-${{ matrix.month }}-original-quote-research
          path: artifacts/trigger_happy/grid/${{ matrix.month }}/
          retention-days: 90
          if-no-files-found: warn
