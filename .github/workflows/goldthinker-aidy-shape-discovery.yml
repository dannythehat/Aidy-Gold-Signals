name: GoldThinker exploratory AIDY formation census

# Isolated research branch only. No trading, Cloudflare, datasets writes, or live PIT access.
on:
  push:
    branches:
      - research/goldthinker-historical-readonly-20261014
    paths:
      - .github/workflows/goldthinker-aidy-shape-discovery.yml
      - research/goldthinker_initial_shape_screen.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout research-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install BigQuery read-only API client
        run: python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3.25,<4' 'google-auth>=2.20,<3'
      - name: Compute 2024-25 exploratory formation counts and forward close behaviour
        run: python research/goldthinker_initial_shape_screen.py
      - name: Archive aggregate screening results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldthinker-exploratory-shape-census
          path: artifacts/goldthinker-shape-discovery.json
          if-no-files-found: ignore
          retention-days: 7
