name: Strategy Lab Day17 Cash Equity Ledger CI
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_cash_ledger.py
      - tests/test_strategy_lab_cash_ledger.py
      - .github/workflows/strategy-lab-day17-ledger.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q pytest ruff
      - run: |
          python -m compileall -q src/aidy/strategy_lab_cash_ledger.py tests/test_strategy_lab_cash_ledger.py
          ruff check src/aidy/strategy_lab_cash_ledger.py tests/test_strategy_lab_cash_ledger.py
      - name: Real SQLite cash and equity journal replay
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_cash_ledger.py
