name: Provider Intelligence Day 3 Diagnostic Deploy

on:
  push:
    branches: [research/provider-intelligence-20260906]
    paths:
      - ".github/workflows/provider-intelligence-day3-diagnostic-deploy.yml"

concurrency:
  group: aidy-day3-recovery-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test

jobs:
  diagnostic-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test diagnostic worker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q tests/test_provider_intelligence_day2_gold_calendar.py tests/test_provider_intelligence_day3_health.py
          python - <<'PY'
          import json, os
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['main']='src/day3_recovery_entry.py'
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          cfg['triggers']['crons']=[]
          assert cfg['queues']['consumers'][0]['queue']=='aidy-capture-test'
          assert cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']=='false'
          json.dump(cfg, open('wrangler.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Record rollback point and deploy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --name aidy-signals-test --json > /tmp/pre-deploy.json
          echo 'PRE_DEPLOY_STATUS_BEGIN'
          cat /tmp/pre-deploy.json
          echo 'PRE_DEPLOY_STATUS_END'
          rollback() {
            echo 'Verification failed: rolling AIDY worker back to immediately previous version.'
            npx --yes wrangler@4 rollback --name aidy-signals-test --message 'Automatic rollback: Day 3 diagnostic deployment verification failed' || true
          }
          trap rollback ERR
          uv run pywrangler deploy
          curl -fsS -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/health?day3_diag=${GITHUB_SHA}" > /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('status')=='ok', h
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source')=='twelve_data', h
          PY
          trap - ERR
          npx --yes wrangler@4 deployments status --name aidy-signals-test --json > /tmp/post-deploy.json
          echo 'POST_DEPLOY_STATUS_BEGIN'
          cat /tmp/post-deploy.json
          echo 'POST_DEPLOY_STATUS_END'

      - name: Capture the real queue exception
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 95s npx --yes wrangler@4 tail aidy-signals-test --format=json > /tmp/tail.log 2>&1
          rc=$?
          set -e
          echo "tail_exit=${rc}"
          cat /tmp/tail.log
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/tail.log').read_text(errors='replace')
          print(f'tail_bytes={len(text.encode())}')
          assert text.strip(), 'live tail returned no events'
          PY
