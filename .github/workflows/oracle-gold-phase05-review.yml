name: Oracle Gold phase05 audited review and cache regeneration
on:
  push:
    branches: ['codex/83-source-audit-batch01-20261028']
    paths: ['reports/gold_oracle/phase05/**', 'scripts/oracle_gold/phase05_review.py', 'tests/test_oracle_gold_phase05_review.py', '.github/workflows/oracle-gold-phase05-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence-and-regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src:.
      ORACLE_PHASE05_S083_ROOT: /tmp/S083
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 backtrader==1.9.78.123 cryptography pytest ruff
      - name: Pin original engine and every dependency before import
        run: |
          python - <<'PYCODE'
          import json,subprocess
          from pathlib import Path
          from scripts.oracle_gold.phase05_native_accounts import verify_source
          pin=json.loads(Path('research/gold_oracle/phase05/S083_source_pin.json').read_text())
          subprocess.run(['git','clone','--quiet',pin['source_url'],'/tmp/S083'],check=True)
          subprocess.run(['git','-C','/tmp/S083','checkout','--quiet',pin['commit']],check=True)
          verify_source(Path('/tmp/S083'))
          PYCODE
      - name: Actual original gap/timeout regressions and cost-aware cash sizing
        run: |
          ruff check scripts/oracle_gold tests/test_oracle_gold_phase05*.py
          python -m pytest -q tests/test_oracle_gold_phase05.py tests/test_oracle_gold_phase05_pine.py tests/test_oracle_gold_phase05_execution_costs.py tests/test_oracle_gold_phase05_review.py tests/test_oracle_gold_phase04_review.py tests/test_oracle_gold_phase03.py tests/test_oracle_gold_phase03_register.py --junitxml=artifacts/tests.xml
      - uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Unwrap36 authenticated caches; no new archive GET or warehouse SELECT
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            period="${folder##*oracle-bidask-}"
            python -m scripts.oracle_gold.snapshot_bundle open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2023
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2023
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2024
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2024
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2025
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2025
      - name: Unwrap authorised research cache only; no BigQuery or R2 requests
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for year in 2023 2024 2025; do
            python -m scripts.oracle_gold.snapshot_bundle open-ci --source "/tmp/oracle-cached/${year}/snapshot.encrypted.json" --out "/tmp/oracle-minutes/${year}"
          done
      - name: Regenerate benchmarks, accounts, correlation and83-ID decisions from exact CI evidence
        run: |
          python -m scripts.oracle_gold.phase05_review --quotes /tmp/quotes --snapshots /tmp/oracle-minutes --out /tmp/review
          python - <<'PYCODE'
          import json,math
          from pathlib import Path
          def equal(a,b):
              if isinstance(a,dict):return a.keys()==b.keys() and all(equal(a[k],b[k]) for k in a)
              if isinstance(a,list):return len(a)==len(b) and all(equal(x,y) for x,y in zip(a,b))
              if isinstance(a,(int,float)) and isinstance(b,(int,float)):return math.isclose(a,b,rel_tol=1e-12,abs_tol=1e-8)
              return a==b
          for p in Path('/tmp/review').glob('*.json'):
              assert equal(json.loads(p.read_text()),json.loads((Path('reports/gold_oracle/phase05/review')/p.name).read_text())),p.name
          print('PHASE05_ALL_EVIDENCE_DECISIONS_REGENERATE')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-phase05-final-evidence-checks
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
