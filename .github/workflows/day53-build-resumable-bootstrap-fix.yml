name: AIDY Day 53 Build Resumable Bootstrap Fix

on:
  push:
    branches: [ops/day53-build-resumable-bootstrap-fix]
    paths: [".github/workflows/day53-build-resumable-bootstrap-fix.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: day53/resumable-bootstrap-runtime-fix

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Switch to target branch and apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/ops/day53_resumable_patch.py /tmp/day53_resumable_patch.py
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python /tmp/day53_resumable_patch.py
          python - <<'PY'
          from pathlib import Path
          test_path=Path('tests/test_day53_bootstrap_admission_recovery.py')
          text=test_path.read_text(encoding='utf-8')
          text=text.replace("assert '\"next_step\": \"continue_bootstrap\"' in entry", "assert '\"continue_bootstrap\"' in entry")
          test_path.write_text(text, encoding='utf-8')
          workflow_path=Path('.github/workflows/day53-bootstrap-admission-recovery.yml')
          text=workflow_path.read_text(encoding='utf-8')
          text=text.replace("grep -F '\"next_step\": \"continue_bootstrap\"' src/entry.py", "grep -F '\"continue_bootstrap\"' src/entry.py")
          workflow_path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check src/aidy/twelve_data_bootstrap.py src/entry.py tests/test_day53_bootstrap_admission_recovery.py
          uv run pytest -q tests/test_day53_bootstrap_admission_recovery.py tests/test_day53_twelve_data_launch_cleanup.py
          uv run python -m compileall -q src tests
      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIDY Launch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/aidy/twelve_data_bootstrap.py src/entry.py tests/test_day53_bootstrap_admission_recovery.py .github/workflows/day53-bootstrap-admission-recovery.yml
          git diff --cached --check
          git commit -m 'Day 53: make Twelve bootstrap resumable across Worker requests'
          git push origin HEAD:"$TARGET_BRANCH"
