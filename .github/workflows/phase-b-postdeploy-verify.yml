name: Phase B Postdeploy Verify

on:
  push:
    branches: [feature/aidy-hub-phase-b-episode-memory-20260913]
    paths:
      - ".github/workflows/phase-b-postdeploy-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test
  AIDY_WORKER_NAME: aidy-signals-test

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build read-only D1 config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          json.dump(cfg, open('wrangler.phase-b.verify.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Prove live route after Cloudflare propagation
        shell: bash
        run: |
          set -euo pipefail
          route_ok=0
          for attempt in $(seq 1 40); do
            health="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/health?phase_b_verify=${GITHUB_SHA}-${attempt}" || true)"
            memory="$(curl -sS -o /tmp/memory.txt -w '%{http_code}' -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/provider/decision-memory?limit=5&verify=${GITHUB_SHA}-${attempt}" || true)"
            echo "attempt=${attempt} health=${health} memory=${memory}"
            if [ "$health" = "200" ] && [ "$memory" = "401" ]; then
              route_ok=1
              break
            fi
            sleep 3
          done
          test "$route_ok" -eq 1
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert h.get('status') in {'ok','degraded'},h
          assert h.get('scheduler')=='direct-cron',h
          assert h.get('market_data_source')=='twelve_data',h
          print('phase_b_route=PASS')
          PY

      - name: Prove live Phase B schema and current evidence counts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.verify.jsonc \
            --command "SELECT name,type FROM sqlite_master WHERE name IN ('aidy_memory_episodes','aidy_memory_outcomes','aidy_learning_cards') ORDER BY name; SELECT COUNT(*) AS episodes FROM aidy_memory_episodes; SELECT COUNT(*) AS outcomes FROM aidy_memory_outcomes; SELECT COUNT(*) AS cards FROM aidy_learning_cards; SELECT COUNT(*) AS e2e_cycles FROM aidy_end_to_end_cycles; SELECT COUNT(*) AS forward_evaluations FROM aidy_forward_evaluations; SELECT state,COUNT(*) AS n FROM aidy_forward_cohorts GROUP BY state ORDER BY state;" \
            | tee /tmp/phase-b-live.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/phase-b-live.json',encoding='utf-8'))
          batches=[b.get('results') or [] for b in p]
          names={r.get('name') for r in batches[0]}
          assert {'aidy_memory_episodes','aidy_memory_outcomes','aidy_learning_cards'} <= names,names
          print('phase_b_live_schema=PASS')
          print(json.dumps({
              'episodes': batches[1][0].get('episodes') if batches[1] else None,
              'outcomes': batches[2][0].get('outcomes') if batches[2] else None,
              'cards': batches[3][0].get('cards') if batches[3] else None,
              'e2e_cycles': batches[4][0].get('e2e_cycles') if batches[4] else None,
              'forward_evaluations': batches[5][0].get('forward_evaluations') if batches[5] else None,
              'cohort_states': batches[6],
          }, sort_keys=True))
          PY

      - name: Prove no-hindsight invariants and direct Crons
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.phase-b.verify.jsonc \
            --command "SELECT COALESCE(SUM(future_outcome_fields_present),0) AS future_fields,COALESCE(SUM(broker_or_account_state_used),0) AS broker_state,COALESCE(SUM(follower_state_used),0) AS follower_state,COALESCE(SUM(super_signals_used),0) AS super_signals,COALESCE(SUM(live_money_execution_used),0) AS live_money FROM aidy_memory_episodes; SELECT COALESCE(SUM(hidden_reasoning_stored),0) AS hidden_reasoning,COALESCE(SUM(same_episode_retrieval_allowed),0) AS same_episode FROM aidy_learning_cards;" \
            > /tmp/invariants.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/invariants.json',encoding='utf-8'))
          b=[x.get('results') or [] for x in p]
          e=b[0][0]; c=b[1][0]
          assert all(int(e.get(k) or 0)==0 for k in ('future_fields','broker_state','follower_state','super_signals','live_money')),e
          assert int(c.get('hidden_reasoning') or 0)==0,c
          assert int(c.get('same_episode') or 0)==0,c
          print('phase_b_no_hindsight=PASS')
          PY
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${AIDY_WORKER_NAME}/schedules" > /tmp/schedules.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/schedules.json',encoding='utf-8'))
          result=p.get('result') or {}
          rows=result.get('schedules') if isinstance(result,dict) else result
          actual=set()
          for row in rows or []:
              if isinstance(row,str): actual.add(row)
              elif isinstance(row,dict) and row.get('cron'): actual.add(str(row['cron']))
          expected={'* * * * *'}
          assert expected <= actual,(actual,p)
          print('phase_b_direct_crons=PASS')
          PY
