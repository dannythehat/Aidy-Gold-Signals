name: Strategy Lab Day31 Adversarial Report Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_report_adversarial.py
      - scripts/strategy_lab/day31_adversarial_report_acceptance.py
      - tests/test_strategy_lab_day31_adversarial.py
      - docs/strategy-lab-day31-adversarial-acceptance.md
      - .github/workflows/strategy-lab-day31-adversarial.yml

permissions:
  contents: read

jobs:
  day31-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audit PDF, CSV, render and historical read-only dependencies
        run: |
          python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4' reportlab pypdf pillow matplotlib pypdfium2
      - name: Ruff and compile must succeed before evidence output
        run: |
          python -m compileall -q src/aidy/strategy_lab_report_adversarial.py scripts/strategy_lab/day31_adversarial_report_acceptance.py tests/test_strategy_lab_day31_adversarial.py
          ruff check src/aidy/strategy_lab_report_adversarial.py scripts/strategy_lab/day31_adversarial_report_acceptance.py tests/test_strategy_lab_day31_adversarial.py
      - name: Full adversarial and Days24-30 quantitative regression suite
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_day31_adversarial.py tests/test_strategy_lab_report_exports.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py tests/test_strategy_lab_regimes.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_baselines_stress.py tests/test_strategy_lab_risk_metrics.py
      - name: Execute all forged CSV/PDF claims against source-replayed actual report
        run: |
          PYTHONPATH=src:. python scripts/strategy_lab/day31_adversarial_report_acceptance.py
      - name: Enforce unsigned independent human review requirement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('artifacts/strategy_lab/day31_adversarial_acceptance.json')
          x=json.loads(f.read_text())
          assert x["status"] == "PASS"
          assert x["attacks_attempted"] == x["attacks_rejected"] == 16
          assert x["independent_human_review_complete"] is False
          assert x["overall_owner_day31_stage_pass"] is False
          assert x["day31_human_review_pending"] is True
          p=Path('artifacts/strategy_lab/day31_human_review_pending.md')
          assert "PENDING HUMAN REVIEW" in p.read_text()
          assert "NOT PROVIDED" in p.read_text()
          print('Adversarial engineering passed. Human review accurately PENDING.')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day31-16-attacks-and-unsigned-human-review-packet
          path: |
            artifacts/strategy_lab/day31_adversarial_acceptance.json
            artifacts/strategy_lab/day31_human_review_pending.md
            artifacts/strategy_lab/day30/
            artifacts/strategy_lab/day29_canonical_auditable_result.json
          retention-days: 90
