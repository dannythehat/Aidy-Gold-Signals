name: Strategy Lab Day26 Walkforward and Sealed Out-of-Sample

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_oos_protocol.py
      - src/aidy/strategy_lab_oos_trial_registry.py
      - scripts/strategy_lab/day26_sealed_oos_real_history.py
      - tests/test_strategy_lab_oos_protocol.py
      - tests/test_strategy_lab_day26_real_history.py
      - docs/strategy-lab-day26-walkforward-sealed-holdout.md
      - .github/workflows/strategy-lab-day26-oos.yml

permissions:
  contents: read

jobs:
  day26-oos-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CI dependencies
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Syntax and style gate
        run: |
          python -m compileall -q src/aidy/strategy_lab_oos_protocol.py src/aidy/strategy_lab_oos_trial_registry.py scripts/strategy_lab/day26_sealed_oos_real_history.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_day26_real_history.py
          ruff check src/aidy/strategy_lab_oos_protocol.py src/aidy/strategy_lab_oos_trial_registry.py scripts/strategy_lab/day26_sealed_oos_real_history.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_day26_real_history.py
      - name: Leakage/embargo/registry denial and earlier source regression
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_day26_real_history.py tests/test_strategy_lab_day22_real_history.py tests/test_strategy_lab_baselines_stress.py tests/test_strategy_lab_risk_metrics.py
      - name: Two live read-only BigQuery snapshots and frozen one-use OOS history
        run: PYTHONPATH=src:. python scripts/strategy_lab/day26_sealed_oos_real_history.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day26-real-histdata-chronological-purged-sealed-holdout-evidence
          path: artifacts/strategy_lab/day26_sealed_oos_real_history.json
          retention-days: 90
