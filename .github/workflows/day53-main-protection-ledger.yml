name: AIDY Day 53 Main Protection Ledger

on:
  workflow_dispatch:
  push:
    branches:
      - day53/twelve-data-ohlc-adapter
    paths:
      - "ops/day53-main-protection-ledger-trigger.txt"

permissions:
  contents: read

env:
  D1_CONFIG: wrangler.main-protection-ledger.jsonc
  ATTESTATION: evidence/research_ledger/day53-main-branch-protection-attestation.json

jobs:
  append-protection-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded dependencies and validate append code
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check scripts/day53_branch_protection_ledger_append.py

      - name: Build minimal D1 config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cfg={
              'name':'aidy-signals-test',
              'main':'src/entry.py',
              'compatibility_date':'2026-08-16',
              'compatibility_flags':['python_workers'],
              'd1_databases':[{
                  'binding':'AIDY_OPS',
                  'database_name':'aidy-ops-test',
                  'database_id':'3588d82a-d686-4430-872d-d4c0e62c3d5d',
                  'migrations_dir':'migrations/d1',
              }],
          }
          json.dump(cfg, open('wrangler.main-protection-ledger.jsonc','w',encoding='utf-8'), indent=2)
          PY
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config "$D1_CONFIG"

      - name: Read authoritative ledger
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config "$D1_CONFIG" \
            --command "SELECT sequence,record_digest,previous_digest,ledger_version,record_type,recorded_at_utc,code_head_sha,initiated_by,payload_json FROM research_evidence_ledger ORDER BY sequence" \
            > /tmp/ledger-before.json

      - name: Prepare exact protection record
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED_HEAD="$(git rev-parse HEAD)"
          uv run python scripts/day53_branch_protection_ledger_append.py prepare \
            --ledger /tmp/ledger-before.json \
            --attestation "$ATTESTATION" \
            --accepted-head "$ACCEPTED_HEAD" \
            --sql /tmp/protection-record.sql \
            --output day53_main_protection_preappend.json

      - name: Append protection record
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^INSERT INTO research_evidence_ledger' /tmp/protection-record.sql; then
            npx --yes wrangler@4 d1 execute AIDY_OPS --remote \
              --config "$D1_CONFIG" --file /tmp/protection-record.sql
          else
            echo "No branch-protection append required."
          fi
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config "$D1_CONFIG" \
            --command "SELECT sequence,record_digest,previous_digest,ledger_version,record_type,recorded_at_utc,code_head_sha,initiated_by,payload_json FROM research_evidence_ledger ORDER BY sequence" \
            > /tmp/ledger-after.json

      - name: Verify authoritative ledger
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/day53_branch_protection_ledger_append.py verify \
            --ledger /tmp/ledger-after.json \
            --attestation "$ATTESTATION" \
            --output day53_main_protection_ledger.json

      - name: Preserve governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-main-protection-ledger-${{ github.sha }}
          path: |
            day53_main_protection_preappend.json
            day53_main_protection_ledger.json
          if-no-files-found: error
          retention-days: 90
