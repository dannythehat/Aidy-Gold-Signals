name: AIDY Day 2 Deployed Python Diagnostic

on:
  push:
    branches:
      - feature/day-2-real-evidence-capture
    paths:
      - '.github/workflows/day2-deployed-python-diagnostic.yml'

permissions:
  contents: read

jobs:
  deployed-python-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_METAAPI_TOKEN: ${{ secrets.AIDY_METAAPI_TOKEN }}
      AIDY_METAAPI_ACCOUNT_ID: 9bcef441-1821-4479-88c7-bcf3d210e9a3
      DIAG_WORKER: aidy-signals-day2-diagnostic
      DIAG_URL: https://aidy-signals-day2-diagnostic.dannythehat2.workers.dev
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy temporary no-Cron diagnostic Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${AIDY_METAAPI_TOKEN:-}"
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync >/dev/null

          cat > src/day2_diagnostic_entry.py <<'PY'
          from __future__ import annotations

          from datetime import UTC, datetime
          from urllib.parse import urlparse

          from workers import Response, WorkerEntrypoint

          from aidy.cloudflare_storage import D1OperationalEvidenceStore, R2ArchiveStore
          from aidy.config import AidySettings
          from aidy.market_recorder import FAST_TIMEFRAMES
          from aidy.metaapi_read_gateway import MetaApiReadError, MetaApiReadGateway
          from aidy.runtime import run_capture_cycle
          from aidy.storage_contracts import AidyMarketRepository


          def _repository(env):
              operational = D1OperationalEvidenceStore(env.AIDY_OPS)
              return operational, AidyMarketRepository(operational, R2ArchiveStore(env.AIDY_MEMORY))


          class Default(WorkerEntrypoint):
              async def fetch(self, request):
                  url = urlparse(request.url)
                  if url.path == "/health":
                      return Response.json({"ok": True, "kind": "day2_python_diagnostic"})

                  if url.path == "/probe/metaapi":
                      gateway = MetaApiReadGateway(timeout_seconds=12.0)
                      token = str(self.env.AIDY_METAAPI_TOKEN)
                      account_id = str(self.env.AIDY_METAAPI_ACCOUNT_ID)
                      try:
                          region = await gateway.resolve_account_region(token=token, account_id=account_id)
                          positions = await gateway.read_positions(token=token, account_id=account_id, region=region)
                          price = await gateway.read_symbol_price(token=token, account_id=account_id, region=region, symbol="XAUUSD")
                          candles = await gateway.read_historical_candles(token=token, account_id=account_id, region=region, symbol="XAUUSD", timeframe="1m", limit=3)
                          return Response.json({
                              "ok": True,
                              "region_resolved": bool(region),
                              "positions_is_list": isinstance(positions, list),
                              "positions_count": len(positions) if isinstance(positions, list) else None,
                              "price_has_bid": isinstance(price, dict) and price.get("bid") is not None,
                              "price_has_ask": isinstance(price, dict) and price.get("ask") is not None,
                              "price_has_time": isinstance(price, dict) and bool(price.get("time")),
                              "m1_candle_count": len(candles) if isinstance(candles, list) else None,
                          })
                      except MetaApiReadError as exc:
                          return Response.json({"ok": False, "stage": "metaapi", "error_code": exc.code, "retryable": exc.retryable}, status=502)
                      except Exception as exc:
                          return Response.json({"ok": False, "stage": "python_runtime", "error_type": type(exc).__name__}, status=500)

                  if url.path == "/probe/capture":
                      try:
                          settings = AidySettings.from_worker_env(self.env)
                          _, repository = _repository(self.env)
                          result = await run_capture_cycle(
                              settings,
                              repository=repository,
                              now=datetime.now(UTC),
                              timeframes=FAST_TIMEFRAMES,
                              include_market=True,
                              include_fed=False,
                          )
                          if result is None or result.market is None:
                              return Response.json({"ok": False, "stage": "capture", "error_code": "no_market_result"}, status=500)
                          return Response.json({
                              "ok": True,
                              "capture_status": result.market.status,
                              "market_open": result.market.market_open,
                              "stored_candles": result.market.stored_candles,
                              "snapshot_written": result.market.snapshot_id is not None,
                              "archive_attempted": result.archive.attempted,
                              "archive_archived": result.archive.archived,
                              "archive_failed": result.archive.failed,
                          })
                      except Exception as exc:
                          code = exc.code if isinstance(exc, MetaApiReadError) else None
                          return Response.json({
                              "ok": False,
                              "stage": "capture_runtime",
                              "error_type": type(exc).__name__,
                              "error_code": code,
                          }, status=500)

                  return Response("Not found", status=404)
          PY

          python - <<'PY'
          import json, os
          cfg={
            "name": os.environ["DIAG_WORKER"],
            "main": "src/day2_diagnostic_entry.py",
            "compatibility_date": "2026-08-16",
            "compatibility_flags": ["python_workers"],
            "vars": {
              "AIDY_ENV": "diagnostic",
              "AIDY_CAPTURE_ENABLED": "true",
              "AIDY_MARKET_POLL_SECONDS": "60",
              "AIDY_SLOW_POLL_SECONDS": "300",
              "AIDY_MARKET_CLOSED_BACKOFF_SECONDS": "900",
              "AIDY_MARKET_STALE_SECONDS": "300",
              "AIDY_FED_RSS_POLL_SECONDS": "120",
              "AIDY_ARCHIVE_FLUSH_LIMIT": "100"
            },
            "d1_databases": [{
              "binding": "AIDY_OPS",
              "database_name": "aidy-ops-test",
              "database_id": os.environ["D1_ID"],
              "migrations_dir": "migrations/d1"
            }],
            "r2_buckets": [{"binding": "AIDY_MEMORY", "bucket_name": "aidy-memory-test"}]
          }
          with open('wrangler.jsonc','w',encoding='utf-8') as f:
              json.dump(cfg,f,indent=2); f.write('\n')
          PY

          uv run pywrangler deploy 2>&1 | tee /tmp/diag-deploy.log
          grep -q "${DIAG_WORKER}" /tmp/diag-deploy.log

          printf '%s' "$AIDY_METAAPI_TOKEN" | npx --yes wrangler@4 secret put AIDY_METAAPI_TOKEN --name "$DIAG_WORKER" >/dev/null
          printf '%s' "$AIDY_METAAPI_ACCOUNT_ID" | npx --yes wrangler@4 secret put AIDY_METAAPI_ACCOUNT_ID --name "$DIAG_WORKER" >/dev/null
          echo 'Temporary diagnostic Worker deployed; no Cron trigger was created and secret values were not printed.'

      - name: Probe Python Worker runtime and AIDY capture once
        shell: bash
        run: |
          set -u
          health='000'
          for i in $(seq 1 30); do
            health="$(curl --max-time 4 -sS -o /tmp/diag-health.json -w '%{http_code}' "${DIAG_URL}/health" || true)"
            [ "$health" = '200' ] && break
            sleep 3
          done
          echo "diagnostic_health_http=${health}"
          [ -f /tmp/diag-health.json ] && { echo -n 'diagnostic_health='; cat /tmp/diag-health.json; echo; }

          meta='not_attempted'
          capture='not_attempted'
          if [ "$health" = '200' ]; then
            meta="$(curl --max-time 35 -sS -o /tmp/metaapi-probe.json -w '%{http_code}' "${DIAG_URL}/probe/metaapi" || true)"
            echo "metaapi_from_worker_http=${meta}"
            [ -f /tmp/metaapi-probe.json ] && { echo -n 'metaapi_from_worker='; cat /tmp/metaapi-probe.json; echo; }

            capture="$(curl --max-time 55 -sS -o /tmp/capture-probe.json -w '%{http_code}' "${DIAG_URL}/probe/capture" || true)"
            echo "capture_from_worker_http=${capture}"
            [ -f /tmp/capture-probe.json ] && { echo -n 'capture_from_worker='; cat /tmp/capture-probe.json; echo; }
          fi

          python - <<'PY' >/tmp/d1-payload.json
          import json
          print(json.dumps({'sql':'SELECT COUNT(*) AS snapshots, MAX(captured_at) AS latest FROM market_snapshots'}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/d1-payload.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query" \
            >/tmp/d1-after.json || true
          python - <<'PY'
          import json
          p=json.load(open('/tmp/d1-after.json',encoding='utf-8'))
          block=(p.get('result') or [{}])[0]
          print('d1_after_deployed_probe='+json.dumps(block.get('results') or [],separators=(',',':')))
          PY

          echo 'Diagnostic probe finished. This step intentionally records evidence even when a probe returns non-200.'

      - name: Remove temporary diagnostic Worker
        if: always()
        shell: bash
        run: |
          set -u
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${DIAG_WORKER}" || true)"
          echo "diagnostic_worker_delete_http=${code}"
          echo 'Temporary diagnostic Worker cleanup attempted.'
