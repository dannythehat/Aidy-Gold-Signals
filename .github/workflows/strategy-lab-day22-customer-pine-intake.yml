name: Strategy Lab Day22 Inbound Customer Pine Intake CI
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_customer_pine_intake.py
      - scripts/strategy_lab/day22_triage_customer_pine.py
      - tests/test_strategy_lab_customer_pine_intake.py
      - docs/strategy-lab-day22-customer-pine-intake.md
      - .github/workflows/strategy-lab-day22-customer-pine-intake.yml

permissions:
  contents: read

jobs:
  validate-customer-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest ruff
      - name: Compile and strict Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_customer_pine_intake.py scripts/strategy_lab/day22_triage_customer_pine.py tests/test_strategy_lab_customer_pine_intake.py
          ruff check src/aidy/strategy_lab_customer_pine_intake.py scripts/strategy_lab/day22_triage_customer_pine.py tests/test_strategy_lab_customer_pine_intake.py
      - name: Customer intake, Pine adapter and genuine-ref gate regressions
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_customer_pine_intake.py tests/test_strategy_lab_pine_adapter.py tests/test_strategy_lab_tv_chart_csv.py
      - name: Customer owns source; no TradingView login needed
        run: |
          PYTHONPATH=src python scripts/strategy_lab/day22_triage_customer_pine.py research/strategy_lab/fixtures/day22_internal_pine_v6.pine.txt
          sha256sum research/strategy_lab/fixtures/day22_internal_pine_v6.pine.txt
