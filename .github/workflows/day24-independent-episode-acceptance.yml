name: AIDY Day 24 Independent Episode Retrieval Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/analogue_retrieval_v2.py"
      - "src/aidy/evidence_grading_v2.py"
      - "tests/test_day24_independent_retrieval.py"
      - "scripts/day24_independent_episode_acceptance.py"
      - "docs/day24-independent-episode-retrieval-preregistration.md"
      - ".github/workflows/day24-independent-episode-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: day24-independent-episode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
  AIDY_BIGQUERY_DATASET: aidy_analytics_test
  AIDY_BIGQUERY_LOCATION: EU
  DAY24_BASE_SHA: 9f0803040e49d58fe082a7de863d8647f7470b84

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify authoritative Day 23 base and frozen v1 baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${DAY24_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$DAY24_BASE_SHA" HEAD
          test "$(git merge-base "$DAY24_BASE_SHA" HEAD)" = "$DAY24_BASE_SHA"
          git diff --exit-code "$DAY24_BASE_SHA" -- \
            src/aidy/analogue_retrieval.py \
            src/aidy/evidence_grading.py \
            src/aidy/day23_research.py \
            scripts/day23_independence_baseline.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            src/aidy/analogue_retrieval_v2.py \
            src/aidy/evidence_grading_v2.py \
            tests/test_day24_independent_retrieval.py \
            scripts/day24_independent_episode_acceptance.py
          uv run python -m compileall -q src scripts tests

      - name: Run Day 24 focused tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_day24_independent_retrieval.py

      - name: Run full regression suite once
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q

      - name: Require existing Google Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AIDY_GCP_SERVICE_ACCOUNT_JSON:-}" || { echo "Missing AIDY_GCP_SERVICE_ACCOUNT_JSON"; exit 1; }
          python - <<'PY'
          import json
          import os

          info = json.loads(os.environ["AIDY_GCP_SERVICE_ACCOUNT_JSON"])
          assert info.get("type") == "service_account"
          assert info.get("project_id")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"AIDY_GCP_PROJECT_ID={info['project_id']}\n")
          PY

      - name: Install bounded BigQuery dependency
        shell: bash
        run: |
          set -euo pipefail
          uv pip install 'google-cloud-bigquery>=3.42,<4'

      - name: Run exact frozen 1,000-query Day 24 acceptance
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/day24_independent_episode_acceptance.py \
            --output-dir day24_artifacts \
            > /tmp/day24-summary.json
          cat /tmp/day24-summary.json

      - name: Enforce Day 24 evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          with open("day24_artifacts/summary.json", encoding="utf-8") as handle:
              result = json.load(handle)

          assert result["ok"] is True, result
          assert result["base_sha"] == "9f0803040e49d58fe082a7de863d8647f7470b84", result
          assert result["frozen_manifest_digest"] == "119d8c2a1a11cba44d8195fff81be640f7b9c084d0d7b8c28a61dedfa64e5ac5", result
          assert result["frozen_query_count"] == 1000, result
          assert result["query_removed_or_replaced"] is False, result
          assert result["candidate_store_snapshot_digest"] == "bd3c81b54ec05b2150e6e6ecbdffbc3c1e4f943c6a23c9a8ee4977c1dc1c3a88", result
          assert result["thresholds_retained"]["min_similarity_score"] == "0.720000", result
          assert result["thresholds_retained"]["min_component_coverage"] == "0.650000", result
          assert result["embargo_minutes"] == 240, result
          assert result["outcome_values_used_for_selection"] is False, result
          assert result["outcome_values_used_for_grading"] is False, result
          assert result["retrieval_reproducible_under_candidate_reordering"] is True, result
          assert result["episode_deduplication_enabled"] is True, result
          assert result["grading_uses_effective_independent_n"] is True, result
          assert isinstance(result["gate_relaxation_query_counts"], dict), result
          assert result["recovery_branch_invoked"] is False, result
          assert result["recovery_thresholds_used_as_acceptance_gate"] is False, result
          assert result["bigquery_evidence"]["result_rows"] == 1000, result
          PY

      - name: Preserve exact Day 24 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day24-independent-episode-${{ github.event.pull_request.head.sha }}
          path: day24_artifacts/
          if-no-files-found: error
          retention-days: 90
