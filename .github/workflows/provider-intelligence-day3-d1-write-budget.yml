name: Provider Intelligence Day 3 D1 Read Write Budget

on:
  push:
    branches: [research/provider-intelligence-20260906]
    paths:
      - ".github/workflows/provider-intelligence-day3-d1-write-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-usage-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
    steps:
      - uses: actions/checkout@v4
      - name: Measure today's D1 read and write rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          day=datetime.now(timezone.utc).date().isoformat()
          query='''query D1Usage($accountTag: string!, $day: Date, $databaseId: string) {
            viewer { accounts(filter: { accountTag: $accountTag }) {
              d1AnalyticsAdaptiveGroups(limit: 50, filter: {
                date_geq: $day, date_leq: $day, databaseId: $databaseId
              }) { sum { rowsRead rowsWritten } dimensions { date databaseId } }
            } }
          }'''
          body=json.dumps({'query':query,'variables':{
              'accountTag':os.environ['CLOUDFLARE_ACCOUNT_ID'],
              'day':day,
              'databaseId':os.environ['AIDY_D1_DATABASE_ID'],
          }}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=body,headers={
              'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              result=json.load(r)
          if result.get('errors'):
              raise SystemExit(result['errors'])
          groups=result['data']['viewer']['accounts'][0]['d1AnalyticsAdaptiveGroups']
          rows_read=sum(int(item.get('sum',{}).get('rowsRead') or 0) for item in groups)
          rows_written=sum(int(item.get('sum',{}).get('rowsWritten') or 0) for item in groups)
          print(f'date_utc={day} rows_read={rows_read} rows_written={rows_written}')
          PY
