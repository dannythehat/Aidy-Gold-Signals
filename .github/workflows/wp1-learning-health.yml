name: WP1 learning health (offline)
on:
  pull_request:
    branches: [main]
    paths: ['src/aidy/data_health.py', 'src/provider_entry.py', 'tests/test_learning_health.py', '.github/workflows/wp1-learning-health.yml']
permissions:
  contents: read
jobs:
  learning-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio httpx
      - run: python -m pytest -q tests/test_learning_health.py tests/test_aidy_data_health.py tests/test_aidy_shadow_loop_watchdog.py tests/test_gold_expert_shadow.py tests/test_worker_deploy_ownership.py tests/test_worker_dependency_boundary.py
