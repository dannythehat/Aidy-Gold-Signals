name: AIDY Day 5 BigQuery Retention Probe

on:
  push:
    branches:
      - feature/day-5-historical-xauusd-backfill
    paths:
      - "ops/day5-bq-retention-trigger.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/day-5-historical-xauusd-backfill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspect retention metadata
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3.42,<4'
          python - <<'PY' > /tmp/day5-bq-retention.json
          import json, os
          from google.cloud import bigquery
          from google.oauth2 import service_account
          info=json.loads(os.environ['AIDY_GCP_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(info)
          project=info['project_id']
          client=bigquery.Client(project=project, credentials=creds, location='EU')
          ds=client.get_dataset(f'{project}.aidy_analytics_test')
          table=client.get_table(f'{project}.aidy_analytics_test.research_candles')
          tp=table.time_partitioning
          print(json.dumps({
            'dataset_default_table_expiration_ms': ds.default_table_expiration_ms,
            'dataset_default_partition_expiration_ms': ds.default_partition_expiration_ms,
            'table_expires': table.expires.isoformat() if table.expires else None,
            'partition_field': tp.field if tp else None,
            'partition_expiration_ms': tp.expiration_ms if tp else None,
          }, sort_keys=True))
          PY
      - name: Persist retention evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/day-5-historical-xauusd-backfill
          git reset --hard origin/feature/day-5-historical-xauusd-backfill
          cp /tmp/day5-bq-retention.json ops/day5-bq-retention.json
          git add ops/day5-bq-retention.json
          git commit -m "Day 5: record BigQuery retention probe"
          git push origin HEAD:feature/day-5-historical-xauusd-backfill
