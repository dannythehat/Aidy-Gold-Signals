name: AIDY Day 2 Queue Deploy

on:
  push:
    branches:
      - feature/day-2-real-evidence-capture
    paths:
      - '.github/workflows/day2-queue-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      QUEUE_NAME: aidy-capture-test
      CAPTURE_WORKER: aidy-signals-test
      SCHEDULER_WORKER: aidy-signals-scheduler-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test authoritative Day 2 branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q

      - name: Verify existing test queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4 queues list | grep -F "$QUEUE_NAME"

      - name: Deploy Python capture consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('wrangler.test.example.jsonc'))
          p['d1_databases'][0]['database_name']='aidy-ops-test'
          p['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          p['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          open('wrangler.jsonc','w').write(json.dumps(p,indent=2)+'\n')
          PY
          uv run pywrangler deploy 2>&1 | tee /tmp/capture-deploy.log
          curl -fsS https://aidy-signals-test.dannythehat2.workers.dev/health | tee /tmp/health.json
          jq -e '.status=="ok" and .environment=="test" and .capture_enabled==true and .scheduler=="queue-consumer"' /tmp/health.json >/dev/null

      - name: Deploy minimal one-minute scheduler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.scheduler.test.jsonc 2>&1 | tee /tmp/scheduler-deploy.log

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CAPTURE_WORKER}/schedules" >/tmp/capture-schedules.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCHEDULER_WORKER}/schedules" >/tmp/scheduler-schedules.json
          jq -e '.success and ((.result.schedules // [])|length)==0' /tmp/capture-schedules.json >/dev/null
          jq -e '.success and ((.result.schedules // [])|map(.cron)|index("* * * * *") != null)' /tmp/scheduler-schedules.json >/dev/null

          npx --yes wrangler@4 queues consumer worker list "$QUEUE_NAME" --json >/tmp/consumers.json
          jq -e 'map(select(.script=="aidy-signals-test"))|length==1' /tmp/consumers.json >/dev/null

          grep -E 'Current Version ID:' /tmp/capture-deploy.log || true
          grep -E 'Current Version ID:' /tmp/scheduler-deploy.log || true
          echo 'DAY 2 AUTHORITATIVE BRANCH DEPLOY PASSED'
