name: Gold Hunter OPEN Strategy Lab 2025 Authenticated Data

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gold_hunter/open_strategy_lab.py'
      - 'tests/test_gold_hunter_open_lab.py'
      - 'scripts/gold_hunter_open_strategy_research.py'
      - '.github/workflows/gold-hunter-open-strategy-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-five-strategy-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
      GOLD_HUNTER_RESEARCH_YEAR: '2025'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pytest 'google-cloud-bigquery>=3.42,<4' numpy pandas
      - name: Run causal portfolio and quote tests
        run: |
          python -m compileall -q src/gold_hunter/open_strategy_lab.py scripts/gold_hunter_open_strategy_research.py tests/test_gold_hunter_open_lab.py
          python -m pytest -q tests/test_gold_hunter_open_lab.py
      - name: Revalidate full 2025 original BigQuery source months read only
        run: python scripts/strategy_lab/s010_run_12month_history.py
      - name: Run 5 systems and 4 combinations with real source and fees
        run: python scripts/gold_hunter_open_strategy_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOLD-HUNTER-OPEN-LAB-2025-GENUINE-SOURCE
          path: |
            artifacts/gold_hunter/open_lab_2025/
            artifacts/strategy_lab/s010_paid_customer_example/blocked_result.json
          if-no-files-found: warn
          retention-days: 90
