name: AIDY Day 6 Archive Dead Letter Rollout

on:
  push:
    branches: [main]
    paths:
      - "migrations/d1/0014_archive_delivery_state.sql"
      - "src/aidy/storage_contracts.py"
      - "src/aidy/cross_market_storage.py"
      - "tests/test_day6_archive_dead_letter.py"
      - ".github/workflows/day6-archive-dead-letter-rollout.yml"

concurrency:
  group: aidy-day6-archive-dead-letter-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test
  D1_ROWS_READ_ALERT_THRESHOLD: "3250000"

jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and re-run Day 6 gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check src/aidy/storage_contracts.py src/aidy/cross_market_storage.py tests/test_day6_archive_dead_letter.py
          uv run pytest -q tests/test_day6_archive_dead_letter.py tests/test_storage_contracts.py tests/test_d1_storage_local.py
          uv run pytest -q

      - name: Record pre-rollout heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['AIDY_D1_DATABASE_ID']}/query"
          sql="""
          SELECT requested_at_utc,status,error_code
          FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_requested_at_credits
          WHERE request_kind='scheduled_capture'
          ORDER BY requested_at_utc DESC LIMIT 1
          """
          req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':[]}).encode(),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          assert payload.get('success') is True, payload
          result=payload.get('result') or []
          row=(result[0].get('results') or [{}])[0] if result else {}
          Path('/tmp/day6-before.json').write_text(json.dumps(row,sort_keys=True),encoding='utf-8')
          print('pre_rollout_heartbeat='+json.dumps(row,sort_keys=True))
          PY

      - name: Build capture-only production config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from types import SimpleNamespace
          from aidy.config import AidySettings
          cfg=json.load(open('wrangler.test.example.jsonc',encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          cfg['triggers']['crons']=[]
          settings=AidySettings.from_worker_env(SimpleNamespace(**cfg['vars']))
          assert settings.capture_enabled is True
          assert settings.market_data_source == 'twelve_data'
          assert settings.market_data_ownership == 'public_independent'
          assert str(cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']).lower() == 'false'
          json.dump(cfg,open('wrangler.day6.live.jsonc','w',encoding='utf-8'),indent=2)
          PY

      - name: Apply additive D1 migration then deploy exact main Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.day6.live.jsonc
          cp wrangler.day6.live.jsonc wrangler.jsonc
          uv run pywrangler deploy

      - name: Verify production schema, health, archive state and new scheduler heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsS -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/health?day6=${GITHUB_SHA}-${attempt}" > /tmp/day6-health.json || true
            if python - <<'PY'
          import json
          try: h=json.load(open('/tmp/day6-health.json',encoding='utf-8'))
          except Exception: raise SystemExit(1)
          ok=(h.get('capture_enabled') is True and h.get('formal_forward_enabled') is False and h.get('market_data_source')=='twelve_data' and h.get('market_data_ownership')=='public_independent')
          raise SystemExit(0 if ok else 1)
          PY
            then break; fi
            sleep 3
          done
          python - <<'PY'
          import json
          h=json.load(open('/tmp/day6-health.json',encoding='utf-8'))
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source') == 'twelve_data', h
          assert h.get('market_data_ownership') == 'public_independent', h
          print('health=PASS '+json.dumps(h,sort_keys=True))
          PY

          python - <<'PY'
          import json, os, time, urllib.request
          before=json.load(open('/tmp/day6-before.json',encoding='utf-8'))
          before_at=before.get('requested_at_utc') or ''
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['AIDY_D1_DATABASE_ID']}/query"
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def query(sql):
              req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':[]}).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
              assert payload.get('success') is True, payload
              result=payload.get('result') or []
              return result[0] if result else {'results':[],'meta':{}}

          cols=query("SELECT name FROM pragma_table_info('archive_outbox') WHERE name IN ('delivery_state','next_attempt_at','first_failed_at','dead_lettered_at') ORDER BY name")['results']
          cross_cols=query("SELECT name FROM pragma_table_info('cross_market_archive_outbox') WHERE name IN ('delivery_state','next_attempt_at','first_failed_at','dead_lettered_at') ORDER BY name")['results']
          expected={'delivery_state','next_attempt_at','first_failed_at','dead_lettered_at'}
          assert {r['name'] for r in cols} == expected, cols
          assert {r['name'] for r in cross_cols} == expected, cross_cols

          gold=query("SELECT delivery_state,COUNT(*) AS n FROM archive_outbox WHERE status='pending' GROUP BY delivery_state ORDER BY delivery_state")['results']
          cross=query("SELECT delivery_state,COUNT(*) AS n FROM cross_market_archive_outbox WHERE status='pending' GROUP BY delivery_state ORDER BY delivery_state")['results']
          assert sum(int(r['n']) for r in gold if r['delivery_state']=='dead_letter') == 0, gold
          assert sum(int(r['n']) for r in cross if r['delivery_state']=='dead_letter') == 0, cross
          print('archive_state='+json.dumps({'gold':gold,'cross_market':cross},sort_keys=True))

          latest={}
          for attempt in range(1,13):
              result=query("""
              SELECT requested_at_utc,status,error_code
              FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_requested_at_credits
              WHERE request_kind='scheduled_capture'
              ORDER BY requested_at_utc DESC LIMIT 1
              """)
              rows=result.get('results') or []
              latest=rows[0] if rows else {}
              if latest.get('requested_at_utc','') > before_at and latest.get('status') == 'succeeded':
                  print(f'new_scheduler_heartbeat=PASS attempts={attempt} '+json.dumps(latest,sort_keys=True))
                  break
              time.sleep(30)
          else:
              raise AssertionError({'before':before,'latest':latest})
          PY

      - name: Verify D1 read budget remains below alarm
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          day=datetime.now(timezone.utc).date().isoformat()
          query='''query D1Usage($accountTag: string!, $day: Date, $databaseId: string) {
            viewer { accounts(filter: { accountTag: $accountTag }) {
              d1AnalyticsAdaptiveGroups(limit: 10, filter: {date_geq: $day, date_leq: $day, databaseId: $databaseId}) { sum { rowsRead } }
            } }
          }'''
          body=json.dumps({'query':query,'variables':{'accountTag':os.environ['CLOUDFLARE_ACCOUNT_ID'],'day':day,'databaseId':os.environ['AIDY_D1_DATABASE_ID']}}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=body,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          if result.get('errors'): raise SystemExit(result['errors'])
          groups=result['data']['viewer']['accounts'][0]['d1AnalyticsAdaptiveGroups']
          rows_read=sum(int(item.get('sum',{}).get('rowsRead') or 0) for item in groups)
          threshold=int(os.environ['D1_ROWS_READ_ALERT_THRESHOLD'])
          print(f'd1_rows_read={rows_read} threshold={threshold}')
          assert rows_read < threshold, (rows_read,threshold)
          PY

      - name: Roll back Worker code to pre-merge main if any live gate fails
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_SHA='${{ github.event.before }}'
          test -n "$PREVIOUS_SHA"
          git checkout --force "$PREVIOUS_SHA"
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          python - <<'PY'
          import json, os
          cfg=json.load(open('wrangler.test.example.jsonc',encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          cfg['triggers']['crons']=[]
          json.dump(cfg,open('wrangler.day6.rollback.jsonc','w',encoding='utf-8'),indent=2)
          PY
          cp wrangler.day6.rollback.jsonc wrangler.jsonc
          uv run pywrangler deploy
          echo "rollback_worker_sha=${PREVIOUS_SHA}"
