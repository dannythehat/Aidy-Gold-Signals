name: AIDY Day 53 Step 2 D1 Preregistration

on:
  workflow_dispatch:
  push:
    branches:
      - day53/twelve-data-ohlc-adapter
    paths:
      - "ops/day53-step2-d1-append-trigger.txt"

permissions:
  contents: read

env:
  ACCEPTED_STEP2_HEAD: 6689aa954cb5f3dd2f97f980846c9168437aabe4

jobs:
  append-preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove frozen preregistration bundle is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ACCEPTED_STEP2_HEAD" HEAD
          git diff --exit-code "$ACCEPTED_STEP2_HEAD" HEAD -- \
            src/aidy/research_trials.py \
            src/aidy/market_data_semantics.py \
            src/aidy/day53_step2_preregistration.py \
            src/aidy/day53_step2_qualification_guard.py \
            src/aidy/regime_classifier.py \
            src/aidy/analogue_retrieval_v2.py \
            src/aidy/setup_detector.py \
            migrations/d1/0008_research_evidence_ledger.sql \
            evidence/research_ledger/day53-step2-equivalence-preregistration.json \
            docs/day53-step2-existing-constant-equivalence-preregistration.md \
            docs/day53-market-data-dependency-provenance-map.md
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install bounded project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Build D1-only Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']='aidy-ops-test'
          cfg['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          cfg['r2_buckets']=[]
          cfg['queues']={}
          cfg['triggers']={'crons':[]}
          json.dump(cfg, open('/tmp/wrangler.step2.d1.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Apply research-ledger migration only through migration chain
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote \
            --config /tmp/wrangler.step2.d1.jsonc > /tmp/step2-migrations.txt 2>&1
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config /tmp/wrangler.step2.d1.jsonc \
            --command "SELECT sequence,record_digest,previous_digest,ledger_version,record_type,recorded_at_utc,code_head_sha,initiated_by,payload_json FROM research_evidence_ledger ORDER BY sequence" \
            > /tmp/ledger-before.json

      - name: Build exact idempotent append transaction
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          from aidy.day53_step2_preregistration import (
              STEP2_QUALIFICATION_ID,
              STEP2_RESEARCH_FAMILY_ID,
              build_step2_equivalence_contract_payload,
              build_step2_research_family_payload,
          )
          from aidy.day53_step2_qualification_guard import (
              assert_repository_preregistration_manifest,
              assert_step2_scoring_prerequisites,
          )
          from aidy.market_data_semantics import EQUIVALENCE_CONTRACT_RECORD_TYPE
          from aidy.research_trials import build_record, canonical_json, verify_chain

          FAMILY_TYPE='research_family_registered'
          accepted_head=os.environ['ACCEPTED_STEP2_HEAD']
          manifest=json.load(open('evidence/research_ledger/day53-step2-equivalence-preregistration.json', encoding='utf-8'))
          repository=assert_repository_preregistration_manifest(manifest)

          raw=json.load(open('/tmp/ledger-before.json', encoding='utf-8'))
          rows=[]
          for batch in raw:
              rows.extend(batch.get('results') or [])
          normalized=[]
          for row in sorted(rows, key=lambda item:int(item['sequence'])):
              item=dict(row)
              item['payload']=json.loads(item.pop('payload_json'))
              normalized.append(item)
          if not normalized or not verify_chain(normalized):
              raise SystemExit('research ledger chain invalid before Step 2 append')
          if normalized[0]['record_digest'] != 'daa8478ee4932bb5fabd83396abc29cdc38fca2e5b913fb78a0e4e2c80458406':
              raise SystemExit('research ledger genesis mismatch before Step 2 append')

          family_matches=[r for r in normalized if r['record_type']==FAMILY_TYPE and r['payload'].get('research_family_id')==STEP2_RESEARCH_FAMILY_ID]
          contract_matches=[r for r in normalized if r['record_type']==EQUIVALENCE_CONTRACT_RECORD_TYPE and r['payload'].get('qualification_id')==STEP2_QUALIFICATION_ID]

          if bool(family_matches) != bool(contract_matches):
              raise SystemExit('partial Step 2 preregistration exists in D1; refusing repair by guess')
          if len(family_matches)>1 or len(contract_matches)>1:
              raise SystemExit('duplicate Step 2 preregistration records exist in D1')

          expected_records=[]
          if family_matches:
              for record in (family_matches[0], contract_matches[0]):
                  if record['code_head_sha'] != accepted_head:
                      raise SystemExit('existing Step 2 preregistration is bound to the wrong code head')
              state=assert_step2_scoring_prerequisites(
                  manifest=manifest,
                  research_ledger_records=normalized,
              )
              Path('/tmp/append.sql').write_text('-- exact Step 2 preregistration already present; no-op\n', encoding='utf-8')
              action='verified_existing_exact_records'
          else:
              latest=normalized[-1]
              now=datetime.now(UTC)
              latest_time=datetime.fromisoformat(str(latest['recorded_at_utc']))
              if now < latest_time:
                  now=latest_time
              family=build_record(
                  sequence=int(latest['sequence'])+1,
                  previous_digest=str(latest['record_digest']),
                  record_type=FAMILY_TYPE,
                  recorded_at=now,
                  code_head_sha=accepted_head,
                  initiated_by='human',
                  payload=build_step2_research_family_payload(),
              )
              contract=build_record(
                  sequence=int(family['sequence'])+1,
                  previous_digest=str(family['record_digest']),
                  record_type=EQUIVALENCE_CONTRACT_RECORD_TYPE,
                  recorded_at=now+timedelta(seconds=1),
                  code_head_sha=accepted_head,
                  initiated_by='human',
                  payload=build_step2_equivalence_contract_payload(),
              )
              expected_records=[family,contract]

              def q(value):
                  if value is None:
                      return 'NULL'
                  return "'" + str(value).replace("'", "''") + "'"

              statements=['BEGIN TRANSACTION;']
              for record in expected_records:
                  statements.append(
                      'INSERT INTO research_evidence_ledger '
                      '(sequence,record_digest,previous_digest,ledger_version,record_type,recorded_at_utc,code_head_sha,initiated_by,payload_json) VALUES ('
                      + ','.join([
                          str(record['sequence']),
                          q(record['record_digest']),
                          q(record['previous_digest']),
                          q(record['ledger_version']),
                          q(record['record_type']),
                          q(record['recorded_at_utc']),
                          q(record['code_head_sha']),
                          q(record['initiated_by']),
                          q(canonical_json(record['payload'])),
                      ]) + ');'
                  )
              statements.append('COMMIT;')
              Path('/tmp/append.sql').write_text('\n'.join(statements)+'\n', encoding='utf-8')
              state={
                  'state':'prepared_exact_append',
                  'contract_digest':repository['contract_digest'],
                  'research_family_digest':repository['research_family_digest'],
              }
              action='append_exact_records'

          audit={
              'action':action,
              'accepted_step2_head':accepted_head,
              'repository_contract_digest':repository['contract_digest'],
              'repository_research_family_digest':repository['research_family_digest'],
              'ledger_sequence_before':int(normalized[-1]['sequence']),
              'ledger_head_digest_before':normalized[-1]['record_digest'],
              'prepared_records':expected_records,
              'pre_append_guard_state':state,
              'empirical_scoring_performed':False,
              'twelve_data_vendor_calls':0,
          }
          json.dump(audit, open('/tmp/step2-preappend-audit.json','w',encoding='utf-8'), sort_keys=True, indent=2)
          print(json.dumps(audit, sort_keys=True))
          PY

      - name: Append exact preregistration records atomically
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^INSERT INTO research_evidence_ledger' /tmp/append.sql; then
            npx --yes wrangler@4 d1 execute AIDY_OPS --remote \
              --config /tmp/wrangler.step2.d1.jsonc --file /tmp/append.sql \
              > /tmp/step2-append.txt 2>&1
          else
            echo 'No-op: exact preregistration already exists.' > /tmp/step2-append.txt
          fi

      - name: Verify D1 chain and repository-to-ledger digest equality
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config /tmp/wrangler.step2.d1.jsonc \
            --command "SELECT sequence,record_digest,previous_digest,ledger_version,record_type,recorded_at_utc,code_head_sha,initiated_by,payload_json FROM research_evidence_ledger ORDER BY sequence" \
            > /tmp/ledger-after.json
          uv run python - <<'PY'
          import json
          import os
          from aidy.day53_step2_preregistration import STEP2_QUALIFICATION_ID, STEP2_RESEARCH_FAMILY_ID
          from aidy.day53_step2_qualification_guard import assert_step2_scoring_prerequisites
          from aidy.research_trials import verify_chain

          manifest=json.load(open('evidence/research_ledger/day53-step2-equivalence-preregistration.json', encoding='utf-8'))
          raw=json.load(open('/tmp/ledger-after.json', encoding='utf-8'))
          rows=[]
          for batch in raw:
              rows.extend(batch.get('results') or [])
          normalized=[]
          for row in sorted(rows, key=lambda item:int(item['sequence'])):
              item=dict(row)
              item['payload']=json.loads(item.pop('payload_json'))
              normalized.append(item)
          assert verify_chain(normalized), 'research ledger chain invalid after Step 2 append'
          guard=assert_step2_scoring_prerequisites(
              manifest=manifest,
              research_ledger_records=normalized,
          )
          family=next(r for r in normalized if r['record_type']=='research_family_registered' and r['payload'].get('research_family_id')==STEP2_RESEARCH_FAMILY_ID)
          contract=next(r for r in normalized if r['record_type']=='market_data_equivalence_contract_registered' and r['payload'].get('qualification_id')==STEP2_QUALIFICATION_ID)
          assert family['code_head_sha']==os.environ['ACCEPTED_STEP2_HEAD']
          assert contract['code_head_sha']==os.environ['ACCEPTED_STEP2_HEAD']
          raw_trials=sum(1 for r in normalized if r['record_type']=='trial_started')
          result={
              'state':'step2_d1_preregistration_verified',
              'accepted_step2_head':os.environ['ACCEPTED_STEP2_HEAD'],
              'research_family_sequence':family['sequence'],
              'research_family_record_digest':family['record_digest'],
              'equivalence_contract_sequence':contract['sequence'],
              'equivalence_contract_record_digest':contract['record_digest'],
              'contract_digest':guard['contract_digest'],
              'research_family_digest':guard['research_family_digest'],
              'ledger_head_sequence':normalized[-1]['sequence'],
              'ledger_head_digest':normalized[-1]['record_digest'],
              'raw_attempted_trials':raw_trials,
              'empirical_scoring_performed':False,
              'twelve_data_vendor_calls':0,
          }
          json.dump(result, open('day53_step2_d1_preregistration.json','w',encoding='utf-8'), sort_keys=True, indent=2)
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Preserve D1 preregistration audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-step2-d1-preregistration-${{ github.sha }}
          path: day53_step2_d1_preregistration.json
          if-no-files-found: error
          retention-days: 90
