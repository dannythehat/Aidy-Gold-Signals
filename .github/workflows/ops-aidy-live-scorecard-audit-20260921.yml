name: AIDY Live Scorecard Audit 20260921

on:
  push:
    branches: [ops/aidy-live-scorecard-audit-20260921]
    paths:
      - ".github/workflows/ops-aidy-live-scorecard-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py
      - name: Pull latest AIDY cycle and scorecard
        shell: bash
        run: |
          set -euo pipefail
          echo "=== latest_cycle ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            SELECT v.cycle_view_id,v.window_start_utc,v.window_end_utc,v.decided_at_utc,
                   v.observed_state,v.view_direction,v.view_confidence,
                   json_array_length(v.toolbox_considered_json) AS toolbox_considered,
                   json_array_length(v.toolbox_used_json) AS toolbox_used,
                   json_array_length(json_extract(v.evidence_json,'$.tool_reasoning_trace')) AS tool_trace_count,
                   json_array_length(json_extract(e.environment_json,'$.toolbox_coverage')) AS environment_coverage,
                   json_extract(e.environment_json,'$.learning_dimensions.session') AS session,
                   json_extract(e.environment_json,'$.learning_dimensions.session_phase') AS session_phase,
                   json_extract(e.environment_json,'$.learning_dimensions.liquidity_intensity') AS liquidity_intensity,
                   json_extract(e.environment_json,'$.learning_dimensions.liquidity_signature') AS liquidity_signature,
                   json_extract(e.environment_json,'$.learning_dimensions.nearest_reference') AS nearest_reference,
                   json_extract(e.environment_json,'$.learning_dimensions.nearest_reference_distance_band') AS distance_band,
                   json_extract(e.environment_json,'$.learning_dimensions.h1_direction') AS h1_direction,
                   json_extract(e.environment_json,'$.learning_dimensions.h4_direction') AS h4_direction,
                   json_extract(e.environment_json,'$.learning_dimensions.volatility_state') AS volatility_state,
                   json_extract(e.environment_json,'$.learning_dimensions.event_proximity') AS event_proximity,
                   v.future_values_used,v.live_money_execution_allowed
            FROM aidy_gold_cycle_views v
            LEFT JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
            ORDER BY v.window_start_utc DESC LIMIT 3;
          "
          echo "=== tool_trace ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            WITH latest AS (
              SELECT cycle_view_id,evidence_json
              FROM aidy_gold_cycle_views
              ORDER BY window_start_utc DESC LIMIT 1
            )
            SELECT json_extract(j.value,'$.name') AS tool,
                   json_extract(j.value,'$.status') AS status,
                   json_extract(j.value,'$.reasoning_action') AS reasoning_action,
                   json_extract(j.value,'$.readable_state') AS readable_state,
                   json_extract(j.value,'$.scoreable_this_cycle') AS scoreable
            FROM latest, json_each(json_extract(latest.evidence_json,'$.tool_reasoning_trace')) j
            ORDER BY tool;
          "
          echo "=== directional_reasons ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            WITH latest AS (
              SELECT evidence_json
              FROM aidy_gold_cycle_views
              ORDER BY window_start_utc DESC LIMIT 1
            )
            SELECT json_extract(j.value,'$.surface') AS tool,
                   json_extract(j.value,'$.vote') AS vote,
                   json_extract(j.value,'$.base_weight') AS base_weight,
                   json_extract(j.value,'$.learned_multiplier') AS learned_multiplier,
                   json_extract(j.value,'$.effective_weight') AS effective_weight,
                   json_extract(j.value,'$.selected_score_scope') AS selected_scope,
                   json_extract(j.value,'$.selected_score_context') AS selected_context,
                   json_extract(j.value,'$.selected_score_sample_n') AS sample_n,
                   json_extract(j.value,'$.selected_score_net') AS net_score,
                   json_extract(j.value,'$.selected_score_accuracy') AS accuracy
            FROM latest, json_each(json_extract(latest.evidence_json,'$.all_directional_reasons')) j
            ORDER BY tool;
          "
          echo "=== latest_outcomes ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            SELECT v.window_start_utc,v.view_direction,o.realised_direction,o.return_bps,
                   o.exact_direction_correct,o.resolved_at_utc
            FROM aidy_gold_cycle_views v
            LEFT JOIN aidy_gold_cycle_outcomes o ON o.cycle_view_id=v.cycle_view_id
            ORDER BY v.window_start_utc DESC LIMIT 12;
          "
          echo "=== latest_json_shape ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            WITH latest AS (
              SELECT v.cycle_view_id,v.window_start_utc,v.evidence_json,e.environment_json
              FROM aidy_gold_cycle_views v
              LEFT JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
              ORDER BY v.window_start_utc DESC LIMIT 1
            )
            SELECT cycle_view_id,window_start_utc,
                   json_type(evidence_json,'$.tool_reasoning_trace') AS trace_type,
                   json_array_length(json_extract(evidence_json,'$.tool_reasoning_trace')) AS trace_count,
                   json_type(environment_json,'$.toolbox_coverage') AS coverage_type,
                   json_array_length(json_extract(environment_json,'$.toolbox_coverage')) AS coverage_count,
                   json_type(environment_json,'$.learning_dimensions') AS dims_type,
                   json_extract(evidence_json,'$.environment_fingerprint.learning_dimensions.session') AS evidence_session,
                   json_extract(environment_json,'$.learning_dimensions.session') AS environment_session
            FROM latest;
          "
          echo "=== latest_evidence_keys ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            WITH latest AS (
              SELECT evidence_json FROM aidy_gold_cycle_views ORDER BY window_start_utc DESC LIMIT 1
            )
            SELECT key,json_type(value) AS value_type
            FROM latest,json_each(latest.evidence_json)
            ORDER BY key;
          "
          echo "=== global_scorebook ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.research.live.jsonc --command "
            SELECT surface,sample_n,correct_n,incorrect_n,neutral_n,net_score,score_mean,accuracy,last_resolved_at_utc
            FROM aidy_gold_marker_context_scores
            WHERE scope_type='global'
            ORDER BY sample_n DESC,net_score DESC,surface;
          "
