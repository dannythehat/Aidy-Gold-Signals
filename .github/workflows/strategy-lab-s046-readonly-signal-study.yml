name: AIDY Real Gold Edge S046 Signal-Only Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_s046_signal_proxy.py
      - tests/test_strategy_lab_s046_signal_proxy.py
      - scripts/strategy_lab/s046_signal_research_run.py
      - .github/workflows/strategy-lab-s046-readonly-signal-study.yml
      - docs/research-s046-signal-only-first-aidy-run.md

permissions:
  contents: read

jobs:
  single-s046-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated historical-source and strict regression tools
        run: python -m pip install --quiet 'google-cloud-bigquery>=3.42,<4' pytest ruff
      - name: Check code style and reproduce synthetic detector edges (not return claims)
        run: |
          python -m compileall -q src/aidy/strategy_lab_s046_signal_proxy.py scripts/strategy_lab/s046_signal_research_run.py tests/test_strategy_lab_s046_signal_proxy.py
          ruff check src/aidy/strategy_lab_s046_signal_proxy.py scripts/strategy_lab/s046_signal_research_run.py tests/test_strategy_lab_s046_signal_proxy.py
          PYTHONPATH=src:. python -m pytest -q tests/test_strategy_lab_s046_signal_proxy.py tests/test_strategy_lab_history_reader.py
      - name: Execute ONLY original S046 independent signal proxy on actual source XAUUSD BID M1
        id: historical
        continue-on-error: true
        run: PYTHONPATH=src:. python scripts/strategy_lab/s046_signal_research_run.py
      - name: Validate auditable result with explicit missing exits and no source parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/strategy_lab/s046_signal_research/experiment_result.json').read_text())
          assert p["strategy_id"] == "S046"
          assert p["wins"] is p["losses"] is p["win_rate"] is p["trading_system_pnl_usd"] is None
          assert p["mql5_indicator_code_audited"] is p["mql5_buffer_parity_proven"] is False
          assert p["broker_orders_placed"] == p["paper_trades_created"] == 0
          assert p["original_83_strategies_verified_profitable"] == 0
          assert p["owner_go_no_go"] == "NO_GO"
          if p["status"] == "PASS_REAL_HISTORICAL_SIGNAL_PROXY_ONLY":
              assert len(p["real_source_receipts"])==2
              assert all(x["first_real_query_job"]!=x["second_real_query_job"]
                         for x in p["real_source_receipts"])
              assert p["real_closed_m5_bars_observed"] == 504
              assert sum(p["by_side"].values())==p["observed_signals"]
              print(f"REAL HISTORICAL S046 SIGNAL-PROXY PASS: {p['observed_signals']} closed-bar events")
          else:
              print(f"HONEST S046 SIGNAL RESEARCH BLOCKED: {p.get('error_type')}: {p.get('error')}")
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s046-one-random-real-historical-signal-audit
          path: artifacts/strategy_lab/s046_signal_research/
          retention-days: 90
          if-no-files-found: error
