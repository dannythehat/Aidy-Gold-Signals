name: AIDY Day 21 OpenAI Gateway Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/aidy/openai_gateway.py"
      - "tests/test_openai_gateway.py"
      - "scripts/day21_gateway_examples.py"
      - "scripts/day21_openai_live_probe.py"
      - "docs/openai-reasoning-gateway-v1-contract.md"
      - ".github/workflows/day21-openai-gateway-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aidy-day21-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Ruff Day 21 gateway
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            src/aidy/openai_gateway.py \
            tests/test_openai_gateway.py \
            scripts/day21_gateway_examples.py \
            scripts/day21_openai_live_probe.py

      - name: Compile project
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m compileall -q src scripts tests

      - name: Run Day 21 focused gateway tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_openai_gateway.py

      - name: Run full project regression suite
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q

      - name: Prove deterministic gateway example
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/day21_gateway_examples.py > /tmp/day21-gateway.json
          cat /tmp/day21-gateway.json
          python - <<'PY'
          import json

          with open("/tmp/day21-gateway.json", encoding="utf-8") as handle:
              value = json.load(handle)

          assert value["ok"] is True, value
          manifest = value["manifest"]
          result = value["result"]
          assert manifest["gateway_version"] == "aidy_openai_reasoning_gateway_v1", value
          assert manifest["model_id"] == "gpt-5.6-sol", value
          assert manifest["structured_outputs"] is True, value
          assert manifest["store_provider_response"] is False, value
          assert manifest["server_side_semantic_validation_required"] is True, value
          assert manifest["broker_or_telegram_access"] is False, value
          assert result["status"] == "accepted", value
          assert result["publication_allowed"] is True, value
          assert result["structured_decision"]["action"] == "no_trade", value
          assert result["estimated_cost_usd"] == "0.007100", value
          PY

      - name: Prove CI contains no live API secret path
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'OPENAI_API_KEY:|sk-proj-|sk-[A-Za-z0-9_-]{16,}' \
            .github/workflows/day21-openai-gateway-acceptance.yml; then
            echo "Day 21 acceptance workflow must not contain an OpenAI secret."
            exit 1
          fi
