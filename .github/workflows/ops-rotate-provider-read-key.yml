name: Ops Rotate Provider Read Key

on:
  push:
    branches: [feature/provider-market-ohlc]
    paths:
      - ".github/ops/rotate_provider_read_key.py"
      - ".github/workflows/ops-rotate-provider-read-key.yml"

permissions:
  contents: write

jobs:
  rotate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-market-ohlc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply public-key rotation
        run: python .github/ops/rotate_provider_read_key.py
      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
      - name: Static checks
        run: |
          uv run ruff check src/aidy/provider_market_api.py tests/test_provider_market_api.py
          uv run python -m compileall -q src tests
      - name: Provider endpoint and Twelve focused tests
        run: |
          uv run pytest -q \
            tests/test_provider_market_api.py \
            tests/test_day53_twelve_data_ohlc_adapter.py \
            tests/test_day53_d1_read_budget.py \
            tests/test_day53_twelve_data_current_bucket_binding.py
      - name: Full regression
        run: uv run pytest -q
      - name: Commit verified public-key rotation
        run: |
          set -euo pipefail
          rm -f .github/ops/rotate_provider_read_key.py .github/workflows/ops-rotate-provider-read-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rotate Provider Lab read verification key"
          git push origin HEAD:feature/provider-market-ohlc
