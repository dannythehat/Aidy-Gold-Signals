name: AIDY Day 3 Safe Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aidy-day3-safe-deploy
  cancel-in-progress: false

jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev

    steps:
      - name: Checkout Day 3 branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-3-continuity-auditor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Verify Cloudflare credentials exist
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Run broker-free code gate
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/config.py src/aidy/gold_api_gateway.py src/aidy/reference_price_recorder.py src/aidy/reference_continuity.py src/aidy/runtime.py src/entry.py tests/test_config.py tests/test_gold_api_gateway.py tests/test_reference_price_recorder.py tests/test_runtime_schedule.py tests/test_day2_deployment_contract.py
          uv run python -m compileall -q src tests
          uv run pytest -q

      - name: Build safe-off Worker config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']='aidy-ops-test'
          cfg['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          cfg['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          cfg['vars']['AIDY_CAPTURE_ENABLED']='false'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='gold_api'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          json.dump(cfg, open('wrangler.day3.safe.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Apply D1 migrations and deploy safe-off
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.day3.safe.jsonc
          cp wrangler.day3.safe.jsonc wrangler.jsonc
          uv run pywrangler deploy
          npx --yes wrangler@4 deploy --config wrangler.scheduler.test.jsonc

      - name: Verify safe-off state
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsS "${AIDY_TEST_WORKER_URL}/health" > /tmp/day3-health.json || true
            if python - <<'PY'
          import json
          try: h=json.load(open('/tmp/day3-health.json', encoding='utf-8'))
          except Exception: raise SystemExit(1)
          ok=(h.get('capture_enabled') is False and h.get('market_data_source') == 'gold_api' and h.get('market_data_ownership') == 'public_independent')
          raise SystemExit(0 if ok else 1)
          PY
            then break; fi
            sleep 3
          done
          python - <<'PY'
          import json
          h=json.load(open('/tmp/day3-health.json', encoding='utf-8'))
          assert h.get('capture_enabled') is False, h
          assert h.get('market_data_source') == 'gold_api', h
          assert h.get('market_data_ownership') == 'public_independent', h
          PY
