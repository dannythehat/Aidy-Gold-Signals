name: AIDY Day 3 Safe Deploy

on:
  push:
    branches:
      - feature/day-3-continuity-auditor
    paths:
      - ".github/workflows/day3-safe-deploy.yml"
      - "ops/day3-safe-deploy-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aidy-day3-safe-deploy
  cancel-in-progress: false

jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev

    steps:
      - name: Checkout Day 3 branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-3-continuity-auditor

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          echo PASS > /tmp/dependencies

      - name: Verify Cloudflare credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo PASS > /tmp/cloudflare-credentials

      - name: Run Day 3 code gate
        shell: bash
        run: |
          set +e
          uv run ruff check \
            src/aidy/config.py \
            src/aidy/continuity_auditor.py \
            src/entry.py \
            tests/test_config.py \
            tests/test_continuity_auditor.py \
            tests/test_d1_storage_local.py \
            tests/test_day2_deployment_contract.py \
            > /tmp/ruff.txt 2>&1
          ruff_status=$?
          uv run python -m compileall -q src tests > /tmp/compile.txt 2>&1
          compile_status=$?
          uv run pytest -q > /tmp/pytest.txt 2>&1
          pytest_status=$?
          echo "ruff=${ruff_status} compile=${compile_status} pytest=${pytest_status}" > /tmp/code-gate-status
          if [ "$ruff_status" -eq 0 ] && [ "$compile_status" -eq 0 ] && [ "$pytest_status" -eq 0 ]; then
            echo PASS > /tmp/code-gate
            exit 0
          fi
          echo FAIL > /tmp/code-gate
          cat /tmp/ruff.txt
          cat /tmp/compile.txt
          cat /tmp/pytest.txt
          exit 1

      - name: Build safe-off Day 3 Worker config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']='aidy-ops-test'
          cfg['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          cfg['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          cfg['vars']['AIDY_CAPTURE_ENABLED']='false'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='metaapi'
          cfg['vars'].pop('AIDY_MARKET_DATA_OWNERSHIP', None)
          with open('wrangler.day3.safe.jsonc','w',encoding='utf-8') as fh:
              json.dump(cfg, fh, indent=2)
              fh.write('\n')
          PY
          echo PASS > /tmp/config

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.day3.safe.jsonc | tee /tmp/migrations.txt
          echo PASS > /tmp/migrations

      - name: Deploy exact Day 3 Worker safe-off
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.day3.safe.jsonc wrangler.jsonc
          uv run pywrangler deploy 2>&1 | tee /tmp/worker-deploy.txt
          echo PASS > /tmp/worker-deploy

      - name: Deploy scheduler safe-off
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.scheduler.test.jsonc 2>&1 | tee /tmp/scheduler-deploy.txt
          echo PASS > /tmp/scheduler-deploy

      - name: Verify health and fail-closed Day 3 endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${AIDY_TEST_WORKER_URL}/health" | tee /tmp/day3-health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/day3-health.json', encoding='utf-8'))
          assert h.get('status') == 'ok', h
          assert h.get('environment') == 'test', h
          assert h.get('capture_enabled') is False, h
          PY

          status=404
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/day3-continuity.json -w '%{http_code}' "${AIDY_TEST_WORKER_URL}/day3/continuity?minutes=5&archive_limit=40")"
            echo "$status" > /tmp/day3-continuity-status
            if [ "$status" != "404" ]; then
              break
            fi
            sleep 3
          done
          cat /tmp/day3-continuity.json
          test "$status" = "503" || { echo "::error::Expected safe-off Day 3 gate to fail closed with HTTP 503 after propagation, got $status"; exit 1; }
          python - <<'PY'
          import json
          p=json.load(open('/tmp/day3-continuity.json', encoding='utf-8'))
          assert p.get('ok') is False, p
          report=p.get('report') or {}
          reasons=report.get('failure_reasons') or []
          assert any('capture' in str(x).lower() for x in reasons), reasons
          PY
          echo PASS > /tmp/fail-closed

      - name: Persist Day 3 safe-deploy evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ops
          {
            echo "# Day 3 safe-deploy evidence"
            echo
            echo "- Trigger commit: ${GITHUB_SHA}"
            echo "- Observed at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Dependencies: $(cat /tmp/dependencies 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Cloudflare credentials present: $(cat /tmp/cloudflare-credentials 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Ruff/compile/tests: $(cat /tmp/code-gate 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Code gate status: $(cat /tmp/code-gate-status 2>/dev/null || echo unknown)"
            echo "- Safe-off config built: $(cat /tmp/config 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- D1 migrations: $(cat /tmp/migrations 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Worker safe-off deploy: $(cat /tmp/worker-deploy 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Scheduler safe-off deploy: $(cat /tmp/scheduler-deploy 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            echo "- Health + continuity fail-closed proof: $(cat /tmp/fail-closed 2>/dev/null || echo NOT_REACHED_OR_FAILED)"
            for name in ruff compile pytest worker-deploy scheduler-deploy; do
              file="/tmp/${name}.txt"
              if [ -f "$file" ]; then
                echo
                echo "## ${name} output"
                echo '```text'
                tail -60 "$file"
                echo '```'
              fi
            done
            if [ -f /tmp/day3-health.json ]; then
              echo
              echo "## Health"
              echo '```json'
              cat /tmp/day3-health.json
              echo
              echo '```'
            fi
            if [ -f /tmp/day3-continuity.json ]; then
              echo
              echo "## Safe-off continuity response"
              echo "HTTP $(cat /tmp/day3-continuity-status 2>/dev/null || echo unknown)"
              echo '```json'
              cat /tmp/day3-continuity.json
              echo
              echo '```'
            fi
            echo
            echo "## Remaining live gate"
            echo "Enable capture only with an independently owned AIDY market-data source, restore the one-minute Cloudflare scheduler, then require a clean 5+ minute /day3/continuity window with D1/R2 reconciliation."
          } > ops/day3-safe-deploy-evidence.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/day3-safe-deploy-evidence.md
          if ! git diff --cached --quiet; then
            git commit -m "Day 3: record safe-deploy evidence"
            git push origin HEAD:feature/day-3-continuity-auditor
          fi
