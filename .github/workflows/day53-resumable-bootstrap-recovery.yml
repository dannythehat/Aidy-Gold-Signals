name: AIDY Day 53 Resumable Bootstrap Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/twelve_data_bootstrap.py"
      - "src/entry.py"
      - "src/day2_scheduler.js"
      - "tests/test_day53_bootstrap_admission_recovery.py"
      - ".github/workflows/day53-resumable-bootstrap-recovery.yml"
  push:
    branches: [main]
    paths:
      - "src/aidy/twelve_data_bootstrap.py"
      - "src/entry.py"
      - "src/day2_scheduler.js"
      - "tests/test_day53_bootstrap_admission_recovery.py"
      - ".github/workflows/day53-resumable-bootstrap-recovery.yml"
  workflow_dispatch:

concurrency:
  group: aidy-day53-live-forward-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test

jobs:
  acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require protected-main ancestry
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Resumable-bootstrap and queue-budget boundary checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/twelve_data_bootstrap.py src/entry.py tests/test_day53_bootstrap_admission_recovery.py
          uv run python -m compileall -q src scripts tests
          grep -F "MAX_BOOTSTRAP_WINDOW_MINUTES = 30" src/aidy/twelve_data_bootstrap.py
          grep -F '"continue_bootstrap"' src/entry.py
          grep -F '"remaining_m1_minutes"' src/entry.py
          grep -F "planned_windows=1" src/entry.py
          grep -F '"decision_snapshot_created": False' src/entry.py
          grep -F '"decision_ready": False' src/entry.py
          ! grep -Ein 'metaapi|mt5|vantage|super_signals' src/aidy/twelve_data_bootstrap.py
          grep -F "shouldEnqueueCaptureTick" src/day2_scheduler.js
          grep -F "FED_RSS_INTERVAL_SECONDS = 120" src/day2_scheduler.js
          grep -F "MARKET_INTERVAL_SECONDS = 300" src/day2_scheduler.js
          grep -F "twelve_data_time_series_rate_limited" .github/workflows/day53-resumable-bootstrap-recovery.yml
          grep -F "sleep 65" .github/workflows/day53-resumable-bootstrap-recovery.yml

      - name: Prove queue producer only emits useful recorder ticks
        shell: bash
        run: |
          set -euo pipefail
          cp src/day2_scheduler.js /tmp/day2_scheduler.mjs
          node --input-type=module - <<'JS'
          import { shouldEnqueueCaptureTick } from 'file:///tmp/day2_scheduler.mjs';
          const base=Date.UTC(2026,8,9,0,0,0);
          const expected={0:true,1:false,2:true,3:false,4:true,5:true,6:true,7:false,8:true,9:false,10:true};
          for (const [minute,due] of Object.entries(expected)) {
            const actual=shouldEnqueueCaptureTick(base+Number(minute)*60_000);
            if (actual!==due) throw new Error(`minute ${minute}: ${actual} != ${due}`);
          }
          let emitted=0;
          for (let minute=0; minute<1440; minute++) {
            if (shouldEnqueueCaptureTick(base+minute*60_000)) emitted++;
          }
          if (emitted!==864) throw new Error(`daily queue messages ${emitted} != 864`);
          console.log(`daily_queue_messages=${emitted}`);
          console.log(`healthy_queue_ops_estimate=${emitted*3}`);
          JS

      - name: Focused recovery tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_day53_bootstrap_admission_recovery.py tests/test_day53_twelve_data_launch_cleanup.py tests/test_day53_live_forward_observer.py tests/test_day52_end_to_end.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

  recover-and-dispatch-proof:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_TWELVE_DATA_API_KEY: ${{ secrets.AIDY_TWELVE_DATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact protected-main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require exact main and recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${AIDY_TWELVE_DATA_API_KEY:-}"
          test -n "${GH_TOKEN:-}"

      - name: Build isolated-bootstrap and safe-restored configs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python - <<'PY'
          import json, os
          from types import SimpleNamespace
          from aidy.config import AidySettings
          base=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          base['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          base['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          base['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          base['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          base['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          base['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          bootstrap=json.loads(json.dumps(base))
          bootstrap['vars']['AIDY_CAPTURE_ENABLED']='false'
          bootstrap['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          bootstrap['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='true'
          restored=json.loads(json.dumps(base))
          restored['vars']['AIDY_CAPTURE_ENABLED']='true'
          restored['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          restored['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          for cfg in (bootstrap, restored):
              text=json.dumps(cfg).lower()
              for forbidden in ('metaapi','vantage','mt5','super_signals'):
                  assert forbidden not in text
              settings=AidySettings.from_worker_env(SimpleNamespace(**cfg['vars']))
              assert settings.market_data_source=='twelve_data'
              assert settings.market_data_ownership=='public_independent'
              assert settings.market_poll_seconds>=300.0
          assert bootstrap['vars']['AIDY_CAPTURE_ENABLED']=='false'
          assert bootstrap['vars']['AIDY_FORMAL_FORWARD_ENABLED']=='false'
          assert restored['vars']['AIDY_CAPTURE_ENABLED']=='true'
          assert restored['vars']['AIDY_FORMAL_FORWARD_ENABLED']=='false'
          json.dump(bootstrap, open('wrangler.day53.resumable.bootstrap.jsonc','w',encoding='utf-8'), indent=2)
          json.dump(restored, open('wrangler.day53.resumable.restored.jsonc','w',encoding='utf-8'), indent=2)
          sched=json.load(open('wrangler.scheduler.test.jsonc', encoding='utf-8'))
          sched['triggers']['crons']=['* * * * *']
          json.dump(sched, open('wrangler.day53.resumable.scheduler.jsonc','w',encoding='utf-8'), indent=2)
          PY

      - name: Prove queue-budget gate before any live deploy
        shell: bash
        run: |
          set -euo pipefail
          cp src/day2_scheduler.js /tmp/day2_scheduler.mjs
          node --input-type=module - <<'JS'
          import { shouldEnqueueCaptureTick } from 'file:///tmp/day2_scheduler.mjs';
          const base=Date.UTC(2026,8,9,0,0,0);
          let emitted=0;
          for (let minute=0; minute<1440; minute++) {
            if (shouldEnqueueCaptureTick(base+minute*60_000)) emitted++;
          }
          if (emitted!==864) throw new Error(`unexpected daily queue message budget ${emitted}`);
          if (emitted*3>3000) throw new Error(`healthy Queue operations too high: ${emitted*3}`);
          console.log(`daily_queue_messages=${emitted} healthy_queue_ops_estimate=${emitted*3}`);
          JS

      - name: Apply all D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.day53.resumable.restored.jsonc | tee /tmp/resumable-migrations.txt

      - name: Install Twelve secret and run rate-limit-safe resumable bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AIDY_TWELVE_DATA_API_KEY" | npx --yes wrangler@4 secret put AIDY_TWELVE_DATA_API_KEY --config wrangler.day53.resumable.bootstrap.jsonc >/tmp/twelve-secret.txt
          ! grep -Fq "$AIDY_TWELVE_DATA_API_KEY" /tmp/twelve-secret.txt
          ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$ADMIN_TOKEN"
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put AIDY_DAY53_ADMIN_TOKEN --config wrangler.day53.resumable.bootstrap.jsonc >/tmp/admin-secret.txt
          ! grep -Fq "$ADMIN_TOKEN" /tmp/admin-secret.txt
          cp wrangler.day53.resumable.bootstrap.jsonc wrangler.jsonc
          deployed=0
          for attempt in 1 2 3 4 5; do
            if uv run pywrangler deploy 2>&1 | tee "/tmp/bootstrap-worker-deploy-${attempt}.txt"; then
              deployed=1
              break
            fi
            sleep $((attempt*5))
          done
          test "$deployed" -eq 1

          worker_ready=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$AIDY_TEST_WORKER_URL/health?bootstrap_ready=${GITHUB_SHA}-${attempt}" > /tmp/bootstrap-health.json || true
            if python - <<'PY'
          import json
          h=json.load(open('/tmp/bootstrap-health.json', encoding='utf-8'))
          assert h.get('capture_enabled') is False, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source')=='twelve_data', h
          PY
            then worker_ready=1; break; fi
            sleep 3
          done
          test "$worker_ready" -eq 1 || { echo 'Bootstrap Worker never became active'; exit 1; }

          complete=0
          for chunk in $(seq 1 80); do
            result="/tmp/bootstrap-chunk-${chunk}.json"
            request_ok=0
            for request_attempt in $(seq 1 8); do
              curl_rc=0
              status="$(curl --silent --show-error --max-time 120 -o "$result" -w '%{http_code}' -X POST -H "X-AIDY-Admin-Token: ${ADMIN_TOKEN}" "$AIDY_TEST_WORKER_URL/day53/twelve-data-bootstrap")" || curl_rc=$?
              if test "$curl_rc" -ne 0; then
                echo "bootstrap_transient_retry chunk=${chunk} attempt=${request_attempt} curl_rc=${curl_rc}"
                sleep $((request_attempt*5))
                continue
              fi
              if test "$status" = "200"; then
                request_ok=1
                break
              fi
              if grep -Fq 'twelve_data_time_series_rate_limited' "$result" 2>/dev/null; then
                echo "bootstrap_rate_limit_retry chunk=${chunk} attempt=${request_attempt} sleep_seconds=65"
                sleep 65
                continue
              fi
              if echo "$status" | grep -Eq '^(502|503|504)$' || grep -Fq 'error code: 1102' "$result" 2>/dev/null; then
                echo "bootstrap_transient_retry chunk=${chunk} attempt=${request_attempt} http_status=${status}"
                sleep $((request_attempt*5))
                continue
              fi
              if test "$chunk" -eq 1 && test "$status" = "409" && grep -Fq 'twelve_data_bootstrap_disabled' "$result" 2>/dev/null; then
                echo "bootstrap_transient_retry chunk=1 attempt=${request_attempt} reason=deployment_propagation"
                sleep 5
                continue
              fi
              echo "bootstrap_hard_failure chunk=${chunk} attempt=${request_attempt} http_status=${status}"
              cat "$result" || true
              exit 1
            done
            test "$request_ok" -eq 1 || { echo "bootstrap_retries_exhausted chunk=${chunk}"; exit 1; }

            next="$(python - "$result" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding='utf-8'))
          assert payload.get('ok') is True, payload
          assert payload.get('state') in {'in_progress','complete'}, payload
          assert payload.get('decision_snapshot_created') is False, payload
          assert payload.get('decision_ready') is False, payload
          assert int(payload.get('required_m1_minutes') or 0)>=1380, payload
          if payload['state']=='complete':
              assert payload.get('next_step')=='wait_for_fresh_scheduled_capture', payload
              assert int(payload.get('remaining_m1_minutes') or 0)==0, payload
              print('complete')
          else:
              assert payload.get('next_step')=='continue_bootstrap', payload
              assert int(payload.get('remaining_m1_minutes') or 0)>0, payload
              rows=payload.get('window_results') or []
              assert len(rows)==1 and rows[0].get('state')=='succeeded', payload
              print('continue')
          PY
            )"
            cp "$result" /tmp/bootstrap-result.json
            echo "bootstrap_chunk=${chunk} state=${next}"
            if test "$next" = "complete"; then
              complete=1
              break
            fi
            # Deliberately keep recovery below the provider's burst ceiling.
            sleep 22
          done
          test "$complete" -eq 1
          echo 'bootstrap_complete=true'

      - name: Remove ephemeral admin secret and restore capture-only runtime
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          admin_deleted=0
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /tmp/admin-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aidy-signals-test/secrets/AIDY_DAY53_ADMIN_TOKEN" || true)"
            if test "$status" = "200" || test "$status" = "404"; then admin_deleted=1; break; fi
            sleep $((attempt*5))
          done
          cp wrangler.day53.resumable.restored.jsonc wrangler.jsonc
          worker_restored=0
          for attempt in 1 2 3 4 5; do
            if uv run pywrangler deploy 2>&1 | tee "/tmp/restored-worker-deploy-${attempt}.txt"; then worker_restored=1; break; fi
            sleep $((attempt*5))
          done
          scheduler_restored=0
          for attempt in 1 2 3 4 5; do
            if npx --yes wrangler@4 deploy --config wrangler.day53.resumable.scheduler.jsonc 2>&1 | tee "/tmp/restored-scheduler-deploy-${attempt}.txt"; then scheduler_restored=1; break; fi
            sleep $((attempt*5))
          done
          runtime_safe=0
          for attempt in $(seq 1 20); do
            curl -fsS -H 'Cache-Control: no-cache' "$AIDY_TEST_WORKER_URL/health?resumable_restore=${GITHUB_SHA}-${attempt}" > /tmp/restored-health.json || true
            if python -c "import json; h=json.load(open('/tmp/restored-health.json')); assert h.get('capture_enabled') is True; assert h.get('formal_forward_enabled') is False; assert h.get('market_data_source')=='twelve_data'"; then runtime_safe=1; break; fi
            sleep 3
          done
          secret_absent=0
          for attempt in 1 2 3 4 5; do
            if curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aidy-signals-test/secrets" > /tmp/worker-secrets-after.json; then
              if python -c "import json; p=json.load(open('/tmp/worker-secrets-after.json')); names={str(x.get('name')) for x in (p.get('result') or [])}; assert 'AIDY_DAY53_ADMIN_TOKEN' not in names"; then secret_absent=1; break; fi
            fi
            sleep $((attempt*5))
          done
          test "$admin_deleted" -eq 1
          test "$worker_restored" -eq 1
          test "$scheduler_restored" -eq 1
          test "$runtime_safe" -eq 1
          test "$secret_absent" -eq 1
          echo 'ephemeral_admin_secret_absent=true'
          echo 'capture_only_runtime_restored=true'

      - name: Require fresh complete scheduled Twelve snapshot
        if: steps.bootstrap.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RESTORED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "RESTORED_AT=$RESTORED_AT" >> "$GITHUB_ENV"
          found=0
          for attempt in $(seq 1 12); do
            npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.day53.resumable.restored.jsonc --command "SELECT id,captured_at,capture_status,data_availability_json,latest_m1_id,latest_m5_id,latest_m15_id,latest_h1_id,latest_h4_id,latest_d1_id FROM market_snapshots WHERE captured_at>='${RESTORED_AT}' AND capture_status='complete' ORDER BY captured_at DESC LIMIT 1" > /tmp/complete-snapshot.json
            if python - <<'PY'
          import json
          rows=[]
          for batch in json.load(open('/tmp/complete-snapshot.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          if len(rows)!=1: raise SystemExit(1)
          row=rows[0]
          availability=json.loads(row['data_availability_json'])
          assert availability.get('market_data_source')=='twelve_data', availability
          assert availability.get('request_kind')=='scheduled_capture', availability
          assert availability.get('request_ledger_status')=='succeeded', availability
          assert availability.get('all_timeframes_ready') is True, availability
          for key in ('latest_m1_id','latest_m5_id','latest_m15_id','latest_h1_id','latest_h4_id','latest_d1_id'):
              assert row.get(key), (key,row)
          print('fresh_complete_snapshot='+str(row['id']))
          PY
            then found=1; break; fi
            sleep 60
          done
          test "$found" -eq 1 || { echo 'No fresh complete scheduled Twelve snapshot appeared after bootstrap'; exit 1; }

      - name: Dispatch exact protected-main production proof
        if: steps.bootstrap.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/day53-live-forward-activation.yml/dispatches" -d '{"ref":"main"}'
          echo "production_proof_dispatched_for=${GITHUB_SHA}"

      - name: Preserve resumable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-resumable-bootstrap-recovery-${{ github.sha }}
          path: |
            /tmp/resumable-migrations.txt
            /tmp/bootstrap-health.json
            /tmp/bootstrap-worker-deploy-*.txt
            /tmp/bootstrap-chunk-*.json
            /tmp/bootstrap-result.json
            /tmp/admin-delete.json
            /tmp/worker-secrets-after.json
            /tmp/restored-worker-deploy-*.txt
            /tmp/restored-scheduler-deploy-*.txt
            /tmp/restored-health.json
            /tmp/complete-snapshot.json
          if-no-files-found: warn
          retention-days: 90
