name: Strategy Lab B02 Day10 Strategy Registry Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_registry.py
      - tests/test_strategy_lab_registry.py
      - docs/strategy-lab-b02-day10-strategy-registry-v1.md
      - .github/workflows/strategy-lab-b02-day10.yml
      - src/aidy/strategy_lab_rule_validator.py

permissions:
  contents: read

jobs:
  verify-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --quiet pytest ruff
      - name: Compile and strict Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_registry.py tests/test_strategy_lab_registry.py
          ruff check src/aidy/strategy_lab_registry.py tests/test_strategy_lab_registry.py
      - name: Test all three connected B02 layers with actual SQLite files
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_spec.py tests/test_strategy_lab_rule_validator.py tests/test_strategy_lab_registry.py
      - name: Verify canonical source digest and disk-backed replay
        run: |
          sha256sum research/strategy_lab/fixtures/day09_internal_source_rules.txt
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          import sqlite3
          import tempfile
          from pathlib import Path
          from aidy.strategy_lab_spec import StrategySpec
          from aidy.strategy_lab_registry import StrategyRegistry

          root = Path("research/strategy_lab/fixtures")
          source = (root / "day09_internal_source_rules.txt").read_bytes()
          obj = json.loads((root / "strategy_spec_v1_sample.json").read_text())
          obj["origin"]["source_sha256"] = hashlib.sha256(source).hexdigest()
          obj["origin"]["source_snapshot_ref"] = str(root / "day09_internal_source_rules.txt")
          with tempfile.TemporaryDirectory() as temp:
              book = StrategyRegistry(Path(temp) / "actual_research_registry.sqlite3")
              book.initialize()
              a = book.register(StrategySpec.from_wire(obj), source)
              b = StrategyRegistry(book.db_path).verify_all()
              assert len(b) == 1 and b[0] == a
              assert StrategyRegistry(book.db_path).source_bytes(a.strategy_id, a.revision) == source
              with sqlite3.connect(book.db_path) as conn:
                  assert conn.execute("SELECT COUNT(*) FROM versions").fetchone()[0] == 1
              print(json.dumps({
                  "status": "PASS",
                  "record_id": a.version_id,
                  "spec_sha256": a.spec_sha256,
                  "rules_sha256": a.rules_sha256,
                  "source_sha256": a.original_source_sha256,
                  "source_is_external_third_party": False,
                  "actual_sqlite_file_persisted": True,
                  "broker_orders_executed": False,
              }, sort_keys=True))
          PY
