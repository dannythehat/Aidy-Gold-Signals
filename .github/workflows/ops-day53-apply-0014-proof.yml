name: Ops Day 53 Apply 0014 Proof

on:
  push:
    branches: [ops/day53-apply-0014-proof]
    paths:
      - ".github/workflows/ops-day53-apply-0014-proof.yml"

permissions:
  contents: read

jobs:
  apply-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAIN_SHA: b4ed0674f8fe0d9ff9a7c4adbbd6b8ea6aa80bfb
      AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4ed0674f8fe0d9ff9a7c4adbbd6b8ea6aa80bfb
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build read-only/live D1 config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          python - <<'PY'
          import json, os
          cfg=json.load(open('wrangler.test.example.jsonc',encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          json.dump(cfg,open('wrangler.ops0014.jsonc','w',encoding='utf-8'),indent=2)
          PY

      - name: Apply migration 0014 remotely
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote --config wrangler.ops0014.jsonc | tee /tmp/migrations-0014.txt
          grep -F '0014_twelve_admission_plan.sql' /tmp/migrations-0014.txt
          grep -F '✅' /tmp/migrations-0014.txt

      - name: Prove final live M1 admission plan
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config wrangler.ops0014.jsonc --command "EXPLAIN QUERY PLAN SELECT * FROM twelve_data_decision_admitted_m1_v1 WHERE open_time_utc>='2026-09-03T00:00:00+00:00' AND open_time_utc<'2026-09-05T23:59:59+00:00' AND first_observed_at<='2026-09-05T23:59:59+00:00' ORDER BY open_time_utc,revision_index LIMIT 3501" | tee /tmp/final-m1-plan.txt
          grep -F 'SEARCH c USING' /tmp/final-m1-plan.txt
          grep -F 'idx_twelve_data_request_ledger_completion_success' /tmp/final-m1-plan.txt
          grep -F 'idx_twelve_data_bootstrap_requests_by_ledger_window' /tmp/final-m1-plan.txt
          ! grep -F 'SCAN market_candles' /tmp/final-m1-plan.txt
          ! grep -F 'SCAN twelve_data_request_ledger' /tmp/final-m1-plan.txt
          ! grep -F 'SCAN twelve_data_bootstrap_requests' /tmp/final-m1-plan.txt

      - name: Prove final live quota plan
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --config wrangler.ops0014.jsonc --command "EXPLAIN QUERY PLAN SELECT (SELECT COALESCE(SUM(internal_accounted_credits),0) FROM twelve_data_request_ledger WHERE requested_at_utc>='2026-09-05T00:00:00+00:00' AND requested_at_utc<='2026-09-05T23:59:59+00:00') AS utc_day, (SELECT COALESCE(SUM(internal_accounted_credits),0) FROM twelve_data_request_ledger WHERE requested_at_utc>='2026-09-04T06:00:00+00:00' AND requested_at_utc<='2026-09-05T23:59:59+00:00') AS rolling_24h" | tee /tmp/final-quota-plan.txt
          test "$(grep -c 'idx_twelve_data_request_ledger_requested_at_credits' /tmp/final-quota-plan.txt)" -ge 2
          ! grep -F 'SCAN twelve_data_request_ledger' /tmp/final-quota-plan.txt

      - name: Verify capture health and running D1 usage
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$AIDY_TEST_WORKER_URL/health?0014=${MAIN_SHA}" | tee /tmp/health-0014.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health-0014.json',encoding='utf-8'))
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source') == 'twelve_data', h
          PY
          python - <<'PY' | tee /tmp/running-rows-read-0014.txt
          import json, os, urllib.request
          from datetime import datetime, timezone
          day=datetime.now(timezone.utc).date().isoformat()
          query='''query D1Usage($accountTag: string!, $day: Date, $databaseId: string) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 10, filter: { date_geq: $day, date_leq: $day, databaseId: $databaseId }) { sum { rowsRead rowsWritten readQueries writeQueries } dimensions { date databaseId } } } } }'''
          body=json.dumps({'query':query,'variables':{'accountTag':os.environ['CLOUDFLARE_ACCOUNT_ID'],'day':day,'databaseId':os.environ['AIDY_D1_DATABASE_ID']}}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=body,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-apply-0014-proof-${{ github.sha }}
          path: |
            /tmp/migrations-0014.txt
            /tmp/final-m1-plan.txt
            /tmp/final-quota-plan.txt
            /tmp/health-0014.json
            /tmp/running-rows-read-0014.txt
          if-no-files-found: warn
          retention-days: 90
