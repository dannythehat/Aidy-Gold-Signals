name: Gold Hunter G005 Jan-Sep2026 Original Tick True M1 Zone Rejection

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_hunter_g005_original_zone_rejection.py'
      - 'scripts/gold_hunter_g005_2026_tick_source.py'
      - 'scripts/gold_hunter_g005_2026_original_tick_replay.py'
      - 'tests/test_gold_hunter_g005_2026_tick_source.py'
      - '.github/workflows/gold-hunter-g005-2026-original-ticks.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g005_2026_source_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Validate original source minute chronology and fail-closed guards
        run: |
          python -m compileall -q scripts/gold_hunter_g005_original_zone_rejection.py scripts/gold_hunter_g005_2026_tick_source.py scripts/gold_hunter_g005_2026_original_tick_replay.py
          python -m pytest -q tests/test_gold_hunter_g005_2026_tick_source.py tests/test_gold_hunter_g005_original_zone_rejection.py tests/test_gold_hunter_2023_2024_causal_research.py

  g005_2026_months:
    needs: g005_2026_source_unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        period: ['202512','202601','202602','202603','202604','202605','202606','202607','202608','202609']
    env:
      PYTHONPATH: src:.
      SOURCE_PERIOD: ${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover prior source-verified CROSSFIRE original month receipt
        uses: actions/download-artifact@v4
        with:
          name: crossfire-2026-${{ matrix.period }}
          run-id: 38851611865
          github-token: ${{ github.token }}
          path: /tmp/prior-receipt
      - name: Read original unchanged monthly BID ASK Gold source ZIP from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get "aidy-memory-test/strategy-lab/histdata/xauusd/ticks/$SOURCE_PERIOD/HISTDATA_COM_ASCII_XAUUSD_T_$SOURCE_PERIOD.zip" --remote --file "/tmp/g005_source_$SOURCE_PERIOD.zip"
      - name: Validate original ZIP and build two-sided original quote M1 (no synthetic candles)
        run: |
          python -m scripts.gold_hunter_g005_2026_tick_source --archive "/tmp/g005_source_$SOURCE_PERIOD.zip" --period "$SOURCE_PERIOD" --original-receipt /tmp/prior-receipt/receipt.json --out "artifacts/g005_2026_m1/$SOURCE_PERIOD"
          rm -f "/tmp/g005_source_$SOURCE_PERIOD.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: g005-source-${{ matrix.period }}
          path: artifacts/g005_2026_m1/${{ matrix.period }}/
          retention-days: 90
          if-no-files-found: error

  g005_2026_original_author:
    needs: g005_2026_months
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Verify original 001B publisher code, preregistered choice and rights disclosure
        run: |
          git clone --depth=1 --quiet https://github.com/anirudhatalmale6-alt/xauusd-strategy-backtest /tmp/g005-original
          cd /tmp/g005-original
          test "$(git hash-object src/strategy.py)" = 30f07bb307fa44a428903bc21b0d51dc441d62d5
          test "$(git hash-object src/dataset.py)" = ae303bc82a36c1d5b644f436fb55f0ce03970b54
          test "$(git hash-object src/engine.py)" = 7aed5ffd3fcfbd8642d5299bf342335068cf3ba6
          test "$(git hash-object out/preregistered.json)" = 9d4d379c3e05ee3deb49f0d0255f62e361588c67
          test ! -e LICENSE
          python -c "import json; p=json.load(open('out/preregistered.json'))['001B']; assert p['r_target']==2.0 and p['risk_pct']==0.25"
      - name: Test source interpretation and AIDY accounting without cloud data
        run: |
          python -m compileall -q scripts/gold_hunter_g005_original_zone_rejection.py
          python -m pytest -q tests/test_gold_hunter_g005_original_zone_rejection.py tests/test_gold_hunter_2023_2024_causal_research.py
      - name: Fetch pinned original AIDY archive decoder code ONLY
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Read-only retrieve existing original authenticated 2023 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2023*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2024 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2024*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2025 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Unwrap existing encrypted quote derivatives in isolated CI (no raw source GET)
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Download all ten source-matched 2026 monthly BID ASK minute artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: g005-source-*
          path: /tmp/g005_2026
          merge-multiple: false
      - name: Run original G005 001B on genuine Jan-Sep2026 BID ASK M1 with 2023-25 warmup
        run: |
          python -m scripts.gold_hunter_g005_2026_original_tick_replay --quotes /tmp/quotes --author /tmp/g005-original --source-2026 /tmp/g005_2026 --out artifacts/g005_2026_original_zone_rejection
          python -c "import json; x=json.load(open('artifacts/g005_2026_original_zone_rejection/report.json')); assert x['schema']=='aidy.g005.2026_original_tick_source_001B.v1' and x['source_original_unmodified'] and x['source_2026_original_tick_receipts']['months']==10"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-g005-original-001B-2026-true-bidask-m1
          path: artifacts/g005_2026_original_zone_rejection/
          retention-days: 90
          if-no-files-found: warn
