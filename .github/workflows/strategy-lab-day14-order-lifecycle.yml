name: Strategy Lab Day14 Order Lifecycle CI
on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_order_lifecycle.py
      - tests/test_strategy_lab_order_lifecycle.py
      - .github/workflows/strategy-lab-day14-order-lifecycle.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q pytest ruff tzdata
      - name: Compile and lint
        run: |
          python -m compileall -q src/aidy/strategy_lab_order_lifecycle.py tests/test_strategy_lab_order_lifecycle.py
          ruff check src/aidy/strategy_lab_order_lifecycle.py tests/test_strategy_lab_order_lifecycle.py
      - name: Test lifecycle and previously accepted broker/source contracts
        run: PYTHONPATH=src python -m pytest -q tests/test_strategy_lab_order_lifecycle.py tests/test_strategy_lab_bidask_execution.py tests/test_strategy_lab_broker_profile.py
      - name: Pin underlying source fixture SHA
        run: sha256sum research/strategy_lab/fixtures/day11_illustrative_broker_observation.json research/strategy_lab/fixtures/day12_illustrative_bidask_quotes.json
