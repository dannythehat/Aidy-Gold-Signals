name: Day 4 Capture Freshness Acceptance

on:
  push:
    branches:
      - ops/day4-capture-freshness-watchdog-20260906
    paths:
      - ".github/workflows/day4-capture-freshness-acceptance.yml"
      - ".github/workflows/aidy-capture-freshness-watchdog.yml"
      - "scripts/aidy_capture_freshness_watchdog.py"
      - "tests/test_day4_capture_freshness_watchdog.py"
      - ".github/workflows/day53-twelve-data-ohlc-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d

jobs:
  accept-day4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install project and run focused watchdog tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check scripts/aidy_capture_freshness_watchdog.py tests/test_day4_capture_freshness_watchdog.py
          uv run pytest -q tests/test_day4_capture_freshness_watchdog.py

      - name: Query live production D1 heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          database=os.environ['AIDY_D1_DATABASE_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          sql='''
          WITH latest_success AS (
            SELECT completed_at_utc
            FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_completion_success
            WHERE completed_at_utc IS NOT NULL
              AND status='succeeded'
              AND request_kind='scheduled_capture'
            ORDER BY completed_at_utc DESC
            LIMIT 1
          ),
          latest_request AS (
            SELECT requested_at_utc,status,error_code
            FROM twelve_data_request_ledger INDEXED BY idx_twelve_data_request_ledger_requested_at_credits
            WHERE request_kind='scheduled_capture'
            ORDER BY requested_at_utc DESC
            LIMIT 1
          )
          SELECT
            s.completed_at_utc AS latest_scheduled_success_utc,
            r.requested_at_utc AS latest_scheduled_request_utc,
            r.status AS latest_scheduled_request_status,
            r.error_code AS latest_scheduled_error_code
          FROM (SELECT 1) AS anchor
          LEFT JOIN latest_success AS s ON 1=1
          LEFT JOIN latest_request AS r ON 1=1
          '''
          req=urllib.request.Request(
              endpoint,
              data=json.dumps({'sql':sql,'params':[]}).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.load(response)
          assert payload.get('success') is True, payload
          result=payload.get('result') or []
          Path('/tmp/day4-live-d1.json').write_text(json.dumps(result, sort_keys=True), encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY
          python scripts/aidy_capture_freshness_watchdog.py \
            --d1-json /tmp/day4-live-d1.json \
            --diagnostic artifacts/day4-live-watchdog.json

      - name: Prove synthetic open-session stale alert
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/day4-stale.json <<'JSON'
          {"latest_scheduled_success_utc":"2026-09-07T11:44:00+00:00","latest_scheduled_request_utc":"2026-09-07T11:59:00+00:00","latest_scheduled_request_status":"failed","latest_scheduled_error_code":"synthetic_failure"}
          JSON
          set +e
          python scripts/aidy_capture_freshness_watchdog.py \
            --d1-json /tmp/day4-stale.json \
            --diagnostic artifacts/day4-synthetic-stale.json \
            --now 2026-09-07T12:00:00Z
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('artifacts/day4-synthetic-stale.json', encoding='utf-8'))
          assert d['status']=='stale', d
          assert d['alert'] is True, d
          assert d['success_lag_seconds']==960, d
          print('synthetic_stale=PASS')
          PY

      - name: Prove synthetic fresh and reopen-grace paths
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/day4-fresh.json <<'JSON'
          {"latest_scheduled_success_utc":"2026-09-07T11:54:00+00:00","latest_scheduled_request_utc":"2026-09-07T11:54:00+00:00","latest_scheduled_request_status":"succeeded","latest_scheduled_error_code":null}
          JSON
          python scripts/aidy_capture_freshness_watchdog.py \
            --d1-json /tmp/day4-fresh.json \
            --diagnostic artifacts/day4-synthetic-fresh.json \
            --now 2026-09-07T12:00:00Z
          cat > /tmp/day4-grace.json <<'JSON'
          {}
          JSON
          python scripts/aidy_capture_freshness_watchdog.py \
            --d1-json /tmp/day4-grace.json \
            --diagnostic artifacts/day4-synthetic-grace.json \
            --now 2026-09-06T22:07:00Z
          python - <<'PY'
          import json
          fresh=json.load(open('artifacts/day4-synthetic-fresh.json', encoding='utf-8'))
          grace=json.load(open('artifacts/day4-synthetic-grace.json', encoding='utf-8'))
          assert fresh['status']=='fresh' and fresh['alert'] is False, fresh
          assert grace['status']=='open_grace' and grace['alert'] is False, grace
          print('synthetic_fresh=PASS synthetic_open_grace=PASS')
          PY

      - name: Prove notification channel without leaving an alert open
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[TEST] AIDY Day 4 capture freshness alert ${GITHUB_RUN_ID}"
          url="$(gh issue create --title "$title" --body "Synthetic Day 4 capture-freshness notification proof only. This issue is closed immediately by the acceptance workflow.")"
          number="${url##*/}"
          gh issue close "$number" --comment "Day 4 synthetic capture-freshness alert path passed; closing test issue."
          echo "synthetic_alert_issue=${number} status=PASS"

      - name: Preserve Day 4 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day4-capture-freshness-${{ github.run_id }}
          path: artifacts/day4-*.json
          if-no-files-found: error
          retention-days: 14
