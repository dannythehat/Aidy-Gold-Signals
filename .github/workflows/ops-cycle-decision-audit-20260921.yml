name: AIDY Cycle Decision Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-cycle-decision-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py

      - name: Sanitised cycle decision audit
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT
                v.window_start_utc,
                v.window_end_utc,
                v.observed_state,
                v.view_direction,
                v.view_confidence,
                v.reasoning_summary,
                (
                  SELECT json_group_array(json_object(
                    'surface', json_extract(j.value,'$.surface'),
                    'vote', json_extract(j.value,'$.vote'),
                    'weight', json_extract(j.value,'$.weight')
                  ))
                  FROM json_each(v.supporting_reasons_json) j
                ) AS supporting,
                (
                  SELECT json_group_array(json_object(
                    'surface', json_extract(j.value,'$.surface'),
                    'vote', json_extract(j.value,'$.vote'),
                    'weight', json_extract(j.value,'$.weight')
                  ))
                  FROM json_each(v.contradicting_reasons_json) j
                ) AS contradicting,
                (
                  SELECT json_group_array(json_object(
                    'surface', json_extract(j.value,'$.surface'),
                    'status', json_extract(j.value,'$.status')
                  ))
                  FROM json_each(v.unavailable_evidence_json) j
                ) AS unavailable,
                v.toolbox_used_json,
                o.resolved_at_utc,
                o.realised_direction,
                o.return_bps,
                o.mfe_bps,
                o.mae_bps,
                o.exact_direction_correct
              FROM aidy_gold_cycle_views v
              LEFT JOIN aidy_gold_cycle_outcomes o ON o.cycle_view_id=v.cycle_view_id
              WHERE v.window_start_utc='2026-09-21T04:00:00+00:00'
              LIMIT 1;
            "
