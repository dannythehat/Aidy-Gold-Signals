name: AIDY Day 52 End-to-End Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/d1/0004_end_to_end_cycles.sql"
      - "src/aidy/decision_ledger.py"
      - "src/aidy/safety_gates_v2.py"
      - "src/aidy/openai_gateway_v2.py"
      - "src/aidy/self_consistency_v2.py"
      - "src/aidy/self_consistency_ledger_v2.py"
      - "src/aidy/end_to_end_store.py"
      - "src/aidy/paper_management_runtime.py"
      - "src/aidy/end_to_end.py"
      - "tests/test_day52_end_to_end.py"
      - "tests/test_day52_management_end_to_end.py"
      - "scripts/day52_end_to_end_acceptance.py"
      - "docs/day52-end-to-end-fidelity-restart.md"
      - ".github/workflows/day52-end-to-end-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify candidate descends from current protected main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/decision_ledger.py src/aidy/safety_gates_v2.py src/aidy/openai_gateway_v2.py src/aidy/self_consistency_v2.py src/aidy/self_consistency_ledger_v2.py src/aidy/end_to_end_store.py src/aidy/paper_management_runtime.py src/aidy/end_to_end.py tests/test_day52_end_to_end.py tests/test_day52_management_end_to_end.py scripts/day52_end_to_end_acceptance.py
          uv run python -m compileall -q src scripts tests

      - name: Enforce standalone AIDY boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '^(from|import) .*?(metaapi|mt5|vantage|super_signals|broker|account|follower)' src/aidy/end_to_end.py src/aidy/end_to_end_store.py src/aidy/paper_management_runtime.py; then
            echo "Day 52 imported a forbidden execution/downstream integration"
            exit 1
          fi

      - name: Focused Day 52 adversarial tests
        shell: bash
        run: uv run pytest -q tests/test_day52_end_to_end.py tests/test_day52_management_end_to_end.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

      - name: Deterministic acceptance A
        shell: bash
        run: uv run python scripts/day52_end_to_end_acceptance.py --output-dir day52_artifacts_a

      - name: Deterministic acceptance B
        shell: bash
        run: uv run python scripts/day52_end_to_end_acceptance.py --output-dir day52_artifacts_b

      - name: Require byte-identical evidence
        shell: bash
        run: diff -ru day52_artifacts_a day52_artifacts_b

      - name: Preserve Day 52 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day52-end-to-end-${{ github.event.pull_request.head.sha || github.sha }}
          path: day52_artifacts_a/
          if-no-files-found: error
          retention-days: 90
