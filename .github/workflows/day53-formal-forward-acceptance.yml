name: AIDY Day 53 Formal Forward Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/d1/0005_formal_forward_cohorts.sql"
      - "src/aidy/forward_evaluation.py"
      - "tests/test_day53_formal_forward.py"
      - "scripts/day53_formal_forward_acceptance.py"
      - "docs/day53-formal-forward-freeze.md"
      - ".github/workflows/day53-formal-forward-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DAY53_BASE_SHA: c2282d4cd6ab3eebc311e62004167a78d5ccee15

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify Day 53 base and bounded surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$DAY53_BASE_SHA" HEAD)" = "$DAY53_BASE_SHA"
          allowed='^(migrations/d1/0005_formal_forward_cohorts.sql|src/aidy/forward_evaluation.py|tests/test_day53_formal_forward.py|scripts/day53_formal_forward_acceptance.py|docs/day53-formal-forward-freeze.md|.github/workflows/day53-formal-forward-acceptance.yml)$'
          unexpected="$(git diff --name-only "$DAY53_BASE_SHA"...HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected Day 53 changes:"; echo "$unexpected"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/forward_evaluation.py tests/test_day53_formal_forward.py scripts/day53_formal_forward_acceptance.py
          uv run python -m compileall -q src scripts tests

      - name: Enforce standalone paper-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '^(from|import) .*?(metaapi|mt5|vantage|super_signals|broker|account|follower)' src/aidy/forward_evaluation.py; then
            echo "Day 53 imported a forbidden execution/downstream integration"
            exit 1
          fi

      - name: Focused Day 53 adversarial tests
        shell: bash
        run: uv run pytest -q tests/test_day53_formal_forward.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

      - name: Deterministic readiness acceptance A
        shell: bash
        run: uv run python scripts/day53_formal_forward_acceptance.py --output-dir day53_artifacts_a

      - name: Deterministic readiness acceptance B
        shell: bash
        run: uv run python scripts/day53_formal_forward_acceptance.py --output-dir day53_artifacts_b

      - name: Require byte-identical readiness evidence
        shell: bash
        run: diff -ru day53_artifacts_a day53_artifacts_b

      - name: Preserve Day 53 readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day53-forward-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: day53_artifacts_a/
          if-no-files-found: error
          retention-days: 90
