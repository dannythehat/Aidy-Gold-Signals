name: AIDY Two Mechanical Gold Systems Real History Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_s010_backtest.py
      - src/aidy/strategy_lab_system_processor.py
      - tests/test_strategy_lab_system_processor.py
      - scripts/strategy_lab/run_real_two_systems.py
      - docs/aidy-actual-system-processing-audit.md
      - .github/workflows/strategy-lab-multi-system-real-gold.yml

permissions:
  contents: read

jobs:
  genuine-two-strategy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install genuine original source integration and research requirements
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4' numpy pandas
      - name: Strict code checks (no suppressions)
        run: |
          python -m compileall -q src/aidy/strategy_lab_s010_backtest.py src/aidy/strategy_lab_system_processor.py tests/test_strategy_lab_system_processor.py scripts/strategy_lab/run_real_two_systems.py
          ruff check src/aidy/strategy_lab_s010_backtest.py src/aidy/strategy_lab_system_processor.py tests/test_strategy_lab_system_processor.py scripts/strategy_lab/run_real_two_systems.py
      - name: Verify existing S010 unchanged and second family forward-only signal causality
        run: PYTHONPATH=src:. python -m pytest -q tests/test_strategy_lab_s010_backtest.py tests/test_strategy_lab_system_processor.py
      - name: Re-run ALL genuine 2025 native M1 BID archive months via read-only BigQuery
        id: real_source
        continue-on-error: true
        run: PYTHONPATH=src:. python scripts/strategy_lab/s010_run_12month_history.py
      - name: Run both independent gold mechanical rule families on exact verified source
        if: steps.real_source.outcome == 'success'
        run: PYTHONPATH=src:. python scripts/strategy_lab/run_real_two_systems.py
      - name: Fail closed if actual market read unavailable
        if: steps.real_source.outcome != 'success'
        run: |
          echo 'Real source missing or invalid: modelled source PASS forbidden' >&2
          exit 1
      - name: Independently inspect saved model/trade correspondence
        if: steps.real_source.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/strategy_lab/two_system_processing/two_system_historical_research.json').read_text())
          assert p['status']=='PASS_REAL_MARKET_SOURCE_TWO_MECHANICAL_RESEARCH_RUNS'
          assert p['source_receipt_count']==12 and len(p['actual_bigquery_job_ids'])==12
          assert p['legacy_original_model_parity'] and p['real_customer_or_broker_orders']==0
          assert p['original_83_system_profitability_batch_complete'] is False
          m=p['system_processor']['models']
          assert set(m)=={'S010','LAB_DONCHIAN_20_10'}
          assert m['LAB_DONCHIAN_20_10']['source_category']=='LABORATORY_DEFINED_NOT_CATALOGUE'
          assert all(x['base']['closed_trades']==len(x['base']['trades']) for x in m.values())
          for system in m:
              assert Path(f'artifacts/strategy_lab/two_system_processing/{system}_base_trades.csv').is_file()
          print('ACTUAL_TWO_SYSTEM_GOLD_RESEARCH_ONLY_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIDY-Real-Gold-Two-Independent-Rule-Families
          path: |
            artifacts/strategy_lab/two_system_processing/
            artifacts/strategy_lab/s010_paid_customer_example/blocked_result.json
          if-no-files-found: warn
          retention-days: 90
