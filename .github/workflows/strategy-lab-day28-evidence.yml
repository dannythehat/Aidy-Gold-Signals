name: Strategy Lab Day28 Nine Factor Evidence Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_evidence_rating.py
      - scripts/strategy_lab/day28_evidence_rating_acceptance.py
      - tests/test_strategy_lab_evidence_rating.py
      - tests/test_strategy_lab_day28_real_evidence.py
      - docs/strategy-lab-day28-nine-factor-evidence-rating.md
      - .github/workflows/strategy-lab-day28-evidence.yml

permissions:
  contents: read

jobs:
  validate-day28-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependency tests and qualified BigQuery reader
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Compile and enforce strict Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_evidence_rating.py scripts/strategy_lab/day28_evidence_rating_acceptance.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py
          ruff check src/aidy/strategy_lab_evidence_rating.py scripts/strategy_lab/day28_evidence_rating_acceptance.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py
      - name: Test real 24-27 replay, original weights, vetoes, factor uncertainty and OOS regression
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py tests/test_strategy_lab_regimes.py tests/test_strategy_lab_day27_real_history.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_day26_real_history.py tests/test_strategy_lab_baselines_stress.py tests/test_strategy_lab_risk_metrics.py
      - name: Independently recheck original ledger and two real BigQuery research source replays
        run: PYTHONPATH=src:. python scripts/strategy_lab/day28_evidence_rating_acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day28-original-nine-factor-verified-source-no-invented-score
          path: artifacts/strategy_lab/day28_nine_factor_evidence_acceptance.json
          retention-days: 90
