name: AIDY Day 53 Retrigger Resumable Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/day53-retrigger-resumable-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-resumable-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch resumable bootstrap recovery on exact protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          payload='{"ref":"main"}'
          status="$(curl --silent --show-error --output /tmp/dispatch-response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/day53-resumable-bootstrap-recovery.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || { cat /tmp/dispatch-response.txt; exit 1; }
          echo "resumable_recovery_dispatched=true"
