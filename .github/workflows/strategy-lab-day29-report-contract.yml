name: Strategy Lab Day29 Canonical Research Reporting

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_report_contract.py
      - scripts/strategy_lab/day29_canonical_report_acceptance.py
      - tests/test_strategy_lab_report_contract.py
      - docs/strategy-lab-day29-canonical-results-and-goldthinker-contract.md
      - .github/workflows/strategy-lab-day29-report-contract.yml

permissions:
  contents: read

jobs:
  day29-report-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python CI and read-only BigQuery client
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Enforce Python syntax and Ruff
        run: |
          python -m compileall -q src/aidy/strategy_lab_report_contract.py scripts/strategy_lab/day29_canonical_report_acceptance.py tests/test_strategy_lab_report_contract.py
          ruff check src/aidy/strategy_lab_report_contract.py scripts/strategy_lab/day29_canonical_report_acceptance.py tests/test_strategy_lab_report_contract.py
      - name: Test canonical financial reconciliation, source evidence and previous engine regressions
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_day28_real_evidence.py tests/test_strategy_lab_regimes.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_baselines_stress.py tests/test_strategy_lab_risk_metrics.py
      - name: Produce and replay the actual canonical JSON report against independent historical data reads
        run: PYTHONPATH=src:. python scripts/strategy_lab/day29_canonical_report_acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day29-aidy-canonical-results-goldthinker-separate-account-report
          path: artifacts/strategy_lab/day29_canonical_auditable_result.json
          retention-days: 90
