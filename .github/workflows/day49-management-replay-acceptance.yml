name: AIDY Day 49 Management Replay Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/aidy/management_replay.py"
      - "tests/test_day49_management_replay.py"
      - "scripts/day49_management_replay_acceptance.py"
      - "docs/day49-management-replay-counterfactual.md"
      - ".github/workflows/day49-management-replay-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DAY49_BASE_SHA: f471d47c53d7e0c7f294a6c252205fff6ec4dc8a

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify Day 49 base and bounded surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$DAY49_BASE_SHA" HEAD)" = "$DAY49_BASE_SHA"
          allowed='^(src/aidy/management_replay.py|tests/test_day49_management_replay.py|scripts/day49_management_replay_acceptance.py|docs/day49-management-replay-counterfactual.md|.github/workflows/day49-management-replay-acceptance.yml)$'
          unexpected="$(git diff --name-only "$DAY49_BASE_SHA"...HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected Day 49 changes:"; echo "$unexpected"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/management_replay.py tests/test_day49_management_replay.py scripts/day49_management_replay_acceptance.py
          uv run python -m compileall -q src scripts tests

      - name: Enforce evaluation-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '^(from|import) .*?(metaapi|mt5|vantage|telegram|super_signals|broker|account|follower)' src/aidy/management_replay.py; then
            echo "Day 49 imported a forbidden execution integration"
            exit 1
          fi

      - name: Focused Day 49 adversarial tests
        shell: bash
        run: uv run pytest -q tests/test_day49_management_replay.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q

      - name: Deterministic acceptance A
        shell: bash
        run: |
          uv run python scripts/day49_management_replay_acceptance.py --output-dir day49_artifacts_a > /tmp/day49-a.json
          cat /tmp/day49-a.json

      - name: Deterministic acceptance B
        shell: bash
        run: |
          uv run python scripts/day49_management_replay_acceptance.py --output-dir day49_artifacts_b > /tmp/day49-b.json
          cat /tmp/day49-b.json

      - name: Require byte-identical evidence
        shell: bash
        run: diff -ru day49_artifacts_a day49_artifacts_b

      - name: Enforce Day 49 boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          with open("day49_artifacts_a/summary.json", encoding="utf-8") as handle:
              result = json.load(handle)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert result["ok"] is True, result
          assert result["base_sha"] == "f471d47c53d7e0c7f294a6c252205fff6ec4dc8a", result
          assert result["head_sha"] == head, result
          assert result["unchanged_benchmark_frozen_before_evaluation"] is True, result
          assert result["entry_and_management_effects_separate"] is True, result
          assert result["restart_serialization_supported"] is True, result
          assert result["conflicting_actions_fail_closed"] is True, result
          assert result["delayed_or_mismatched_evidence_fails_closed"] is True, result
          assert result["raw_and_effective_n_reported"] is True, result
          assert result["regime_and_setup_segmentation_reported"] is True, result
          assert result["individual_trade_can_promote_management"] is False, result
          assert result["promotion_allowed"] is False, result
          assert result["execution_allowed"] is False, result
          assert result["formal_forward_evidence_created"] is False, result
          assert result["super_signals_modified"] is False, result
          PY

      - name: Preserve Day 49 evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-day49-management-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: day49_artifacts_a/
          if-no-files-found: error
          retention-days: 90
