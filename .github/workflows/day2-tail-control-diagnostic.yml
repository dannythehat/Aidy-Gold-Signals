name: AIDY Day 2 Tail Control Diagnostic

on:
  push:
    branches:
      - feature/day-2-real-evidence-capture
    paths:
      - ".github/workflows/day2-tail-control-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-tail-vs-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: aidy-signals-test
      WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
    steps:
      - name: Prove tail sees fetch while checking for scheduled delivery
        shell: bash
        run: |
          set -u
          : > /tmp/tail.log
          timeout --signal=INT --kill-after=5s 70s \
            npx --yes wrangler@4 tail "${WORKER_NAME}" --format json \
            > /tmp/tail.log 2>&1 &
          tail_pid=$!

          # Give Wrangler time to establish the tail, then create one known control invocation.
          sleep 12
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${WORKER_URL}/health" || true)"
          echo "control_health_http=${code}"
          sleep 58
          wait "$tail_pid" || true

          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/tail.log').read_text(encoding='utf-8',errors='replace')
          rows=[]
          for line in text.splitlines():
              line=line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  obj=json.loads(line)
              except Exception:
                  continue
              event=obj.get('event') or {}
              req=event.get('request') if isinstance(event,dict) else None
              rows.append({
                  'outcome':obj.get('outcome'),
                  'eventTimestamp':obj.get('eventTimestamp'),
                  'cron':event.get('cron') if isinstance(event,dict) else None,
                  'scheduledTime':event.get('scheduledTime') if isinstance(event,dict) else None,
                  'url':req.get('url') if isinstance(req,dict) else None,
                  'method':req.get('method') if isinstance(req,dict) else None,
                  'exceptions':obj.get('exceptions') or [],
              })
          fetches=[r for r in rows if r.get('url')]
          scheduled=[r for r in rows if r.get('cron') is not None or r.get('scheduledTime') is not None]
          print(f'tail_total_events={len(rows)}')
          print(f'tail_fetch_events={len(fetches)}')
          print(f'tail_scheduled_events={len(scheduled)}')
          for r in rows:
              print('tail_event='+json.dumps(r,separators=(',',':'),default=str))
          # This diagnostic intentionally never fails: it is evidence collection only.
          PY

          echo "Tail control diagnostic complete; no deployment or storage mutation performed."
