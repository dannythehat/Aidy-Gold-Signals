name: Strategy Lab Day34 Private GoldThinker Handoff Gate

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_goldthinker_handoff.py
      - scripts/strategy_lab/day34_private_handoff_acceptance.py
      - tests/test_strategy_lab_goldthinker_handoff.py
      - docs/strategy-lab-day34-owner-goldthinker-handoff.md
      - .github/workflows/strategy-lab-day34-handoff.yml

permissions:
  contents: read

jobs:
  review-only-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install strict audit and original real-source reader
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Strict Ruff and Python syntax
        run: |
          python -m compileall -q src/aidy/strategy_lab_goldthinker_handoff.py scripts/strategy_lab/day34_private_handoff_acceptance.py tests/test_strategy_lab_goldthinker_handoff.py
          ruff check src/aidy/strategy_lab_goldthinker_handoff.py scripts/strategy_lab/day34_private_handoff_acceptance.py tests/test_strategy_lab_goldthinker_handoff.py
      - name: Test original nine factor gates, signed review policy and research-provenance regression
        run: |
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_goldthinker_handoff.py tests/test_strategy_lab_owner_dashboard.py tests/test_strategy_lab_batch_queue.py tests/test_strategy_lab_evidence_rating.py tests/test_strategy_lab_report_contract.py tests/test_strategy_lab_oos_protocol.py tests/test_strategy_lab_regimes.py
      - name: Actual Day33 83-row source + real BigQuery historical replay, then reject all unqualified GoldThinker handoffs
        run: PYTHONPATH=src:. python scripts/strategy_lab/day34_private_handoff_acceptance.py
      - name: Assert no automatic trader, no paper account and zero invented approved systems
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('artifacts/strategy_lab')
          proof=json.loads((base/'day34_handoff_acceptance.json').read_text())
          packet=json.loads((base/'day34/handoff_for_separate_owner_and_claude_review.json').read_text())
          excluded=json.loads((base/'day34/source_candidate_blockers.json').read_text())
          checklist=(base/'day34/review_checkpoint.md').read_text()
          assert proof['status']=='PASS',proof
          assert proof['original_untested_gold_edge_sources']==83
          assert proof['real_qualifying_strategy_exports']==0
          assert proof['real_systems_tested_for_profit']==0
          assert proof['synthetic_queue_diagnostics_not_a_strategy_backtest']==100
          assert len(proof['source_bigquery_job_ids'])==2
          assert len(excluded)==83
          assert all(x['goldthinker_paper_handoff'] is False for x in excluded)
          assert packet['candidate_count']==0 and packet['candidates']==[]
          assert packet['production_status']=='NO_DEPLOYMENT'
          assert packet['no_broker_or_customer_side_effects'] is True
          assert all(v is False for v in packet['all_production_actions_blocked'].values())
          assert proof['customer_join_live_trading_and_paper_execution_disabled'] is True
          assert proof['issuer_credential_was_not_persisted'] is True
          assert 'NO REAL SYSTEMS HAVE QUALIFIED' in checklist
          assert 'Paper production: NOT STARTED' in checklist
          print('Day34 original owner/Claude handoff policies PASS; 0 of 83 research sources promoted.')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day34-owner-claude-goldthinker-no-auto-handoff
          path: |
            artifacts/strategy_lab/day34/
            artifacts/strategy_lab/day34_handoff_acceptance.json
            artifacts/strategy_lab/day33_owner_dashboard_acceptance.json
          retention-days: 90
