name: AIDY Day 2 Runtime Diagnostic

on:
  push:
    branches:
      - feature/day-2-real-evidence-capture
    paths:
      - ".github/workflows/day2-runtime-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      WORKER_NAME: aidy-signals-test
    steps:
      - name: Read current Day 2 runtime evidence
        shell: bash
        run: |
          set -u
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          d1="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}/query"
          workers="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"

          query() {
            local sql="$1"
            local out="$2"
            python - "$sql" <<'PY' > /tmp/payload.json
          import json,sys
          print(json.dumps({"sql":sys.argv[1]}))
          PY
            curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json "$d1" > "$out" || true
          }

          query "SELECT COUNT(*) AS total, MAX(captured_at) AS latest FROM market_snapshots" /tmp/snapshot-count.json
          query "SELECT capture_status, COUNT(*) AS n FROM market_snapshots GROUP BY capture_status ORDER BY capture_status" /tmp/snapshot-status.json
          query "SELECT captured_at,capture_status,(bid IS NOT NULL) AS has_bid,(ask IS NOT NULL) AS has_ask,quote_age_seconds,(latest_m1_id IS NOT NULL) AS has_m1,(latest_m5_id IS NOT NULL) AS has_m5,data_availability_json FROM market_snapshots ORDER BY captured_at DESC LIMIT 5" /tmp/latest-snapshots.json
          query "SELECT COUNT(*) AS total, MAX(first_observed_at) AS latest FROM market_candles" /tmp/candles.json
          query "SELECT COUNT(*) AS total, MAX(first_observed_at) AS latest FROM market_event_observations" /tmp/events.json
          query "SELECT status, COUNT(*) AS n FROM archive_outbox GROUP BY status ORDER BY status" /tmp/outbox.json

          curl -sS -H "$auth" "${workers}/schedules" > /tmp/schedules.json || true
          curl -sS -H "$auth" "${workers}/settings" > /tmp/settings.json || true

          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  return {"parse_error":str(exc)}

          def d1_rows(path):
              p=load(path)
              if not p.get('success'):
                  return {"api_error":p.get('errors') or p}
              result=p.get('result') or []
              block=result[0] if isinstance(result,list) and result else result
              return block.get('results',[]) if isinstance(block,dict) else block

          print('=== AIDY DAY 2 RUNTIME DIAGNOSTIC ===')
          print('snapshot_count=', json.dumps(d1_rows('/tmp/snapshot-count.json'), separators=(',',':')))
          print('snapshot_status=', json.dumps(d1_rows('/tmp/snapshot-status.json'), separators=(',',':')))
          print('latest_snapshots=', json.dumps(d1_rows('/tmp/latest-snapshots.json'), separators=(',',':')))
          print('candles=', json.dumps(d1_rows('/tmp/candles.json'), separators=(',',':')))
          print('events=', json.dumps(d1_rows('/tmp/events.json'), separators=(',',':')))
          print('outbox=', json.dumps(d1_rows('/tmp/outbox.json'), separators=(',',':')))

          sched=load('/tmp/schedules.json')
          schedules=(sched.get('result') or {}).get('schedules',[]) if isinstance(sched.get('result'),dict) else (sched.get('result') or [])
          print('cron_schedules=', json.dumps([s.get('cron') for s in schedules], separators=(',',':')))

          settings=load('/tmp/settings.json')
          bindings=[]
          result=settings.get('result') or {}
          raw=result.get('bindings',[]) if isinstance(result,dict) else []
          for item in raw:
              name=item.get('name')
              typ=item.get('type')
              if name:
                  bindings.append({"name":name,"type":typ})
          print('worker_binding_names=', json.dumps(bindings, separators=(',',':')))
          PY

          echo "Diagnostic completed read-only; workflow intentionally performs no mutation."
