name: Ops Day53 Post-Bootstrap Diagnostic 20260908

on:
  push:
    branches: [fix/day53-rate-limit-recovery-20260908]
    paths:
      - ".github/workflows/ops-day53-postbootstrap-diagnostic-20260908.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build read-only config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']='aidy-ops-test'
          cfg['d1_databases'][0]['database_id']='3588d82a-d686-4430-872d-d4c0e62c3d5d'
          cfg['r2_buckets'][0]['bucket_name']='aidy-memory-test'
          json.dump(cfg, open('wrangler.ops.diagnostic.jsonc','w',encoding='utf-8'), indent=2)
          PY
      - name: Query current D1 state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.ops.diagnostic.jsonc --command "SELECT id,captured_at,capture_status,latest_m1_id,latest_m5_id,latest_m15_id,latest_h1_id,latest_h4_id,latest_d1_id,data_availability_json FROM market_snapshots ORDER BY captured_at DESC LIMIT 20" | tee /tmp/latest-snapshots.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.ops.diagnostic.jsonc --command "SELECT id,requested_at_utc,completed_at_utc,request_kind,status,error_code,outputsize,internal_accounted_credits FROM twelve_data_request_ledger ORDER BY requested_at_utc DESC LIMIT 40" | tee /tmp/latest-requests.json
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.ops.diagnostic.jsonc --command "SELECT id,started_at_utc,completed_at_utc,as_of_utc,planned_windows,required_m1_minutes,state FROM twelve_data_bootstrap_runs ORDER BY started_at_utc DESC LIMIT 10" | tee /tmp/bootstrap-runs.json
      - name: Read queue consumer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@4 r2 object get aidy-memory-test/diagnostics/day2-queue-consumer-error.json --remote --file /tmp/queue-error.json; then
            cat /tmp/queue-error.json
          else
            echo '{"queue_error":"not_found_or_unreadable"}' | tee /tmp/queue-error.json
          fi
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidy-postbootstrap-diagnostic-${{ github.sha }}
          path: |
            /tmp/latest-snapshots.json
            /tmp/latest-requests.json
            /tmp/bootstrap-runs.json
            /tmp/queue-error.json
          retention-days: 30
