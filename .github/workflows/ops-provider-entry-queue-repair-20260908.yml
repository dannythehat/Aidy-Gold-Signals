# Retriggered after replacing the CPython-incompatible Worker import test.
name: Ops Provider Entry Queue Repair 20260908

on:
  push:
    branches: [ops/provider-context-snapshot-repair-20260908]
    paths:
      - ".github/workflows/ops-provider-entry-queue-repair-20260908.yml"

concurrency:
  group: aidy-provider-entry-queue-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test
  QUEUE_NAME: aidy-capture-test

jobs:
  test-deploy-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run queue contract and full AIDY regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run pytest -q tests/test_provider_entry_queue_contract.py
          uv run pytest -q
      - name: Build exact capture-only live config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          cfg=json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name']=os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id']=os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name']=os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED']='true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE']='twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP']='public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS']='300'
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']='false'
          cfg['vars']['AIDY_TWELVE_DATA_BOOTSTRAP_ENABLED']='false'
          cfg['triggers']['crons']=[]
          assert cfg['main']=='src/provider_entry.py'
          assert cfg['queues']['consumers'][0]['queue']=='aidy-capture-test'
          json.dump(cfg, open('wrangler.provider-entry-repair.live.jsonc','w',encoding='utf-8'), indent=2)
          PY
      - name: Deploy capture worker with concrete queue handler
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.provider-entry-repair.live.jsonc wrangler.jsonc
          uv run pywrangler deploy
      - name: Verify live runtime state
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            curl -fsS -H 'Cache-Control: no-cache' "${AIDY_TEST_WORKER_URL}/health?queue_repair=${GITHUB_SHA}-${attempt}" > /tmp/health.json || true
            if python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('status')=='ok', h
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source')=='twelve_data', h
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" -eq 1
          cat /tmp/health.json
      - name: Push one market-due message and prove consumer execution
        shell: bash
        run: |
          set -euo pipefail
          PROBE_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?name=${QUEUE_NAME}" > /tmp/queues.json
          QUEUE_ID="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/queues.json', encoding='utf-8'))
          rows=p.get('result') or []
          assert p.get('success') is True and len(rows)==1, p
          print(rows[0]['queue_id'])
          PY
          )"
          SCHEDULED_MS="$(python - <<'PY'
          import time
          print((int(time.time())//300)*300000)
          PY
          )"
          python - "$SCHEDULED_MS" <<'PY' > /tmp/body.json
          import json,sys
          print(json.dumps({'body': {'scheduledTime': int(sys.argv[1]), 'cron': 'ops-provider-entry-queue-repair'}}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages" \
            --data-binary @/tmp/body.json | tee /tmp/push.json
          found=0
          for attempt in $(seq 1 18); do
            npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json --config wrangler.provider-entry-repair.live.jsonc \
              --command "SELECT requested_at_utc,completed_at_utc,status,error_code,outputsize FROM twelve_data_request_ledger WHERE request_kind='scheduled_capture' AND requested_at_utc>='${PROBE_AT}' ORDER BY requested_at_utc DESC LIMIT 3;" > /tmp/post.json
            if python - <<'PY'
          import json
          rows=[]
          for batch in json.load(open('/tmp/post.json', encoding='utf-8')):
              rows.extend(batch.get('results') or [])
          print(rows)
          assert rows, rows
          PY
            then found=1; cat /tmp/post.json; break; fi
            sleep 5
          done
          test "$found" -eq 1
