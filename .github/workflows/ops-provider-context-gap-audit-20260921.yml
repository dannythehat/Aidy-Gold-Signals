name: AIDY Provider Context Gap Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-provider-context-gap-audit-20260921.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIDY_D1_DATABASE_NAME: aidy-ops-test
      AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
      AIDY_R2_BUCKET_NAME: aidy-memory-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build live config
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run python scripts/build_cloudflare_live_config.py

      - name: Pull provider-context gap evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "=== recent_snapshots ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT id,captured_at,capture_status,session_code,
                     json_extract(data_availability_json,'$.request_kind') AS request_kind,
                     json_extract(data_availability_json,'$.request_ledger_status') AS ledger_status,
                     json_extract(data_availability_json,'$.freshness_state') AS freshness_state,
                     latest_m1_id IS NOT NULL AS m1,
                     latest_m5_id IS NOT NULL AS m5,
                     latest_m15_id IS NOT NULL AS m15,
                     latest_h1_id IS NOT NULL AS h1,
                     latest_h4_id IS NOT NULL AS h4
              FROM market_snapshots
              WHERE captured_at>='2026-09-21T05:40:00+00:00'
              ORDER BY captured_at DESC
              LIMIT 40;
            "

          echo "=== recent_requests ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT requested_at_utc,completed_at_utc,request_kind,status,error_code,
                     outputsize,internal_accounted_credits,
                     provider_minute_credits_used,provider_minute_credits_left
              FROM twelve_data_request_ledger
              WHERE requested_at_utc>='2026-09-21T05:40:00+00:00'
              ORDER BY requested_at_utc DESC
              LIMIT 60;
            "

          echo "=== latest_cycles ==="
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote --json \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT window_start_utc,window_end_utc,decided_at_utc,
                     observed_state,view_direction
              FROM aidy_gold_cycle_views
              ORDER BY window_start_utc DESC
              LIMIT 12;
            "
