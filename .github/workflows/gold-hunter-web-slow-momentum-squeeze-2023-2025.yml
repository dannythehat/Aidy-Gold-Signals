name: Gold Hunter External Gold Trend Persistence and BB Keltner Squeeze 2023-2025

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_hunter_web_slow_momentum_squeeze.py'
      - 'tests/test_gold_hunter_web_slow_momentum_squeeze.py'
      - '.github/workflows/gold-hunter-web-slow-momentum-squeeze-2023-2025.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-original-aidy-three-years:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pandas==2.2.3 numpy==2.3.5 cryptography pytest
      - name: Inspect pinned MIT original research source without running downloaded code
        run: |
          git clone --depth=1 --quiet https://github.com/zero-was-here/tradingbot /tmp/web-origin
          test "$(git -C /tmp/web-origin hash-object aurum/strategies/trend.py)" = 'b6e5d320c755befd37d7c36dee7e3ed9d2e63742'
          test "$(git -C /tmp/web-origin hash-object aurum/strategies/breakout.py)" = '06b0d6227f5f34968d137ff857461ad4e3a70dad'
          grep -q 'MIT License' /tmp/web-origin/LICENSE
      - name: Test source interpretation and AIDY accounting without cloud data
        run: |
          python -m compileall -q scripts/gold_hunter_web_slow_momentum_squeeze.py
          python -m pytest -q tests/test_gold_hunter_web_slow_momentum_squeeze.py tests/test_gold_hunter_2023_2024_causal_research.py
      - name: Fetch pinned original AIDY archive decoder code ONLY
        run: |
          git fetch --depth=1 origin 1eb0f678c3158b4a76993ec14ffa7e760d101a0c
          git show 1eb0f678c3158b4a76993ec14ffa7e760d101a0c:scripts/oracle_gold/snapshot_bundle.py > /tmp/aidy_snapshot_bundle.py
          python -m py_compile /tmp/aidy_snapshot_bundle.py
      - name: Read-only retrieve existing original authenticated 2023 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2023*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2024 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2024*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Read-only retrieve existing original authenticated 2025 BID ASK snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-bidask-2025*
          run-id: 40819738674
          github-token: ${{ github.token }}
          path: /tmp/encrypted
      - name: Unwrap existing encrypted quote derivatives in isolated CI (no raw source GET)
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for folder in /tmp/encrypted/oracle-bidask-*; do
            test -f "$folder/snapshot.encrypted.json" || exit 2
            period="${folder##*oracle-bidask-}"
            python /tmp/aidy_snapshot_bundle.py open-ci --source "$folder/snapshot.encrypted.json" --out "/tmp/quotes/$period"
          done
      - name: Independently test slower source-origin momentum and squeeze on AIDY real spot quotes
        run: python -m scripts.gold_hunter_web_slow_momentum_squeeze --quotes /tmp/quotes --out artifacts/web_slow_momentum_squeeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hunter-mit-tsmom-bb-kc-spot-aidy-2023-2025
          path: artifacts/web_slow_momentum_squeeze/
          retention-days: 90
          if-no-files-found: warn
