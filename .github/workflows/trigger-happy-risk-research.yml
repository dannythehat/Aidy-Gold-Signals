name: TH001 Real Gold Tick Risk & Latency - 540 Cases

on:
  push:
    branches: ['research/trigger-happy-v0-1-20261030']
    paths:
      - 'research/strategy_lab/trigger_happy/risk_sweep.py'
      - 'tests/test_trigger_happy_risk.py'
      - '.github/workflows/trigger-happy-risk-research.yml'

permissions:
  contents: read

jobs:
  genuine-source-risk-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['202606','202607','202608','202609']
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --quiet numpy numba
      - name: Verify baseline parity, causal long/short and 540 complete trials
        run: |
          python -m compileall -q research/strategy_lab/trigger_happy/
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_trigger_happy_grid.py -v
          PYTHONPATH=src:. python -m unittest discover -s tests -p test_trigger_happy_risk.py -v
      - name: Original immutable source BID ASK ZIP read-only
        run: |
          npx --yes wrangler@4 r2 object get "aidy-memory-test/strategy-lab/histdata/xauusd/ticks/${SOURCE_MONTH}/HISTDATA_COM_ASCII_XAUUSD_T_${SOURCE_MONTH}.zip" --remote --file "/tmp/th001_risk_${SOURCE_MONTH}.zip"
      - name: Full tick 540-case follows/fades, targets, stops, delays and timers
        run: |
          PYTHONPATH=src:. python research/strategy_lab/trigger_happy/risk_sweep.py --archive "/tmp/th001_risk_${SOURCE_MONTH}.zip" --period "${SOURCE_MONTH}" --out "artifacts/trigger_happy/risk/${SOURCE_MONTH}/"
          rm -f "/tmp/th001_risk_${SOURCE_MONTH}.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: th001-540-risk-${{ matrix.month }}-source-evidence
          path: artifacts/trigger_happy/risk/${{ matrix.month }}/
          retention-days: 90
          if-no-files-found: warn
