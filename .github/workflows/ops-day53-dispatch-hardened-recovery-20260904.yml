name: Ops Day 53 Dispatch Hardened Recovery 20260904

on:
  push:
    branches:
      - ops/day53-postproof-diagnostic-20260904
    paths:
      - .github/workflows/ops-day53-dispatch-hardened-recovery-20260904.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch hardened recovery on protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/day53-hardened-bootstrap-recovery.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'hardened_recovery_dispatched=true'
