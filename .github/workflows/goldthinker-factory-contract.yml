name: GoldThinker factory contract (offline)
on:
  pull_request:
    paths:
      - "src/aidy/goldthinker_factory_contract.py"
      - "scripts/goldthinker_factory/**"
      - "tests/test_goldthinker_factory_*.py"
      - ".github/workflows/goldthinker-factory-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax check
        run: python -m compileall -q src/aidy/goldthinker_factory_contract.py scripts/goldthinker_factory/ tests/test_goldthinker_factory_contract.py
      - name: Run independent offline acceptance tests (zero broker/API credentials)
        run: python -m unittest discover -s tests -p "test_goldthinker_factory_*.py" -v
