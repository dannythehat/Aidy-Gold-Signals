name: Ops AIDY Live Provider Diagnostic 20260909

on:
  push:
    branches:
      - ops/live-provider-diagnostic-20260909
    paths:
      - .github/workflows/ops-aidy-live-provider-diagnostic-20260909.yml

permissions:
  contents: read

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query live AIDY heartbeat, request ledger, and snapshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          def d1(sql):
              endpoint=(
                  'https://api.cloudflare.com/client/v4/accounts/'
                  + os.environ['CLOUDFLARE_ACCOUNT_ID']
                  + '/d1/database/' + os.environ['AIDY_D1_DATABASE_ID'] + '/query'
              )
              body=json.dumps({'sql':sql,'params':[]}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={
                  'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],
                  'Content-Type':'application/json',
              })
              with urllib.request.urlopen(req,timeout=30) as response:
                  payload=json.load(response)
              if not payload.get('success'):
                  raise RuntimeError(payload)
              rows=[]
              for batch in payload.get('result') or []:
                  rows.extend(batch.get('results') or [])
              return rows

          with urllib.request.urlopen(os.environ['AIDY_TEST_WORKER_URL']+'/health?live_diag=20260909',timeout=30) as response:
              health=json.load(response)
          print('HEALTH='+json.dumps(health,sort_keys=True))

          ledger=d1('''
          SELECT requested_at_utc,completed_at_utc,status,error_code,request_kind,
                 outputsize,raw_bar_count,closed_bar_count,forming_bar_count,
                 off_session_bar_count,freshness_state
          FROM twelve_data_request_ledger
          WHERE request_kind='scheduled_capture'
          ORDER BY requested_at_utc DESC LIMIT 20
          ''')
          print('LEDGER='+json.dumps(ledger,sort_keys=True))

          snapshots=d1('''
          SELECT id,captured_at,capture_status,quote_time,quote_age_seconds,
                 latest_m1_id,latest_m5_id,latest_m15_id,latest_h1_id,latest_h4_id,latest_d1_id,
                 json_extract(data_availability_json,'$.request_kind') AS request_kind,
                 json_extract(data_availability_json,'$.request_ledger_status') AS request_ledger_status,
                 json_extract(data_availability_json,'$.freshness_state') AS freshness_state,
                 json_extract(data_availability_json,'$.all_timeframes_ready') AS all_timeframes_ready,
                 json_extract(data_availability_json,'$.observed_open_session_lag_seconds') AS observed_open_session_lag_seconds,
                 json_extract(data_availability_json,'$.bootstrap_required_m1_minutes') AS bootstrap_required_m1_minutes,
                 json_extract(data_availability_json,'$.bootstrap_required_m1_minutes_missing_from_vendor_fetch') AS missing_from_vendor_fetch,
                 json_extract(data_availability_json,'$.candles') AS candles
          FROM market_snapshots
          WHERE market_data_source='twelve_data'
          ORDER BY captured_at DESC,id DESC LIMIT 20
          ''')
          print('SNAPSHOTS='+json.dumps(snapshots,sort_keys=True))

          summary=d1('''
          SELECT
            SUM(CASE WHEN requested_at_utc>='2026-09-09T02:38:11+00:00' THEN 1 ELSE 0 END) AS scheduled_requests_since_restore,
            SUM(CASE WHEN requested_at_utc>='2026-09-09T02:38:11+00:00' AND status='succeeded' THEN 1 ELSE 0 END) AS succeeded_since_restore,
            SUM(CASE WHEN requested_at_utc>='2026-09-09T02:38:11+00:00' AND status='failed' THEN 1 ELSE 0 END) AS failed_since_restore,
            MAX(requested_at_utc) AS latest_request
          FROM twelve_data_request_ledger
          WHERE request_kind='scheduled_capture'
          ''')
          print('SUMMARY='+json.dumps(summary,sort_keys=True))
          PY
