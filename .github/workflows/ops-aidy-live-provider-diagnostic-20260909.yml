name: Ops AIDY Live Provider Diagnostic 20260909

on:
  push:
    branches:
      - ops/live-provider-diagnostic-20260909
    paths:
      - .github/workflows/ops-aidy-live-provider-diagnostic-20260909.yml

permissions:
  contents: read

env:
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  SCHEDULER_NAME: aidy-signals-scheduler-test

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read automatic Cron delivery and Provider Context only
        shell: bash
        run: |
          set -euo pipefail
          echo "verification_refresh=2026-09-09T03:49Z"
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'AIDY-live-diagnostic/20260909'}
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                  return json.load(r)
          def d1(sql):
              endpoint=base+'/d1/database/'+os.environ['AIDY_D1_DATABASE_ID']+'/query'
              req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':[]}).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: p=json.load(r)
              rows=[]
              for b in p.get('result') or []: rows.extend(b.get('results') or [])
              return rows
          schedules=get(base+'/workers/scripts/'+os.environ['SCHEDULER_NAME']+'/schedules')
          print('SCHEDULES='+json.dumps(schedules,sort_keys=True))
          ledger=d1("SELECT requested_at_utc,completed_at_utc,status,error_code,outputsize FROM twelve_data_request_ledger WHERE request_kind='scheduled_capture' AND requested_at_utc>='2026-09-09T03:22:27+00:00' ORDER BY requested_at_utc DESC LIMIT 50")
          print('AUTOMATIC_LEDGER='+json.dumps(ledger,sort_keys=True))
          snaps=d1("SELECT id,captured_at,capture_status,latest_m1_id,latest_m5_id,latest_m15_id,latest_h1_id,latest_h4_id,latest_d1_id,json_extract(data_availability_json,'$.all_timeframes_ready') AS all_timeframes_ready FROM market_snapshots WHERE market_data_source='twelve_data' ORDER BY captured_at DESC,id DESC LIMIT 10")
          print('SNAPSHOTS='+json.dumps(snaps,sort_keys=True))
          PY
