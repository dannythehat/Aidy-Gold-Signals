name: Oracle Gold phase04 shortlist evidence and cached benchmark
on:
  push:
    branches: ['codex/83-source-audit-batch01-20261028']
    paths:
      - 'reports/gold_oracle/phase04/review/**'
      - 'scripts/oracle_gold/phase04_review.py'
      - 'tests/test_oracle_gold_phase04_review.py'
      - 'research/gold_oracle/phase04/shortlist_policy.json'
      - '.github/workflows/oracle-gold-phase04-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproducible-review-no-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet backtrader==1.9.78.123 pandas==3.0.6 numpy==2.5.3 pytest==9.1.1 cryptography ruff pyyaml
      - name: Original256 evidence bytes, native compiler receipts and exact account archives
        run: |
          ruff check scripts/oracle_gold/phase04_review.py scripts/oracle_gold/dependency_inventory.py tests/test_oracle_gold_phase04_review.py
          python -m pytest -q tests/test_oracle_gold_phase03.py tests/test_oracle_gold_phase03_register.py tests/test_oracle_gold_phase04_review.py
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2023
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2023
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2024
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2024
      - uses: actions/download-artifact@v4
        with:
          name: oracle-minute-2025
          run-id: 40734084599
          github-token: ${{ github.token }}
          path: /tmp/oracle-cached/2025
      - name: Authorised cache unwrap only; no BigQuery/R2 read requests
        env:
          AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          for year in 2023 2024 2025; do
            python -m scripts.oracle_gold.snapshot_bundle open-ci --source "/tmp/oracle-cached/${year}/snapshot.encrypted.json" --out "/tmp/oracle-minutes/${year}"
          done
      - name: Regenerate benchmark, regimes, correlations and readiness from immutable evidence
        run: python -m scripts.oracle_gold.phase04_review --snapshots /tmp/oracle-minutes --out artifacts/oracle_gold/phase04_review
      - name: Compare committed decisions and numeric results with independent regeneration
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          def same(a,b):
              if isinstance(a,float) and isinstance(b,(float,int)):
                  assert math.isclose(a,b,rel_tol=1e-12,abs_tol=1e-8),(a,b)
              elif isinstance(a,dict):
                  assert a.keys()==b.keys()
                  for k in a: same(a[k],b[k])
              elif isinstance(a,list):
                  assert len(a)==len(b)
                  for x,y in zip(a,b,strict=True):same(x,y)
              else: assert a==b,(a,b)
          for p in Path('reports/gold_oracle/phase04/review').glob('*.json'):
              same(json.loads(p.read_text()),json.loads((Path('artifacts/oracle_gold/phase04_review')/p.name).read_text()))
          print('COMMITTED_REVIEW_REPRODUCED; no qualification or activation')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gold-phase04-shortlist-review-evidence
          path: artifacts/oracle_gold/phase04_review/
          retention-days: 90
          if-no-files-found: error
