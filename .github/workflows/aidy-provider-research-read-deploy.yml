name: AIDY Provider Research Read Deploy

# This workflow owns safe deployment of the read-only provider research surfaces.
# Public-runner retrigger marker: 2026-09-21 after test-fixture cleanup.
# It must deploy changes to either the raw market-read endpoint or the canonical
# Provider Context endpoint, and it must never strip scheduled capture or arm formal
# forward authority while doing so.

on:
  push:
    branches: [main]
    paths:
      - "src/aidy/provider_market_api.py"
      - "src/aidy/provider_context_api.py"
      - "src/aidy/gold_state_engine.py"
      - "src/aidy/gold_movement_investigator.py"
      - "src/aidy/gold_movement_memory.py"
      - "src/aidy/gold_cycle_environment.py"
      - "src/aidy/gold_environment_contract.py"
      - "src/aidy/gold_cycle_memory.py"
      - "src/aidy/gold_marker_brain.py"
      - "src/aidy/gold_toolbox_registry.py"
      - "src/aidy/gold_expert_gate_contract.py"
      - "src/aidy/gold_expert_trust.py"
      - "src/aidy/gold_expert_shadow.py"
      - "src/aidy/private_forward_context.py"
      - "src/aidy/twelve_data_intraday_repair.py"
      - "src/aidy/runtime.py"
      - "src/aidy/data_health.py"
      - "src/aidy/config.py"
      - "src/provider_entry.py"
      - "migrations/d1/0021_gold_movement_memory.sql"
      - "migrations/d1/0022_gold_movement_scan_ledger.sql"
      - "migrations/d1/0023_gold_cycle_learning.sql"
      - "migrations/d1/0024_gold_contextual_marker_learning.sql"
      - "migrations/d1/0025_gold_cycle_sync_health.sql"
      - "migrations/d1/0026_gold_expert_conditional_trust.sql"
      - "migrations/d1/0027_gold_expert_shadow_scorecard.sql"
      - "tests/test_gold_movement_memory.py"
      - "tests/test_gold_cycle_environment.py"
      - "tests/test_gold_cycle_memory.py"
      - "tests/test_gold_marker_brain.py"
      - "tests/test_gold_expert_gate_contract.py"
      - "tests/test_gold_expert_trust.py"
      - "tests/test_gold_expert_shadow.py"
      - ".github/workflows/aidy-provider-research-read-deploy.yml"
  workflow_dispatch:

concurrency:
  group: aidy-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install dependencies and check provider read paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check src/aidy/provider_market_api.py src/aidy/provider_context_api.py src/aidy/gold_state_engine.py src/aidy/gold_movement_investigator.py src/aidy/gold_movement_memory.py src/aidy/gold_cycle_environment.py src/aidy/gold_environment_contract.py src/aidy/gold_cycle_memory.py src/aidy/gold_marker_brain.py src/aidy/gold_toolbox_registry.py src/aidy/gold_expert_gate_contract.py src/aidy/gold_expert_trust.py src/aidy/gold_expert_shadow.py src/aidy/private_forward_context.py src/aidy/twelve_data_intraday_repair.py src/aidy/runtime.py src/aidy/data_health.py src/aidy/config.py src/provider_entry.py
          uv run python -m compileall -q src tests
          uv run pytest -q \
            tests/test_provider_market_api.py \
            tests/test_provider_context_api.py \
            tests/test_gold_state_engine.py \
            tests/test_gold_movement_investigator.py \
            tests/test_gold_movement_memory.py \
            tests/test_gold_cycle_environment.py \
            tests/test_gold_cycle_memory.py \
            tests/test_gold_marker_brain.py \
            tests/test_gold_expert_gate_contract.py \
            tests/test_gold_expert_trust.py \
            tests/test_gold_expert_shadow.py \
            tests/test_gold_evidence_dependency.py \
            tests/test_gold_environment_gate_selector.py \
            tests/test_gold_meta_direction.py \
            tests/test_gold_toolbox_registry.py \
            tests/test_twelve_data_intraday_repair.py \
            tests/test_aidy_data_health.py \
            tests/test_runtime_schedule.py \
            tests/test_twelve_data_retrospective.py

      - name: Build the Worker config, cron included
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from types import SimpleNamespace
          from aidy.config import AidySettings

          cfg = json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name'] = os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id'] = os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name'] = os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED'] = 'true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE'] = 'twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP'] = 'public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS'] = '300'
          cfg['vars']['AIDY_TWELVE_INTRADAY_SELF_HEAL_ENABLED'] = 'true'
          # Never arm formal forward execution from a research-read deploy.
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED'] = 'false'

          settings = AidySettings.from_worker_env(SimpleNamespace(**cfg['vars']))
          assert settings.capture_enabled is True
          assert settings.market_data_source == 'twelve_data'
          assert settings.market_data_ownership == 'public_independent'
          assert settings.twelve_intraday_self_heal_enabled is True
          assert str(cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']).lower() == 'false'
          # The minute cron is scheduled capture. A green deploy without this cron is a
          # capture outage, so assert it before deployment.
          assert cfg['triggers']['crons'] == ['* * * * *'], cfg['triggers']
          json.dump(cfg, open('wrangler.research.live.jsonc', 'w', encoding='utf-8'), indent=2)
          print('config_built_with_cron=true')
          PY

      - name: Apply Gold movement memory migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply AIDY_OPS --remote \
            --config wrangler.research.live.jsonc

      - name: Verify Build 3 trust schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT COUNT(*) AS n
              FROM sqlite_master
              WHERE type='table'
                AND name IN (
                  'aidy_gold_expert_outcome_ledger',
                  'aidy_gold_expert_context_scores'
                );
            " > /tmp/build3_schema.txt
          grep -q '"n": 2' /tmp/build3_schema.txt
          echo "build3_expert_trust_schema_present=true"

      - name: Verify Build 24 shadow schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT COUNT(*) AS n
              FROM sqlite_master
              WHERE type='table'
                AND name IN (
                  'aidy_gold_expert_shadow_runtime_state',
                  'aidy_gold_expert_shadow_cycles',
                  'aidy_gold_expert_gate_snapshots',
                  'aidy_gold_expert_subcalculator_snapshots',
                  'aidy_gold_meta_view_results',
                  'aidy_gold_expert_shadow_sync_health'
                );
            " > /tmp/build24_schema.txt
          grep -q '"n": 6' /tmp/build24_schema.txt
          echo "build24_shadow_schema_present=true"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "AIDY_DEPLOYED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          cp wrangler.research.live.jsonc wrangler.jsonc
          uv run pywrangler deploy

      - name: Verify configuration, cron and provider research routes
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' \
              "${AIDY_TEST_WORKER_URL}/health?research_deploy=${GITHUB_SHA}-${attempt}" \
              > /tmp/health.json || true
            if python - <<'PY'
          import json
          h = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source') == 'twelve_data', h
          assert h.get('market_data_ownership') == 'public_independent', h
          assert h.get('provider_context_api_version') == 'aidy_provider_context_api_v5', h
          assert h.get('gold_state_engine_version') == 'aidy_gold_state_engine_v1', h
          assert h.get('provider_gold_state_version') == 'aidy_provider_gold_state_v2', h
          assert h.get('gold_movement_investigator_version') == 'aidy_gold_movement_investigator_v1', h
          assert h.get('gold_movement_memory_version') == 'aidy_gold_movement_memory_v1', h
          assert h.get('gold_cycle_memory_version') == 'aidy_gold_cycle_memory_v3', h
          assert h.get('gold_cycle_environment_version') == 'aidy_gold_cycle_environment_v3', h
          assert h.get('gold_marker_brain_version') == 'aidy_gold_contextual_marker_brain_v2', h
          assert h.get('gold_toolbox_manifest_version') == 'aidy_gold_toolbox_manifest_v1', h
          assert h.get('gold_expert_shadow_version') == 'aidy_gold_expert_shadow_v1', h
          assert h.get('gold_expert_scorecard_version') == 'aidy_gold_expert_scorecard_v1', h
          PY
            then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

          # The cron is the thing most easily lost by a rebuilt config, so verify it
          # against Cloudflare rather than trusting the local file.
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aidy-signals-test/schedules" \
            > /tmp/schedules.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/schedules.json', encoding='utf-8'))
          crons = {s.get('cron') for s in (payload.get('result') or {}).get('schedules', [])}
          assert '* * * * *' in crons, payload
          print('capture_cron_present=true')
          PY

          # 401 proves both routes are present and remain authenticated.
          market_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${AIDY_TEST_WORKER_URL}/research/market/ohlc?symbol=XAUUSD&timeframe=1m")"
          test "$market_code" = "401"
          context_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${AIDY_TEST_WORKER_URL}/provider/context?as_of=2026-09-16T00:00:00%2B00:00")"
          test "$context_code" = "401"
          echo "provider_research_routes_live_and_authenticated=true"

          # Prove the autonomous 15-minute Gold learner is writing auditable views.
          # Do not print the reasoning text itself while the repository is temporarily public.
          npx --yes wrangler@4 d1 execute AIDY_OPS --remote \
            --config wrangler.research.live.jsonc \
            --command "
              SELECT
                window_start_utc,
                decided_at_utc,
                observed_state,
                view_direction,
                CASE WHEN length(reasoning_summary)>0 THEN 1 ELSE 0 END AS has_reasoning,
                json_array_length(supporting_reasons_json) AS supporting_reason_count,
                json_array_length(contradicting_reasons_json) AS contradicting_reason_count,
                json_array_length(unavailable_evidence_json) AS unavailable_evidence_count,
                json_array_length(v.toolbox_considered_json) AS toolbox_considered_count,
                json_array_length(v.toolbox_used_json) AS toolbox_used_count,
                json_array_length(json_extract(v.evidence_json,'$.tool_reasoning_trace')) AS tool_trace_count,
                (
                  SELECT COUNT(*)
                  FROM json_each(json_extract(v.evidence_json,'$.tool_reasoning_trace'))
                  WHERE COALESCE(TRIM(json_extract(value,'$.readable_state')),'')=''
                ) AS tool_trace_missing_readable,
                (
                  SELECT COUNT(*)
                  FROM json_each(json_extract(v.evidence_json,'$.tool_reasoning_trace'))
                  WHERE COALESCE(TRIM(json_extract(value,'$.reasoning_action')),'')=''
                ) AS tool_trace_missing_action,
                (
                  SELECT COUNT(*)
                  FROM json_each(json_extract(v.evidence_json,'$.all_directional_reasons'))
                  WHERE COALESCE(TRIM(json_extract(value,'$.selected_score_context')),'')=''
                ) AS reasons_missing_score_context,
                json_array_length(json_extract(e.environment_json,'$.toolbox_coverage')) AS environment_tool_coverage_count,
                e.environment_version,
                json_extract(e.environment_json,'$.environment_key') AS environment_key,
                json_extract(e.environment_json,'$.environment_contract.schema_version') AS environment_contract_schema,
                json_extract(e.environment_json,'$.environment_contract.dimension_count') AS environment_dimension_count,
                json_extract(e.environment_json,'$.environment_contract.monolithic_full_environment_key_used') AS monolithic_full_environment_key_used,
                (
                  SELECT COUNT(*)
                  FROM json_each(json_extract(e.environment_json,'$.scopes'))
                  WHERE json_extract(value,'$.scope_type')='full_environment'
                ) AS full_environment_scope_count,
                v.future_values_used,
                v.live_money_execution_allowed
              FROM aidy_gold_cycle_views v
              JOIN aidy_gold_cycle_environments e ON e.cycle_view_id=v.cycle_view_id
              WHERE e.environment_version='aidy_gold_cycle_environment_v3'
              ORDER BY v.window_start_utc DESC
              LIMIT 1;
            " > /tmp/cycle-live-audit.json
          cat /tmp/cycle-live-audit.json
          python - <<'PY'
          import json
          text=open('/tmp/cycle-live-audit.json', encoding='utf-8').read()
          starts=[i for i in range(len(text)) if text.startswith('[', i)]
          payload=None
          for start in reversed(starts):
              try:
                  payload=json.loads(text[start:])
                  break
              except json.JSONDecodeError:
                  continue
          assert isinstance(payload, list), text[-2000:]
          rows=(payload[0] or {}).get('results') or []
          assert rows, payload
          row=rows[0]
          assert row.get('has_reasoning') == 1, row
          from datetime import datetime
          considered=int(row.get('toolbox_considered_count') or 0)
          trace_count=int(row.get('tool_trace_count') or 0)
          coverage_count=int(row.get('environment_tool_coverage_count') or 0)
          assert considered >= 30, row
          assert coverage_count == considered, row
          assert int(row.get('toolbox_used_count') or 0) >= 1, row
          assert row.get('future_values_used') == 0, row
          deployed=datetime.fromisoformat(__import__('os').environ['AIDY_DEPLOYED_AT_UTC'])
          decided=datetime.fromisoformat(row['decided_at_utc'])
          post_deploy=decided >= deployed
          assert row.get('environment_version') == 'aidy_gold_cycle_environment_v3', row
          assert str(row.get('environment_key') or '').startswith('envcore_'), row
          assert row.get('environment_contract_schema') == 'aidy_gold_environment_contract_schema_v1', row
          assert int(row.get('environment_dimension_count') or 0) == 34, row
          assert int(row.get('monolithic_full_environment_key_used') or 0) == 0, row
          assert int(row.get('full_environment_scope_count') or 0) == 0, row
          if post_deploy:
              assert trace_count == considered, row
              assert int(row.get('tool_trace_missing_readable') or 0) == 0, row
              assert int(row.get('tool_trace_missing_action') or 0) == 0, row
              assert int(row.get('reasons_missing_score_context') or 0) == 0, row
          else:
              print(
                  'awaiting_first_post_deploy_cycle=true '
                  f"latest_window={row.get('window_start_utc')} "
                  f"latest_decided_at={row.get('decided_at_utc')}"
              )
          assert row.get('live_money_execution_allowed') == 0, row
          print(
              'cycle_reasoning_audit=true '
              f"window={row.get('window_start_utc')} "
              f"observed={row.get('observed_state')} "
              f"view={row.get('view_direction')} "
              f"supporting={row.get('supporting_reason_count')} "
              f"contradicting={row.get('contradicting_reason_count')} "
              f"unavailable={row.get('unavailable_evidence_count')} "
              f"toolbox_used={row.get('toolbox_used_count')} "
              f"tool_trace={row.get('tool_trace_count')} "
              f"environment_coverage={row.get('environment_tool_coverage_count')} "
              f"environment_version={row.get('environment_version')} "
              f"environment_key={row.get('environment_key')} "
              f"environment_dimensions={row.get('environment_dimension_count')} "
              f"missing_readable={row.get('tool_trace_missing_readable')} "
              f"missing_score_context={row.get('reasons_missing_score_context')} "
              f"post_deploy_cycle={post_deploy}"
          )
          PY
