name: AIDY Provider Research Read Deploy

# Two things this exists for.
#
# The research read path had no deploy trigger. Every workflow that pushes this Worker is
# filtered to the files its own feature touches, and none of them lists
# src/aidy/provider_market_api.py, so a fix to the research endpoint merged to main and
# simply never reached production.
#
# And the deploy must not strip the Worker's cron triggers. wrangler.test.example.jsonc
# declares crons ['* * * * *'] and /health reports scheduler "direct-cron": the minute
# cron IS scheduled capture. A deploy that rebuilds the config without it silently ends
# live capture, which is what happened on 2026-09-15 -- the last scheduled success was
# 03:52, minutes after a deploy that set triggers.crons to []. This one asserts the cron
# survives, before and after.

on:
  push:
    branches: [main]
    paths:
      - "src/aidy/provider_market_api.py"
      - "src/provider_entry.py"
      - ".github/workflows/aidy-provider-research-read-deploy.yml"
  workflow_dispatch:

concurrency:
  group: aidy-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIDY_TEST_WORKER_URL: https://aidy-signals-test.dannythehat2.workers.dev
  AIDY_D1_DATABASE_NAME: aidy-ops-test
  AIDY_D1_DATABASE_ID: 3588d82a-d686-4430-872d-d4c0e62c3d5d
  AIDY_R2_BUCKET_NAME: aidy-memory-test

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install dependencies and check the read path
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync
          uv run ruff check src/aidy/provider_market_api.py src/provider_entry.py
          uv run python -m compileall -q src tests
          uv run pytest -q tests/test_provider_market_api.py tests/test_twelve_data_retrospective.py

      - name: Build the Worker config, cron included
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from types import SimpleNamespace
          from aidy.config import AidySettings

          cfg = json.load(open('wrangler.test.example.jsonc', encoding='utf-8'))
          cfg['d1_databases'][0]['database_name'] = os.environ['AIDY_D1_DATABASE_NAME']
          cfg['d1_databases'][0]['database_id'] = os.environ['AIDY_D1_DATABASE_ID']
          cfg['r2_buckets'][0]['bucket_name'] = os.environ['AIDY_R2_BUCKET_NAME']
          cfg['vars']['AIDY_CAPTURE_ENABLED'] = 'true'
          cfg['vars']['AIDY_MARKET_DATA_SOURCE'] = 'twelve_data'
          cfg['vars']['AIDY_MARKET_DATA_OWNERSHIP'] = 'public_independent'
          cfg['vars']['AIDY_MARKET_POLL_SECONDS'] = '300'
          # Never armed from here. Deploying the research read path is not an occasion
          # to change forward authority.
          cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED'] = 'false'

          settings = AidySettings.from_worker_env(SimpleNamespace(**cfg['vars']))
          assert settings.capture_enabled is True
          assert settings.market_data_source == 'twelve_data'
          assert settings.market_data_ownership == 'public_independent'
          assert str(cfg['vars']['AIDY_FORMAL_FORWARD_ENABLED']).lower() == 'false'
          # The minute cron is scheduled capture. Deploying without it stops the
          # capture this system depends on, silently and with a green deploy.
          assert cfg['triggers']['crons'] == ['* * * * *'], cfg['triggers']
          json.dump(cfg, open('wrangler.research.live.jsonc', 'w', encoding='utf-8'), indent=2)
          print('config_built_with_cron=true')
          PY

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.research.live.jsonc wrangler.jsonc
          uv run pywrangler deploy

      - name: Verify configuration, cron and the research route
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' \
              "${AIDY_TEST_WORKER_URL}/health?research_deploy=${GITHUB_SHA}-${attempt}" \
              > /tmp/health.json || true
            if python - <<'PY'
          import json
          h = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('capture_enabled') is True, h
          assert h.get('formal_forward_enabled') is False, h
          assert h.get('market_data_source') == 'twelve_data', h
          assert h.get('market_data_ownership') == 'public_independent', h
          PY
            then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

          # The cron is the thing most easily lost by a rebuilt config, so it is checked
          # against Cloudflare rather than inferred from the file we just wrote.
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aidy-signals-test/schedules" \
            > /tmp/schedules.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/schedules.json', encoding='utf-8'))
          crons = {s.get('cron') for s in (payload.get('result') or {}).get('schedules', [])}
          assert '* * * * *' in crons, payload
          print('capture_cron_present=true')
          PY

          # A 401 proves the route is served and still requires authorisation.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${AIDY_TEST_WORKER_URL}/research/market/ohlc?symbol=XAUUSD&timeframe=1m")"
          test "$code" = "401"
          echo "research_route_live_and_authenticated=true"
