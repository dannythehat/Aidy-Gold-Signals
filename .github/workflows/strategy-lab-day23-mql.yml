name: Strategy Lab Day23 MQL4 MQL5 Adapter and Real XAUUSD Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/aidy/strategy_lab_mql_adapter.py
      - src/aidy/strategy_lab_customer_mql_intake.py
      - tests/test_strategy_lab_mql_adapter.py
      - tests/test_strategy_lab_day23_real_mql.py
      - scripts/strategy_lab/day23_real_mql_audit.py
      - scripts/strategy_lab/day23_triage_customer_mql.py
      - research/strategy_lab/fixtures/day23_internal_closed_cross.mq4
      - research/strategy_lab/fixtures/day23_internal_closed_cross.mq5
      - docs/strategy-lab-day23-mql-intake-and-parity.md
      - .github/workflows/strategy-lab-day23-mql.yml

permissions:
  contents: read

jobs:
  day23-technical-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AIDY_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.AIDY_GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CI dependencies
        run: python -m pip install --quiet pytest ruff 'google-cloud-bigquery>=3.42,<4'
      - name: Syntax and lint gate
        run: |
          python -m compileall -q src/aidy/strategy_lab_mql_adapter.py src/aidy/strategy_lab_customer_mql_intake.py scripts/strategy_lab/day23_real_mql_audit.py scripts/strategy_lab/day23_triage_customer_mql.py tests/test_strategy_lab_mql_adapter.py tests/test_strategy_lab_day23_real_mql.py
          ruff check src/aidy/strategy_lab_mql_adapter.py src/aidy/strategy_lab_customer_mql_intake.py scripts/strategy_lab/day23_real_mql_audit.py scripts/strategy_lab/day23_triage_customer_mql.py tests/test_strategy_lab_mql_adapter.py tests/test_strategy_lab_day23_real_mql.py
      - name: Source integrity, customer intake, two MQL languages and Day20-22 regressions
        run: PYTHONPATH=src:tests:. python -m pytest -q tests/test_strategy_lab_mql_adapter.py tests/test_strategy_lab_day23_real_mql.py tests/test_strategy_lab_day22_real_history.py tests/test_strategy_lab_pine_adapter.py tests/test_strategy_lab_written_rule_intake.py
      - name: Real read-only BigQuery closed-M5 MQL4/MQL5 signal and opposite-exit comparison
        run: PYTHONPATH=src:. python scripts/strategy_lab/day23_real_mql_audit.py
      - name: Customer files need no MetaTrader installation
        run: |
          PYTHONPATH=src python scripts/strategy_lab/day23_triage_customer_mql.py research/strategy_lab/fixtures/day23_internal_closed_cross.mq4
          PYTHONPATH=src python scripts/strategy_lab/day23_triage_customer_mql.py research/strategy_lab/fixtures/day23_internal_closed_cross.mq5
          sha256sum research/strategy_lab/fixtures/day23_internal_closed_cross.mq4 research/strategy_lab/fixtures/day23_internal_closed_cross.mq5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day23-real-history-mql4-mql5-independent-predicate-proof
          path: artifacts/strategy_lab/day23_real_mql_audit.json
          retention-days: 90
