name: AIDY Day 6 Archive Dead Letter Acceptance

on:
  push:
    branches: [ops/day6-archive-dead-letter-20260906]
    paths:
      - "migrations/d1/0014_archive_delivery_state.sql"
      - "src/aidy/storage_contracts.py"
      - "src/aidy/cross_market_storage.py"
      - "tests/test_day6_archive_dead_letter.py"
      - ".github/workflows/day6-archive-dead-letter-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "migrations/d1/0014_archive_delivery_state.sql"
      - "src/aidy/storage_contracts.py"
      - "src/aidy/cross_market_storage.py"
      - "tests/test_day6_archive_dead_letter.py"
      - ".github/workflows/day6-archive-dead-letter-acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync

      - name: Static and compile checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src/aidy/storage_contracts.py src/aidy/cross_market_storage.py tests/test_day6_archive_dead_letter.py
          uv run python -m compileall -q src tests

      - name: Day 6 adversarial archive tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_day6_archive_dead_letter.py tests/test_storage_contracts.py tests/test_d1_storage_local.py

      - name: Full repository regression
        shell: bash
        run: uv run pytest -q
