[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aidy-gold-signals"
version = "0.1.0"
description = "AIDY Signals Gold market intelligence and Telegram signal provider"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "tzdata>=2025.2",
  "xlrd>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "workers-py",
  "workers-runtime-sdk",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
postgres-reference = [
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]
offline-pdf-research = [
  "pdfplumber>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["aidy"]

[tool.ruff.lint.per-file-ignores]
# Official agency schedules expose America/New_York wall times. These parsers
# deliberately construct a naive wall clock and immediately pass it through
# AIDY's explicit DST-aware Eastern-to-UTC converter.
"src/aidy/official_macro.py" = ["DTZ001", "DTZ007", "SIM117"]
"src/aidy/fomc_calendar_parser.py" = ["DTZ001"]
# Day 52 is an immutable historical orchestration surface. The Day 53 semantic
# launch adapter adds one guarded import seam without reformatting that frozen
# file wholesale; behavior and full-regression coverage remain authoritative.
"src/aidy/end_to_end.py" = ["I001"]
# math.ceil already returns int on CPython; the explicit cast documents the
# persisted conservative-age type and is intentionally harmless.
"src/aidy/private_forward_context.py" = ["RUF046"]
# The private-forward observer must convert any decision-context construction
# defect into an immutable fail-closed observation after capture. Restricting
# this catch to today’s exception classes would permit a new adapter failure to
# escape without that audit record.
"src/aidy/forward_live_observer.py" = ["BLE001"]
# Worker test/admin endpoints and the queue boundary deliberately use broad
# fail-safe catches: probe cleanup must not hide the primary diagnostic, capture
# failures must retry, and a post-capture observer failure must never duplicate
# an already-successful market capture. Inline comments document each boundary;
# RUF100 is ignored so those safety annotations remain visible even when the
# corresponding optional lint family is not selected by a historical workflow.
"src/entry.py" = ["BLE001", "S110", "RUF100"]
# Day-26 price-structure tests intentionally construct Decimal values from
# explicit strings so fixture values remain visibly decimal and exact.
"tests/test_day26_price_structure.py" = ["FURB157"]

