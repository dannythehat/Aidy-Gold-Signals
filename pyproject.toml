[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aidy-gold-signals"
version = "0.1.0"
description = "AIDY Signals Gold market intelligence and Telegram signal provider"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "tzdata>=2025.2",
  "xlrd>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "workers-py",
  "workers-runtime-sdk",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
postgres-reference = [
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]
offline-pdf-research = [
  "pdfplumber>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["aidy"]

[tool.ruff.lint.per-file-ignores]
# Official agency schedules expose America/New_York wall times. These parsers
# deliberately construct a naive wall clock and immediately pass it through
# AIDY's explicit DST-aware Eastern-to-UTC converter.
"src/aidy/official_macro.py" = ["DTZ001", "DTZ007", "SIM117"]
"src/aidy/fomc_calendar_parser.py" = ["DTZ001"]
# Day-26 price-structure tests intentionally construct Decimal values from
# explicit strings so fixture values remain visibly decimal and exact.
"tests/test_day26_price_structure.py" = ["FURB157"]
