[project]
name = "aidy-gold-signals"
version = "0.1.0"
description = "AIDY Signals Gold market intelligence and Telegram signal provider"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
